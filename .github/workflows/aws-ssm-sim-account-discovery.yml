name: AWS SSM SIM Account Discovery

on:
  workflow_dispatch:

concurrency:
  group: aws-ssm-sim-account-discovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  read-only-sim-account-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: github-sim-discovery-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify fixed target instance
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-instances \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"

      - name: Send fixed read-only account query
        id: send-command
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' remote_script <<'REMOTE' || true
          set -u
          echo '=== OPEND US SIMULATE ACCOUNT DISCOVERY READ-ONLY PROBE ==='
          echo 'ACCOUNT_MUTATIONS=NONE'
          echo 'LIVE_TRADE=NO'
          HOME=/root /opt/stock-razor-opend-client/venv/bin/python - <<'PY'
          import json
          from datetime import datetime, timezone
          import futu as ft

          out = {
              "probe": "us_opend_sim_account_discovery_v0_1",
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "opend_reachable": False,
              "query_status": "UNKNOWN",
              "simulated_us_account_count": 0,
              "account_evidence": "NOT_VERIFIED",
              "balance_readback": "NOT_RUN",
              "positions_readback": "NOT_RUN",
              "orders_readback": "NOT_RUN",
              "history_readback": "NOT_RUN",
              "position_review": "UNKNOWN",
              "order_review": "UNKNOWN",
              "sim_native_fills": "UNSUPPORTED_BY_OPEND",
              "paper_preflight": "BLOCKED",
              "paper_auto_ready": False,
              "radar_admission": "BLOCKED",
              "source_arbiter_admission": "BLOCKED",
              "live_trade": False,
          }

          def count_sim_us_rows(data):
              # Official get_acc_list rows expose trdmarket_auth as a list,
              # while acc_id may be an integer. Account IDs/card numbers are
              # never copied into the SSM workflow summary.
              if not hasattr(data, "to_dict"):
                  return 0
              try:
                  rows = data.to_dict("records")
              except Exception:
                  return 0
              count = 0
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  env = row.get("trd_env")
                  auth = row.get("trdmarket_auth")
                  kind = row.get("sim_acc_type")
                  status = row.get("acc_status")
                  if (
                      isinstance(env, str)
                      and env.upper() == "SIMULATE"
                      and isinstance(auth, (list, tuple))
                      and any(isinstance(item, str) and item.upper() == "US" for item in auth)
                      and isinstance(kind, str)
                      and kind.upper() == "STOCK_AND_OPTION"
                      and isinstance(status, str)
                      and status.upper() == "ACTIVE"
                  ):
                      count += 1
              return count

          def select_us_sim_id(data):
              # Account discovery may include REAL accounts; read no REAL
              # account funds, positions, orders or order histories.
              if count_sim_us_rows(data) != 1:
                  return None
              try:
                  rows = data.to_dict("records")
              except Exception:
                  return None
              candidates = [
                  row.get("acc_id") for row in rows
                  if isinstance(row, dict)
                  and row.get("trd_env") == "SIMULATE"
                  and isinstance(row.get("trdmarket_auth"), (list, tuple))
                  and "US" in row.get("trdmarket_auth")
                  and row.get("sim_acc_type") == "STOCK_AND_OPTION"
                  and row.get("acc_status") == "ACTIVE"
              ]
              if len(candidates) != 1:
                  return None
              value = candidates[0]
              if type(value) is int and 0 < value < 10**20:
                  return value
              if isinstance(value, str) and value.isascii() and value.isdigit():
                  if 1 <= len(value) <= 20 and int(value) > 0:
                      return int(value)
              return None

          def scoped_readback(call, *, required_rows=None):
              # Return only (status, count) in memory; never print the
              # broker's raw dataframe, error message, IDs, or dollar values.
              try:
                  ret, data = call()
                  if ret != ft.RET_OK or not hasattr(data, "columns"):
                      return "UNAVAILABLE", None
                  n = len(data)
                  if type(n) is not int or not 0 <= n <= 10000:
                      return "INVALID", None
                  if required_rows is not None and n != required_rows:
                      return "INVALID", None
                  return "PASS", n
              except Exception:
                  return "ERROR", None

          def read_sim_account_baseline(ctx, acc_id):
              # Four fixed, non-mutating calls against one explicit SIM ID.
              # No trade unlock, order, cancel, paid provider or refresh.
              from datetime import timedelta
              now = datetime.now(timezone.utc)
              start = (now - timedelta(days=89)).strftime("%Y-%m-%d")
              end = now.strftime("%Y-%m-%d")
              result = {}
              b, _ = scoped_readback(
                  lambda: ctx.accinfo_query(
                      trd_env=ft.TrdEnv.SIMULATE, acc_id=acc_id,
                      currency=ft.Currency.USD, refresh_cache=False
                  ), required_rows=1
              )
              p, positions_n = scoped_readback(
                  lambda: ctx.position_list_query(
                      trd_env=ft.TrdEnv.SIMULATE, acc_id=acc_id,
                      refresh_cache=False
                  )
              )
              o, orders_n = scoped_readback(
                  lambda: ctx.order_list_query(
                      trd_env=ft.TrdEnv.SIMULATE, acc_id=acc_id,
                      refresh_cache=False
                  )
              )
              h, _ = scoped_readback(
                  lambda: ctx.history_order_list_query(
                      trd_env=ft.TrdEnv.SIMULATE, acc_id=acc_id,
                      start=start, end=end
                  )
              )
              result["balance_readback"] = b
              result["positions_readback"] = p
              result["orders_readback"] = o
              result["history_readback"] = h
              result["position_review"] = (
                  "REQUIRED" if p == "PASS" and positions_n > 0
                  else "NOT_REQUIRED" if p == "PASS" else "UNKNOWN"
              )
              result["order_review"] = (
                  "REQUIRED" if o == "PASS" and orders_n > 0
                  else "NOT_REQUIRED" if o == "PASS" else "UNKNOWN"
              )
              # Even four PASSes are scoped I/O evidence, not native SIM
              # fills, broker permission, cloud deployment or Paper admission.
              return result

          ctx = None
          try:
              ctx = ft.OpenSecTradeContext(
                  filter_trdmarket=ft.TrdMarket.US,
                  host="127.0.0.1",
                  port=11111,
              )
              ret, data = ctx.get_acc_list()
              out["opend_reachable"] = (ret == ft.RET_OK)
              if ret == ft.RET_OK:
                  count = count_sim_us_rows(data)
                  out["query_status"] = "PASS"
                  out["simulated_us_account_count"] = count
                  # Account-list presence does NOT independently prove
                  # authenticated identity, current positions or order truth.
                  out["account_evidence"] = (
                      "OBSERVED_NOT_VERIFIED" if count > 0
                      else "BLOCKED_NO_US_SIMULATE_ROWS"
                  )
                  sim_id = select_us_sim_id(data)
                  if count == 1 and sim_id is not None:
                      # Sensitive SIM ID is local process memory only.
                      out.update(read_sim_account_baseline(ctx, sim_id))
                  # Zero/multiple/malformed candidate: never query any
                  # potentially REAL account by default index.
              else:
                  out["query_status"] = "PROVIDER_REJECTED"
          except Exception as exc:
              out["query_status"] = "ERROR"
              out["error_class"] = type(exc).__name__
          finally:
              if ctx is not None:
                  try:
                      ctx.close()
                  except Exception:
                      pass

          print("SIM_ACCOUNT_DISCOVERY_SUMMARY=" + json.dumps(out, separators=(",", ":"), sort_keys=True))
          print("ACCOUNT_MUTATIONS=NONE")
          print("RADAR_ADMISSION=BLOCKED")
          print("SOURCE_ARBITER_ADMISSION=BLOCKED")
          print("LIVE_TRADE=NO")
          PY
          REMOTE
          commands="$(jq -c -n --arg script "$remote_script" '[ $script ]')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "{\"commands\":$commands}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for read-only result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success)
                # AWS SDK/SSM raw output can include account data. Project
                # only the tagged, allowlisted JSON, never raw stdout/stderr.
                raw="$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --query StandardOutputContent --output text)"
                summary="$(grep -E '^SIM_ACCOUNT_DISCOVERY_SUMMARY=' <<<"$raw" | tail -n 1 || true)"
                test -n "$summary" || { echo 'SIM_DISCOVERY_SUMMARY_MISSING' >&2; exit 1; }
                safe="$(jq -cen --arg sha "$SOURCE_SHA" --argjson v "${summary#SIM_ACCOUNT_DISCOVERY_SUMMARY=}" '
                  {
                    probe: (if $v.probe == "us_opend_sim_account_discovery_v0_1" then $v.probe else "INVALID" end),
                    source_revision: (if ($sha | test("^[a-f0-9]{40}$")) then $sha else "UNKNOWN" end),
                    observed_at_utc: (if ($v.observed_at_utc | type) == "string" and ($v.observed_at_utc | test("^[0-9T:+.Z-]{20,40}$")) then $v.observed_at_utc else "UNKNOWN" end),
                    query_status: (if ($v.query_status | type) == "string" and (["PASS","PROVIDER_REJECTED","ERROR","UNKNOWN"] | index($v.query_status)) != null then $v.query_status else "UNKNOWN" end),
                    opend_reachable: ($v.opend_reachable == true),
                    simulated_us_account_count: (
                      if ($v.simulated_us_account_count | type) == "number"
                         and $v.simulated_us_account_count >= 0
                         and $v.simulated_us_account_count <= 1000
                      then $v.simulated_us_account_count else 0 end
                    ),
                    account_evidence: (if ($v.account_evidence | type) == "string" and (["OBSERVED_NOT_VERIFIED","BLOCKED_NO_US_SIMULATE_ROWS","NOT_VERIFIED"] | index($v.account_evidence)) != null then $v.account_evidence else "NOT_VERIFIED" end),
                    balance_readback: (if (["PASS","INVALID","ERROR","UNAVAILABLE","NOT_RUN"] | index($v.balance_readback)) != null then $v.balance_readback else "NOT_RUN" end),
                    positions_readback: (if (["PASS","INVALID","ERROR","UNAVAILABLE","NOT_RUN"] | index($v.positions_readback)) != null then $v.positions_readback else "NOT_RUN" end),
                    orders_readback: (if (["PASS","INVALID","ERROR","UNAVAILABLE","NOT_RUN"] | index($v.orders_readback)) != null then $v.orders_readback else "NOT_RUN" end),
                    history_readback: (if (["PASS","INVALID","ERROR","UNAVAILABLE","NOT_RUN"] | index($v.history_readback)) != null then $v.history_readback else "NOT_RUN" end),
                    position_review: (if (["UNKNOWN","REQUIRED","NOT_REQUIRED"] | index($v.position_review)) != null then $v.position_review else "UNKNOWN" end),
                    order_review: (if (["UNKNOWN","REQUIRED","NOT_REQUIRED"] | index($v.order_review)) != null then $v.order_review else "UNKNOWN" end),
                    sim_native_fills: "UNSUPPORTED_BY_OPEND",
                    paper_preflight: "BLOCKED",
                    paper_auto_ready: false,
                    radar_admission: "BLOCKED",
                    source_arbiter_admission: "BLOCKED",
                    live_trade: false
                  }
                ')"
                echo "SIM_ACCOUNT_DISCOVERY_SUMMARY=$safe"
                # SSM Success means the shell finished, NOT that a unique
                # SIM account or any of the four readbacks succeeded.
                # Independently gate the job conclusion on the sanitized
                # finite fields only. Keep position review as an explicit
                # condition, not an excuse to hide completed read-only I/O.
                if ! jq -en --argjson v "$safe" --arg sha "$SOURCE_SHA" '
                  $v.probe == "us_opend_sim_account_discovery_v0_1"
                  and $v.source_revision == $sha
                  and ($v.observed_at_utc | type) == "string"
                  and $v.observed_at_utc != "UNKNOWN"
                  and $v.query_status == "PASS"
                  and $v.opend_reachable == true
                  and $v.simulated_us_account_count == 1
                  and $v.account_evidence == "OBSERVED_NOT_VERIFIED"
                  and $v.balance_readback == "PASS"
                  and $v.positions_readback == "PASS"
                  and $v.orders_readback == "PASS"
                  and $v.history_readback == "PASS"
                  and ($v.position_review == "REQUIRED" or $v.position_review == "NOT_REQUIRED")
                  and ($v.order_review == "REQUIRED" or $v.order_review == "NOT_REQUIRED")
                  and $v.sim_native_fills == "UNSUPPORTED_BY_OPEND"
                  and $v.paper_preflight == "BLOCKED"
                  and $v.paper_auto_ready == false
                  and $v.radar_admission == "BLOCKED"
                  and $v.source_arbiter_admission == "BLOCKED"
                  and $v.live_trade == false
                ' >/dev/null; then
                  echo "SIM_READBACK=BLOCKED_OR_INCOMPLETE" >&2
                  exit 1
                fi
                echo "SIM_READBACK=PASS_PAPER_BLOCKED"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SIM_DISCOVERY_SSM_STATUS=$status" >&2
                # No raw stdout/stderr or provider account data in Actions.
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for read-only SSM result' >&2
          exit 1
