name: Audit TickFlow AWS Research Feed and MCP (Read Only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify fixed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/audit_cn_tickflow_research_runtime.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-research-readonly-audit
          aws-region: ap-northeast-1
      - name: Verify two isolated AWS snapshots 65 seconds apart
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum scripts/audit_cn_tickflow_research_runtime.py | cut -d' ' -f1)"
          bundle="$(gzip -n -9 -c scripts/audit_cn_tickflow_research_runtime.py | base64 -w0)"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          scratch=\$(mktemp -d)
          trap 'rm -rf "\$scratch"' EXIT
          printf '%s' '$bundle' | base64 -d | gzip -d > "\$scratch/observe.py"
          printf '%s  %s\n' '$hash' "\$scratch/observe.py" | sha256sum -c - >/dev/null
          python3 "\$scratch/observe.py" --interval 65
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 19000
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 170 --query Command.CommandId --output text)"
          test -n "$cid"
          state=""
          for _ in $(seq 1 70); do
            state="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 3
          done
          if [[ "$state" != "Success" ]]; then
            echo "CN_TICKFLOW_RESEARCH_AUDIT=BLOCKED"
            echo "SSM_PRIVATE_DETAILS_WITHHELD=YES"
            exit 1
          fi
          raw="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s' "$raw" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d.get("schema")=="stock_razor_tickflow_aws_research_acceptance_v0_1"
          assert d.get("source_arbiter_admission")=="BLOCKED"
          assert d.get("radar_admission")=="BLOCKED"
          assert d.get("live_trade")=="NO"
          assert d.get("canonical_write")=="NO"
          assert d.get("exchange_finality")=="NOT_VERIFIED"
          assert d.get("cross_provider_parity")=="NOT_VERIFIED"
          assert type(d.get("sequence_advanced")) is bool
          assert type(d.get("limited_research_usable")) is bool
          assert type(d.get("historical_research_usable")) is bool
          keys=("status","failure_stage","failure_reason","unit_active","mcp_unit_active","cache_private",
                "repo_sha_match","sequence","cache_age_seconds","mcp_read_failure_reason",
                "mcp_cache_consumer","mcp_historical_consumer",
                "all_four_readonly_requests_ok","all_four_historical_requests_ok")
          periods=("159611_SZ_15m","159611_SZ_60m","518880_SH_15m","518880_SH_60m")
          states=("PASS_RESEARCH_ONLY","BAR_LABEL_BEHIND_SESSION","STALE",
                  "NO_DATA","INVALID_CACHE","INVALID_REQUEST")
          historical_states=("PASS_HISTORICAL_ONLY","STALE","NO_DATA","INVALID_CACHE","INVALID_REQUEST")
          reasons=("NOT_VERIFIED","NOT_APPLICABLE","METHOD_RETURN_BLOCKED",
                   "IMPORT_OR_RUNTIME_FAILURE","SERVICE_PATH_MISSING")
          for when in ("before","after"):
              assert d[when].get("mcp_read_failure_reason") in reasons
              period_map=d[when].get("per_period_observation")
              assert isinstance(period_map,dict)
              assert set(period_map).issubset(periods)
              assert all(isinstance(v,dict) and v.get("state") in states
                         and type(v.get("radar_blocked")) is bool
                         and type(v.get("finality_unproven")) is bool
                         for v in period_map.values())
              hist_map=d[when].get("historical_period_observation")
              assert isinstance(hist_map,dict)
              assert set(hist_map).issubset(periods)
              assert all(isinstance(v,dict) and v.get("state") in historical_states
                         and type(v.get("radar_blocked")) is bool
                         and type(v.get("finality_unproven")) is bool
                         and type(v.get("research_only")) is bool
                         and type(v.get("currentness_unproven")) is bool
                         for v in hist_map.values())
              assert d[when].get("mcp_historical_consumer") in ("PASS","BLOCKED","NOT_VERIFIED")
              assert type(d[when].get("all_four_historical_requests_ok")) is bool
          public={"schema":d["schema"],
                  "before":{**{k:d["before"].get(k) for k in keys},
                            "period_status":{p:d["before"]["per_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods},
                            "historical_period_status":{p:d["before"]["historical_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods}},
                  "after":{**{k:d["after"].get(k) for k in keys},
                           "period_status":{p:d["after"]["per_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods},
                           "historical_period_status":{p:d["after"]["historical_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods}},
                  "sequence_advanced":d["sequence_advanced"],
                  "historical_research_usable":d["historical_research_usable"],
                  "limited_research_usable":d["limited_research_usable"],
                  "radar_admission":"BLOCKED","live_trade":"NO"}
          print("CN_TICKFLOW_AWS_RESEARCH_SANITIZED="+json.dumps(public,sort_keys=True))
          '
          echo "CN_TICKFLOW_AWS_AUDIT_EXECUTED=YES"
          echo "RADAR_ADMISSION=BLOCKED"
          echo "LIVE_TRADE=NO"
