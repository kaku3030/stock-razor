name: Audit TickFlow AWS Research Feed and MCP (Read Only)

on:
  workflow_dispatch:
  # Re-audit the protected, exact main SHA after audit-script changes.
  # Does not trigger paid ingestion/deployment or any trading path.
  push:
    branches: [main]
    paths:
      - 'scripts/audit_cn_tickflow_research_runtime.py'
      - '.github/workflows/audit-cn-tickflow-live-research.yml'
  # Owner-only, immutable code, research-only AWS SSM inspection.
  issue_comment:
    types: [created]
  # Read-only AWS SSM cloud snapshots every xx:00/xx:30 during CN
  # market observation span: 10:00–15:30 Shanghai time on weekdays,
  # including the midday pause and 15:30 last-bar publication crosscheck.
  # GitHub scheduled starts are BEST EFFORT (may be delayed/skipped).
  # No additional TickFlow paid SDK requests; existing collector cache only.
  schedule:
    - cron: '0,30 2-7 * * 1-5'

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    # Share deployment's lock to avoid a 65-second two-snapshot audit
    # straddling a paid worker restart/cache replacement. Only admitted
    # jobs enter this group: untrusted PR comments remain job-if skipped.
    concurrency:
      group: cn-tickflow-research-worker
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 658 &&
          github.event.issue.pull_request != null &&
          github.actor == github.repository_owner &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/stock-razor tickflow-audit read-only'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize owner-only comment before AWS OIDC
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authorize_cloud_ops_audit_comment.py
      - name: Verify fixed source and latest protected main before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/audit_cn_tickflow_research_runtime.py scripts/authorize_cloud_ops_audit_comment.py
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$head" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-research-readonly-audit
          aws-region: ap-northeast-1
      - name: Verify two isolated AWS snapshots 65 seconds apart
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail-closed again if main moved between OIDC and SSM.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$head" = "$GITHUB_SHA"
          hash="$(sha256sum scripts/audit_cn_tickflow_research_runtime.py | cut -d' ' -f1)"
          bundle="$(gzip -n -9 -c scripts/audit_cn_tickflow_research_runtime.py | base64 -w0)"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          scratch=\$(mktemp -d)
          trap 'rm -rf "\$scratch"' EXIT
          printf '%s' '$bundle' | base64 -d | gzip -d > "\$scratch/observe.py"
          printf '%s  %s\n' '$hash' "\$scratch/observe.py" | sha256sum -c - >/dev/null
          STOCK_RAZOR_EXPECTED_MAIN_SHA='$GITHUB_SHA' python3 "\$scratch/observe.py" --interval 65 | gzip -n -9 | base64 -w0
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 19000
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 170 --query Command.CommandId --output text)"
          test -n "$cid"
          state=""
          for _ in $(seq 1 70); do
            state="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 3
          done
          if [[ "$state" != "Success" ]]; then
            echo "CN_TICKFLOW_RESEARCH_AUDIT=BLOCKED"
            echo "SSM_PRIVATE_DETAILS_WITHHELD=YES"
            exit 1
          fi
          encoded="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s' "$encoded" | base64 -d | gzip -d | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print("TICKFLOW_AUDIT_SAFETY="+json.dumps({k:d.get(k) for k in (
              "schema","sequence_advanced",
              "source_arbiter_admission","radar_admission","live_trade",
              "canonical_write","exchange_finality","cross_provider_parity")},
              sort_keys=True)+" shadow_keys="+
              json.dumps(sorted((d.get("tencent_independent_shadow") or {}).keys()))+
              " frame_keys="+json.dumps({
                  when:sorted((d.get(when,{}).get("source_frame_progress") or {}).keys())
                  for when in ("before","after")
              })+
              " frame_value_types="+json.dumps({
                  when:sorted(set(type(value).__name__ for value in
                      (d.get(when,{}).get("source_frame_progress") or {}).values()))
                  for when in ("before","after")
              })+
              " frame_field_values="+json.dumps({
                  when:{field:sorted(set(
                      str(value.get(field)) for value in
                      (d.get(when,{}).get("source_frame_progress") or {}).values()
                      if isinstance(value,dict)
                  )) for field in (
                      "last_due_grid","due_grid_continuity",
                      "dominant_quarantine_reason","largest_ohlc_gap_bucket",
                      "gap_violation_rows_bucket","hilo_swap_candidate_bucket",
                      "etf_tick_grid_near_bucket",
                      "etf_tick_research_shadow_compatible_bucket",
                      "quarantined_rows_bucket","sdk_amount_omitted_bucket",
                      "vendor_float_rows_bucket",
                      "same_session_vendor_float_rows_bucket",
                      "retained_bar_count_bucket"
                  )} for when in ("before","after")
              }))
          assert d.get("schema")=="stock_razor_tickflow_aws_research_acceptance_v0_1"
          assert d.get("source_arbiter_admission")=="BLOCKED", repr(d.get("source_arbiter_admission"))
          assert d.get("radar_admission")=="BLOCKED", repr(d.get("radar_admission"))
          assert d.get("live_trade")=="NO", repr(d.get("live_trade"))
          assert d.get("canonical_write")=="NO", repr(d.get("canonical_write"))
          assert d.get("exchange_finality")=="NOT_VERIFIED", repr(d.get("exchange_finality"))
          assert d.get("cross_provider_parity")=="NOT_VERIFIED", repr(d.get("cross_provider_parity"))
          assert type(d.get("sequence_advanced")) is bool
          reference=d.get("tencent_independent_shadow")
          keys=("159611_SZ_15m","159611_SZ_60m","518880_SH_15m","518880_SH_60m")
          assert isinstance(reference,dict) and set(reference)==set(keys)
          statuses=("NO_PRIVATE_TICKFLOW_SNAPSHOT","IMPORT_BLOCKED",
                    "URL_NOT_ALLOWLISTED","UNQUALIFIED_GRID","INVALID_ROWS",
                    "NO_OVERLAP","OBSERVED_NOT_ADMITTED",
                    "INSUFFICIENT_OVERLAP","PROVIDER_OR_PARSER_BLOCKED")
          tick_diffs=("UNKNOWN","EXACT","UNDER_HALF_TICK","UP_TO_ONE_TICK",
                      "UP_TO_TWO_TICKS","OVER_TWO_TICKS")
          count_buckets=("UNKNOWN","ZERO","ONE","TWO_TO_FOUR","FIVE_PLUS")
          split_agreement=("UNKNOWN","NO_OVERLAP","INSUFFICIENT_PAIRS",
                           "ALL_WITHIN_ONE_TICK","NONE_WITHIN_ONE_TICK",
                           "GE90_PCT","GE50_PCT","GE25_PCT","LT25_PCT")
          disagreement_driver=("UNKNOWN","NONE","OPEN","HIGH","LOW","CLOSE",
                               "MULTIPLE_FIELDS","MULTIPLE_DRIVERS")
          disagreement_phase=("UNKNOWN","NONE","OPENING","LATE_MORNING",
                              "AFTERNOON","CLOSING","OTHER_SESSION_CLOCK",
                              "MULTIPLE_PHASES")
          eastgrid=("UNKNOWN","TENCENT_UNQUALIFIED","NO_FRESH_REFERENCE",
                    "INVALID_REFERENCE","UNQUALIFIED_REFERENCE_LINEAGE",
                    "INSUFFICIENT_SHARED_COMPLETE_SESSIONS",
                    "HISTORICAL_GRID_PRICE_ALIGNED_RESEARCH_ONLY",
                    "HISTORICAL_GRID_ALIGNED_PRICE_DIVERGENCE")
          for obj in reference.values():
              assert isinstance(obj,dict)
              assert obj.get("eastmoney_historical_grid_shadow") in eastgrid
              assert set(obj)==set(("status","overlap_bucket",
                    "max_ohlc_price_difference_ticks","reference",
                    "earlier_session_agreement","same_session_agreement",
                    "earlier_session_overlap_bucket","same_session_overlap_bucket",
                    "same_session_disagreement_driver",
                    "same_session_disagreement_phase",
                    "same_session_disagreement_bucket",
                    "eastmoney_historical_grid_shadow"))
              assert obj["same_session_disagreement_driver"] in disagreement_driver
              assert obj["same_session_disagreement_phase"] in disagreement_phase
              assert obj["same_session_disagreement_bucket"] in count_buckets
              assert obj["status"] in statuses
              assert obj["overlap_bucket"] in count_buckets
              assert obj["max_ohlc_price_difference_ticks"] in tick_diffs
              assert obj["reference"] in ("TENCENT_QUALIFIED_ONLY",
                                           "TENCENT_UNQUALIFIED")
              for term in ("earlier_session_agreement","same_session_agreement"):
                  assert obj[term] in split_agreement
              for term in ("earlier_session_overlap_bucket","same_session_overlap_bucket"):
                  assert obj[term] in count_buckets
          assert type(d.get("limited_research_usable")) is bool
          assert type(d.get("historical_research_usable")) is bool
          keys=("status","cache_unavailable_reason","worker_journal_observation","failure_stage","failure_reason","failure_ohlc_float_gap_bucket","unit_active","mcp_unit_active","cache_private",
                "repo_sha_match","sequence","cache_age_seconds","mcp_read_failure_reason",
                "mcp_cache_consumer","mcp_historical_consumer",
                "all_four_readonly_requests_ok","all_four_historical_requests_ok")
          shadow_periods=("159611_SZ_15m","159611_SZ_60m","518880_SH_15m","518880_SH_60m")
          periods=(
            "159611_SZ_1m","159611_SZ_5m","159611_SZ_15m","159611_SZ_60m",
            "159209_SZ_1m","159209_SZ_5m","159209_SZ_15m","159209_SZ_60m",
            "518880_SH_1m","518880_SH_5m","518880_SH_15m","518880_SH_60m",
            "512730_SH_1m","512730_SH_5m","512730_SH_15m","512730_SH_60m",
            "159363_SZ_1m","159363_SZ_5m","159363_SZ_15m","159363_SZ_60m")
          historical_periods=(*periods,
             "159611_SZ_1d","159209_SZ_1d","518880_SH_1d","512730_SH_1d","159363_SZ_1d")
          allowed_grid=("UNKNOWN","NO_SESSION_GRID_DUE","NO_SAME_DAY_RETAINED_BAR",
                        "LAST_LABEL_OFF_GRID","MATCHED_DUE_LABEL",
                        "ONE_DUE_BOUNDARY_MISSING","MULTIPLE_DUE_BOUNDARIES_MISSING")
          allowed_continuity=("UNKNOWN","NO_SESSION_GRID_DUE",
                              "NO_SAME_DAY_RETAINED_BAR","INVALID_TODAY_LABEL_GRID",
                              "ALL_DUE_LABELS_PRESENT_RESEARCH_ONLY",
                              "ONE_DUE_LABEL_MISSING","MULTIPLE_DUE_LABELS_MISSING")
          allowed_bucket=("UNKNOWN","ZERO","ONE","TWO_TO_FOUR","FIVE_PLUS")
          allowed_rows=("UNKNOWN","ONE_TO_THREE","FOUR_TO_24","25_TO_96","97_TO_144")
          parity_status=("NOT_VERIFIED","INVALID_REFERENCE",
                         "STALE_REFERENCE","INVALID_TICKFLOW_ROWS",
                         "UNQUALIFIED_REFERENCE_GRID","NO_OVERLAP",
                         "OBSERVED_NOT_ADMITTED","INSUFFICIENT_OVERLAP",
                         "INVALID_SNAPSHOT")
          parity_difference=("UNKNOWN","EXACT","UNDER_HALF_TICK",
                             "UP_TO_ONE_TICK","UP_TO_TWO_TICKS","OVER_TWO_TICKS")
          parity_lineage=("UNKNOWN","EASTMONEY","TENCENT")
          allowed_gap=("UNKNOWN","NONE","GAP_LT_1BP","GAP_1_TO_10BP",
                       "GAP_10_TO_100BP","GAP_GE_100BP")
          allowed_cause=("UNKNOWN","NONE","TODAY_LABEL_OFF_GRID","TODAY_FUTURE_LABEL",
                         "TODAY_NONNUMERIC_OR_MISSING_VALUE","TODAY_NONPOSITIVE_OHLC",
                         "TODAY_HIGH_BELOW_BODY","TODAY_LOW_ABOVE_BODY",
                         "TODAY_NEGATIVE_VOLUME","TODAY_NEGATIVE_AMOUNT")
          states=("PASS_RESEARCH_ONLY","BAR_LABEL_BEHIND_SESSION","STALE",
                  "NO_DATA","INVALID_CACHE","INVALID_REQUEST")
          historical_states=("PASS_HISTORICAL_ONLY","STALE","NO_DATA","INVALID_CACHE","INVALID_REQUEST")
          reasons=("NOT_VERIFIED","NOT_APPLICABLE","METHOD_RETURN_BLOCKED",
                   "IMPORT_OR_RUNTIME_FAILURE","SERVICE_PATH_MISSING")
          cache_absence=("NOT_APPLICABLE","FILE_MISSING","FILE_PERMISSION_BLOCKED",
                         "FILE_SIZE_INVALID","JSON_INVALID","DECODE_INVALID",
                         "SCHEMA_INVALID","UNCLASSIFIED")
          worker_journal=("JOURNAL_UNAVAILABLE","NO_RECENT_LIFECYCLE_MARKER",
                          "BOOT_BLOCKED","POLL_BLOCKED","POLL_RESEARCH_ONLY_PASS")
          for when in ("before","after"):
              assert d[when].get("cache_unavailable_reason") in cache_absence
              assert d[when].get("worker_journal_observation") in worker_journal
              assert d[when].get("failure_ohlc_float_gap_bucket") in (
                  "UNKNOWN","WITHIN_1E_MINUS_5","OVER_1E_MINUS_5"
              )
              assert d[when].get("mcp_read_failure_reason") in reasons
              parity=d[when].get("independent_price_shadow")
              assert isinstance(parity,dict) and set(parity).issubset(shadow_periods), sorted(set(parity or {})-set(shadow_periods))
              for _v in parity.values():
                  assert isinstance(_v,dict), type(_v).__name__
                  assert _v.get("status") in parity_status, ("parity.status",_v.get("status"))
                  assert _v.get("overlap_bucket") in allowed_bucket, ("parity.overlap_bucket",_v.get("overlap_bucket"))
                  assert _v.get("max_price_difference_ticks") in parity_difference, ("parity.max_price_difference_ticks",_v.get("max_price_difference_ticks"))
                  assert _v.get("lineage") in parity_lineage, ("parity.lineage",_v.get("lineage"))
              frame_map=d[when].get("source_frame_progress")
              assert isinstance(frame_map,dict), type(frame_map).__name__
              assert set(frame_map).issubset(historical_periods), sorted(set(frame_map)-set(historical_periods))
              for _v in frame_map.values():
                  assert isinstance(_v,dict), type(_v).__name__
                  assert _v.get("last_due_grid") in allowed_grid, ("last_due_grid",_v.get("last_due_grid"))
                  assert _v.get("due_grid_continuity") in allowed_continuity, ("due_grid_continuity",_v.get("due_grid_continuity"))
                  assert _v.get("dominant_quarantine_reason") in allowed_cause, ("dominant_quarantine_reason",_v.get("dominant_quarantine_reason"))
                  cause_buckets=_v.get("quarantine_cause_buckets")
                  assert isinstance(cause_buckets,dict), type(cause_buckets).__name__
                  assert len(cause_buckets)<=8, len(cause_buckets)
                  assert all(name in allowed_cause and name not in ("UNKNOWN","NONE")
                             and bucket in allowed_bucket
                             and bucket not in ("UNKNOWN","ZERO")
                             for name,bucket in cause_buckets.items()), sorted(cause_buckets)
                  assert _v.get("largest_ohlc_gap_bucket") in allowed_gap, ("largest_ohlc_gap_bucket",_v.get("largest_ohlc_gap_bucket"))
                  assert _v.get("gap_violation_rows_bucket") in allowed_bucket, ("gap_violation_rows_bucket",_v.get("gap_violation_rows_bucket"))
                  assert _v.get("hilo_swap_candidate_bucket") in allowed_bucket, ("hilo_swap_candidate_bucket",_v.get("hilo_swap_candidate_bucket"))
                  assert _v.get("etf_tick_grid_near_bucket") in allowed_bucket, ("etf_tick_grid_near_bucket",_v.get("etf_tick_grid_near_bucket"))
                  assert _v.get("etf_tick_research_shadow_compatible_bucket") in allowed_bucket, ("etf_tick_research_shadow_compatible_bucket",_v.get("etf_tick_research_shadow_compatible_bucket"))
                  assert _v.get("quarantined_rows_bucket") in allowed_bucket, ("quarantined_rows_bucket",_v.get("quarantined_rows_bucket"))
                  assert _v.get("sdk_amount_omitted_bucket") in allowed_bucket, ("sdk_amount_omitted_bucket",_v.get("sdk_amount_omitted_bucket"))
                  assert _v.get("vendor_float_rows_bucket") in allowed_bucket, ("vendor_float_rows_bucket",_v.get("vendor_float_rows_bucket"))
                  assert _v.get("same_session_vendor_float_rows_bucket") in allowed_bucket, ("same_session_vendor_float_rows_bucket",_v.get("same_session_vendor_float_rows_bucket"))
                  assert _v.get("retained_bar_count_bucket") in allowed_rows, ("retained_bar_count_bucket",_v.get("retained_bar_count_bucket"))
              supp=d[when].get("supplemental_5m_reader")
              assert isinstance(supp,dict) and set(periods).issubset(set(supp)) and set(supp).issubset(set(historical_periods))
              for observed in supp.values():
                  assert isinstance(observed,dict)
                  assert observed.get("state") in states
                  assert type(observed.get("radar_blocked")) is bool
                  assert observed.get("radar_blocked") is True
                  assert type(observed.get("finality_unproven")) is bool
                  assert observed.get("finality_unproven") is True
                  assert type(observed.get("rows")) is int
                  assert 0<=observed.get("rows")<=2
              period_map=d[when].get("per_period_observation")
              assert isinstance(period_map,dict)
              assert set(periods).issubset(set(period_map)) and set(period_map).issubset(set(historical_periods))
              assert all(isinstance(v,dict) and v.get("state") in states
                         and type(v.get("radar_blocked")) is bool
                         and type(v.get("finality_unproven")) is bool
                         and v.get("ohlc_precision_scope") in (
                             "UNKNOWN","STRICT","VENDOR_FLOAT_TOLERANCE_RESEARCH_ONLY")
                         for v in period_map.values())
              hist_map=d[when].get("historical_period_observation")
              assert isinstance(hist_map,dict)
              assert set(hist_map).issubset(historical_periods)
              assert all(isinstance(v,dict) and v.get("state") in historical_states
                         and type(v.get("radar_blocked")) is bool
                         and type(v.get("finality_unproven")) is bool
                         and type(v.get("research_only")) is bool
                         and type(v.get("currentness_unproven")) is bool
                         for v in hist_map.values())
              assert d[when].get("mcp_historical_consumer") in ("PASS","BLOCKED","NOT_VERIFIED")
              assert type(d[when].get("all_four_historical_requests_ok")) is bool
          def compact_frame(value):
              return {k:value.get(k) for k in (
                  "last_due_grid","due_grid_continuity",
                  "dominant_quarantine_reason","retained_bar_count_bucket")}
          def compact_reader(value):
              return {k:value.get(k) for k in (
                  "state","radar_blocked","finality_unproven","rows",
                  "cache_rejection_reason")}
          public_keys=("status","failure_class","failure_stage","failure_reason","failure_ohlc_float_gap_bucket",
                       "worker_journal_observation","repo_sha_match",
                       "worker_source_matches_main","mcp_source_matches_main",
                       "sequence","cache_age_seconds","mcp_cache_consumer",
                       "mcp_historical_consumer","all_four_readonly_requests_ok",
                       "all_four_historical_requests_ok")
          public={"schema":d["schema"],
                  "before":{**{k:d["before"].get(k) for k in public_keys},
                            "independent_price_shadow":{p:d["before"]["independent_price_shadow"].get(p,{}) for p in shadow_periods},
                            "source_frame_progress":{p:compact_frame(d["before"]["source_frame_progress"].get(p,{})) for p in historical_periods},
                            "supplemental_5m_reader":{p:compact_reader(d["before"]["supplemental_5m_reader"].get(p,{})) for p in periods},
                            "period_status":{p:d["before"]["per_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods},
                            "historical_period_status":{p:d["before"]["historical_period_observation"].get(p,{}).get("state","NO_DATA") for p in historical_periods},
                            "historical_cache_rejection_reason":{p:d["before"]["historical_period_observation"].get(p,{}).get("cache_rejection_reason","UNKNOWN") for p in historical_periods}},
                  "after":{**{k:d["after"].get(k) for k in public_keys},
                           "independent_price_shadow":{p:d["after"]["independent_price_shadow"].get(p,{}) for p in shadow_periods},
                           "source_frame_progress":{p:compact_frame(d["after"]["source_frame_progress"].get(p,{})) for p in historical_periods},
                           "supplemental_5m_reader":{p:compact_reader(d["after"]["supplemental_5m_reader"].get(p,{})) for p in periods},
                           "period_status":{p:d["after"]["per_period_observation"].get(p,{}).get("state","NO_DATA") for p in periods},
                           "historical_period_status":{p:d["after"]["historical_period_observation"].get(p,{}).get("state","NO_DATA") for p in historical_periods},
                           "historical_cache_rejection_reason":{p:d["after"]["historical_period_observation"].get(p,{}).get("cache_rejection_reason","UNKNOWN") for p in historical_periods}},
                  "sequence_advanced":d["sequence_advanced"],
                  "tencent_independent_shadow":d["tencent_independent_shadow"],
                  "historical_research_usable":d["historical_research_usable"],
                  "limited_research_usable":d["limited_research_usable"],
                  "radar_admission":"BLOCKED","live_trade":"NO"}
          print("CN_TICKFLOW_AWS_RESEARCH_SANITIZED="+json.dumps(public,sort_keys=True))
          '
          echo "CN_TICKFLOW_AWS_AUDIT_EXECUTED=YES"
          echo "RADAR_ADMISSION=BLOCKED"
          echo "LIVE_TRADE=NO"
