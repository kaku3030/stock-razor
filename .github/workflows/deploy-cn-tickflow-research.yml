name: Deploy CN TickFlow Isolated Research Worker

on:
  workflow_dispatch:
    inputs:
      target_instance_id:
        description: "Explicit Linux EC2 instance id; never inferred"
        type: string
        required: true
      research_symbols:
        description: "AUTO_200 or comma-separated explicit A-share symbols (maximum 200)"
        type: string
        required: true
        default: AUTO_200
      mode:
        description: "Preflight only by default; deploy requires explicit confirmation"
        type: choice
        options: [dry-run, deploy, diagnose]
        default: dry-run
        required: true
      confirm_deploy:
        description: "Type DEPLOY_CN_TICKFLOW_WORKER only for a requested service update"
        type: string
        required: false
      approve_paid_tickflow_ingestion:
        description: "Explicit opt-in required only when deploying the existing isolated paid research worker"
        type: boolean
        default: false
        required: true
      diagnostic_command_id:
        description: "Existing SSM command ID for a sanitized read-only invocation diagnosis"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: cn-tickflow-research-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: ${{ inputs.target_instance_id }}
      DEPLOY_MODE: ${{ inputs.mode }}
      CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
      APPROVE_PAID_TICKFLOW: ${{ inputs.approve_paid_tickflow_ingestion }}
      TICKFLOW_RESEARCH_SYMBOLS: ${{ inputs.research_symbols }}
      DIAGNOSTIC_COMMAND_ID: ${{ inputs.diagnostic_command_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected main and exact checkout before AWS identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || { echo 'CN_TICKFLOW_DEPLOY_UNAUTHORIZED_REF_OR_ACTOR' >&2; exit 2; }
          [[ "$DEPLOY_MODE" == dry-run || "$DEPLOY_MODE" == deploy || "$DEPLOY_MODE" == diagnose ]] || { echo 'CN_TICKFLOW_DEPLOY_INVALID_MODE' >&2; exit 2; }
          [[ "$TARGET_INSTANCE_ID" =~ ^i-[0-9a-f]{8,}$ ]] || { echo 'CN_TICKFLOW_DEPLOY_INVALID_INSTANCE_ID' >&2; exit 2; }
          if [[ "$DEPLOY_MODE" == deploy && "$CONFIRM_DEPLOY" != DEPLOY_CN_TICKFLOW_WORKER ]]; then echo 'CN_TICKFLOW_DEPLOY_CONFIRMATION_REQUIRED' >&2; exit 2; fi
          if [[ "$DEPLOY_MODE" == deploy && "$APPROVE_PAID_TICKFLOW" != true ]]; then echo 'CN_TICKFLOW_PAID_INGESTION_OPT_IN_REQUIRED' >&2; exit 2; fi
          if [[ "$DEPLOY_MODE" == diagnose && ! "$DIAGNOSTIC_COMMAND_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then echo 'CN_TICKFLOW_DIAGNOSTIC_COMMAND_ID_INVALID' >&2; exit 2; fi
          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$GITHUB_SHA" ]] || { echo 'CN_TICKFLOW_DEPLOY_CHECKOUT_SHA_MISMATCH' >&2; exit 2; }
          main_sha="$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" || { echo 'CN_TICKFLOW_DEPLOY_MAIN_LOOKUP_BLOCKED' >&2; exit 2; }
          [[ "$main_sha" == "$checkout_sha" ]] || { echo 'CN_TICKFLOW_DEPLOY_MAIN_MOVED_ABORT' >&2; exit 2; }
          test -f ops/aws/install_cn_tickflow_research.sh
          test -f ops/aws/verify_cn_tickflow_research.sh
          if [[ "$TICKFLOW_RESEARCH_SYMBOLS" != AUTO_200 ]]; then
            export TICKFLOW_RESEARCH_SYMBOLS
            python - <<'PY'
          import os, re, sys
          value = os.environ.get("TICKFLOW_RESEARCH_SYMBOLS", "")
          symbols = value.split(",")
          if (not symbols or len(symbols) > 200
                  or len(set(symbols)) != len(symbols)
                  or any(not re.fullmatch(r"[0-9]{6}\.(?:SH|SZ)", symbol)
                         for symbol in symbols)):
              print("CN_TICKFLOW_SYMBOL_INPUT_INVALID", file=sys.stderr)
              raise SystemExit(2)
          print(f"CN_TICKFLOW_SYMBOL_INPUT_VALID=count:{len(symbols)}")
          PY
          fi
          echo "CN_TICKFLOW_DEPLOY_SOURCE_SHA=$checkout_sha"
          echo "CN_TICKFLOW_DEPLOY_MODE=$DEPLOY_MODE"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: cn-tickflow-safe-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify explicit SSM target identity
        id: target
        shell: bash
        run: |
          set -euo pipefail
          info="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0]' --output json)"
          diagnosis="$(jq -r --arg id "$TARGET_INSTANCE_ID" '
            if . == null then
              ["NOT_REGISTERED", "NO_RECORD", "NO_RECORD", "NO_RECORD", "TARGET_NOT_REGISTERED"]
            else
              (.InstanceId == $id) as $id_match |
              (if .PingStatus == "Online" then "ONLINE" else (.PingStatus // "UNKNOWN") end) as $ping |
              (if .PlatformName == "Amazon Linux" then "AMAZON_LINUX_EXACT"
               elif .PlatformType == "Linux" and $id == "i-01738342af3efac72" and $id_match
                    then "PINNED_LINUX_REQUIRES_UBUNTU_OS_PROOF"
               elif (.PlatformName // "") | test("Amazon Linux") then "AMAZON_LINUX_VARIANT"
               elif .PlatformName == null then "MISSING"
               else "OTHER" end) as $platform |
              (if ($id_match | not) then "ID_MISMATCH"
               elif $ping != "ONLINE" then "SSM_NOT_ONLINE"
               elif ($platform != "AMAZON_LINUX_EXACT" and $platform != "PINNED_LINUX_REQUIRES_UBUNTU_OS_PROOF") then "PLATFORM_NAME_MISMATCH"
               else "IDENTITY_PRECHECK_PASS" end) as $diagnosis |
              ["FOUND", (if $id_match then "PASS" else "FAIL" end), $ping, $platform, $diagnosis]
            end | @tsv' <<< "$info")"
          IFS=$'\t' read -r record id_match ping platform diagnosis <<< "$diagnosis"
          echo "CN_TICKFLOW_SSM_RECORD=$record"
          echo "CN_TICKFLOW_SSM_ID_MATCH=$id_match"
          echo "CN_TICKFLOW_SSM_PING=$ping"
          echo "CN_TICKFLOW_SSM_PLATFORM=$platform"
          echo "CN_TICKFLOW_SSM_TARGET_DIAGNOSIS=$diagnosis"
          jq -e --arg id "$TARGET_INSTANCE_ID" '
            (.InstanceId == $id) and (.PingStatus == "Online") and (
              .PlatformName == "Amazon Linux" or
              (.PlatformType == "Linux" and $id == "i-01738342af3efac72")
            )' <<< "$info" >/dev/null
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo 'CN_TICKFLOW_SSM_TARGET_PREFLIGHT=PASS'
      - name: Read pre-deploy worker identity and source/provider evidence
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          remote='set -euo pipefail; repo=/opt/stock-razor-cn-tickflow/repo; status=/run/stock-razor-cn-tickflow/latest-research-observation.json; test -d "$repo/.git"; printf "CN_TICKFLOW_PREVIOUS_REPO_SHA=%s\n" "$(git -C "$repo" rev-parse HEAD)"; if test -s "$status"; then /opt/stock-razor-cn-tickflow/venv/bin/python -c "import json,sys,re; p=json.load(open(sys.argv[1],encoding=\"utf-8\")); v=p.get(\"repo\"+\"_sha\",\"\"); print(\"CN_TICKFLOW_PREVIOUS_SOURCE_REPO_SHA=\"+(v if re.fullmatch(r\"[0-9a-f]{40}\",v) else \"UNKNOWN\")); print(\"CN_TICKFLOW_PREVIOUS_PROVIDER=\"+(p.get(\"provider\") if p.get(\"provider\")==\"TICKFLOW_PREMIUM\" else \"UNKNOWN\"))" "$status"; else printf "%s\n" CN_TICKFLOW_PREVIOUS_SOURCE_REPO_SHA=UNKNOWN CN_TICKFLOW_PREVIOUS_PROVIDER=UNKNOWN; fi'
          # The pinned mixed Ubuntu instance is allowed ONLY for an already
          # running, clean, isolated CN worker; the US OpenD/MCP units must be
          # healthy before any service mutation. All other Ubuntu targets fail.
          if [[ "${{ steps.target.outputs.platform }}" == "PINNED_LINUX_REQUIRES_UBUNTU_OS_PROOF" ]]; then
            read -r -d '' proof <<'REMOTE' || true
          set -eu
          repo=/opt/stock-razor-cn-tickflow/repo
          unit=stock-razor-cn-tickflow-research.service
          . /etc/os-release
          test "${ID:-}" = ubuntu
          test "$(uname -s)" = Linux
          test "$(systemctl is-active "$unit")" = active
          test "$(systemctl is-active stock-razor-us-livefeed.service)" = active
          test "$(systemctl is-active stock-razor-mcp.service)" = active
          test "$(systemctl show "$unit" -p WorkingDirectory --value)" = "$repo"
          test -x /opt/stock-razor-cn-tickflow/venv/bin/python
          test -d "$repo/.git"
          test -z "$(git -C "$repo" status --porcelain)"
          systemctl cat "$unit" | grep -Fq 'ExecStart=/opt/stock-razor-cn-tickflow/venv/bin/python -m scripts.run_cn_tickflow_research_worker'
          echo 'CN_TICKFLOW_PINNED_UBUNTU_PROOF=PASS'
          REMOTE
            remote="$proof"$'\n'"$remote"
          fi
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query Command.CommandId --output text)"
          for _ in $(seq 1 30); do status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 2; done
          inv="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          jq '{Status,ResponseCode}' <<< "$inv"
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<< "$inv")"
          grep -E '^CN_TICKFLOW_(PREVIOUS_REPO_SHA|PREVIOUS_SOURCE_REPO_SHA|PREVIOUS_PROVIDER)=' <<< "$out"
          if [[ "${{ steps.target.outputs.platform }}" == "PINNED_LINUX_REQUIRES_UBUNTU_OS_PROOF" ]]; then
            grep -Fxq 'CN_TICKFLOW_PINNED_UBUNTU_PROOF=PASS' <<< "$out"
            echo 'CN_TICKFLOW_PINNED_UBUNTU_PROOF=PASS'
          fi
          echo 'CN_TICKFLOW_PRE_DEPLOY_READBACK=PASS'
      - name: Dry-run gate (no installer, no restart)
        if: env.DEPLOY_MODE == 'dry-run'
        run: |
          echo 'CN_TICKFLOW_DEPLOY_DRY_RUN=PASS'
          echo 'CN_TICKFLOW_SERVICE_MUTATION=NO'
          echo 'CN_TICKFLOW_CANONICAL_WRITE=NO'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
      - name: Read existing SSM invocation (sanitized, read-only)
        if: env.DEPLOY_MODE == 'diagnose'
        env:
          COMMAND_ID: ${{ env.DIAGNOSTIC_COMMAND_ID }}
        shell: bash
        run: |
          set -euo pipefail
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          python scripts/sanitize_cn_tickflow_deploy_invocation.py <<< "$inv"
      - name: Controlled worker update with rollback trap
        if: env.DEPLOY_MODE == 'deploy'
        id: deploy
        shell: bash
        env:
          REPO_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          install_hash="$(sha256sum ops/aws/install_cn_tickflow_research.sh | awk '{print $1}')"
          verify_hash="$(sha256sum ops/aws/verify_cn_tickflow_research.sh | awk '{print $1}')"
          remote="set -euo pipefail; stage=\$(mktemp -d); trap 'rm -rf \"\$stage\"' EXIT; curl --proto '=https' --tlsv1.2 -fsSL --max-time 25 https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_cn_tickflow_research.sh -o \"\$stage/install.sh\"; curl --proto '=https' --tlsv1.2 -fsSL --max-time 25 https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_cn_tickflow_research.sh -o \"\$stage/verify.sh\"; printf '%s  %s\n' '$install_hash' \"\$stage/install.sh\" | sha256sum -c - >/dev/null; printf '%s  %s\n' '$verify_hash' \"\$stage/verify.sh\" | sha256sum -c - >/dev/null; chmod 0755 \"\$stage/install.sh\" \"\$stage/verify.sh\"; REPO_REF=$REPO_REF TICKFLOW_RESEARCH_SYMBOLS=$TICKFLOW_RESEARCH_SYMBOLS ALLOW_SERVICE_MUTATION=true \"\$stage/install.sh\"; \"\$stage/verify.sh\" $REPO_REF"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 600 --query Command.CommandId --output text)"
          echo "command_id=$cid" >> "$GITHUB_OUTPUT"
      - name: Independent post-deploy worker/source/provider readback
        if: env.DEPLOY_MODE == 'deploy'
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"; case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          python scripts/sanitize_cn_tickflow_deploy_invocation.py <<< "$inv"
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<< "$inv")"
          grep -Fxq "CN_TICKFLOW_RESEARCH_SERVICE_DEPLOY=PASS" <<< "$out"
          grep -Fxq "CN_TICKFLOW_WORKER_VERIFY=PASS" <<< "$out"
          grep -Fxq "CN_TICKFLOW_WORKER_REPO_SHA=$GITHUB_SHA" <<< "$out"
          grep -Fxq "CN_TICKFLOW_SOURCE_REPO_SHA=$GITHUB_SHA" <<< "$out"
          grep -Fxq 'CN_TICKFLOW_PROVIDER=TICKFLOW_PREMIUM' <<< "$out"
          grep -Fxq 'CN_TICKFLOW_PROVIDER_QUALIFICATION=NOT_VERIFIED' <<< "$out"
          grep -Fxq 'SOURCE_ARBITER_ADMISSION=BLOCKED' <<< "$out"
          grep -Fxq 'RADAR_ADMISSION=BLOCKED' <<< "$out"
          grep -Fxq 'LIVE_TRADE=NO' <<< "$out"
          echo 'CN_TICKFLOW_DEPLOYMENT=PASS'
          echo 'CN_TICKFLOW_CANONICAL_WRITE=NO'
