name: Deploy CN TickFlow Isolated Research Feed

on:
  workflow_dispatch:
    inputs:
      approve_paid_tickflow_ingestion:
        description: "Explicit opt-in for bounded paid 2-symbol TickFlow Premium polling on AWS"
        type: boolean
        default: false
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: cn-tickflow-research-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main' && inputs.approve_paid_tickflow_ingestion == true
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: base
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          test -f ops/aws/install_cn_tickflow_research.sh
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "installer_hash=$(sha256sum ops/aws/install_cn_tickflow_research.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: cn-tickflow-research-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Fixed AWS SSM target identity and online gate
        shell: bash
        run: |
          set -euo pipefail
          id="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].InstanceId' --output text)"
          ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)"
          test "$id" = "$TARGET_INSTANCE_ID"
          test "$ping" = "Online"
      - name: Dispatch fixed paid research worker (never canonical)
        id: ssm
        env:
          SHA: ${{ steps.base.outputs.sha }}
          INSTALLER_HASH: ${{ steps.base.outputs.installer_hash }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$INSTALLER_HASH" =~ ^[0-9a-f]{64}$ ]]
          command="#!/usr/bin/env bash"$'\n'"set -euo pipefail; f=\$(mktemp); trap 'rm -f \"\$f\"' EXIT; curl -fsSL --max-time 25 https://raw.githubusercontent.com/kaku3030/stock-razor/$SHA/ops/aws/install_cn_tickflow_research.sh -o \"\$f\"; printf '%s  %s\n' '$INSTALLER_HASH' \"\$f\" | sha256sum -c - >/dev/null; REPO_REF=$SHA bash \"\$f\""
          params="$(jq -cn --arg c "$command" '{commands:[$c]}')"
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 420 --query Command.CommandId --output text)"
          test -n "$cid"
          echo "id=$cid" >> "$GITHUB_OUTPUT"
      - name: Verify SSM success with only allowlisted operational lines
        env:
          CID: ${{ steps.ssm.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          state=""
          for _ in $(seq 1 110); do
            state="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 3
          done
          meta="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$TARGET_INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode}' --output json)"
          printf '%s\n' "$meta"
          if [[ "$state" != "Success" ]]; then
            echo 'CN_TICKFLOW_WORKER_DEPLOY=BLOCKED'
            echo 'SSM_PRIVATE_DETAILS_WITHHELD=YES'
            exit 1
          fi
          out="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          grep -Fxq 'CN_TICKFLOW_RESEARCH_SERVICE_DEPLOY=PASS' <<< "$out"
          grep -Fxq 'SOURCE_ARBITER_ADMISSION=BLOCKED' <<< "$out"
          grep -Fxq 'RADAR_ADMISSION=BLOCKED' <<< "$out"
          grep -Fxq 'LIVE_TRADE=NO' <<< "$out"
          echo 'CN_TICKFLOW_WORKER_DEPLOY=PASS'
          echo 'CN_TICKFLOW_PROVIDER_DATA_QUALIFICATION=NOT_VERIFIED'
          echo 'CN_TICKFLOW_CANONICAL_WRITE=NO'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'

