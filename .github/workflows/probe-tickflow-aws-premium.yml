name: TickFlow AWS Premium Probe (Explicit Opt-In)

on:
  workflow_dispatch:
    inputs:
      enable_premium_probe:
        description: "Must be true only after secret and IAM/provider authorization are independently verified"
        required: true
        type: boolean
        default: false
      secret_arn:
        description: "Optional exact Tokyo Secrets Manager ARN; blank uses the fixed existing TickFlow secret name (never a key)"
        required: false
        type: string
      quote_only:
        description: "Default true: one batch realtime quote (up to two ETF symbols); zero K-lines, depth and WS"
        required: true
        type: boolean
        default: true
      ws_seconds:
        description: "Must be 0 for quote_only=true; broader historical/WS diagnostics need explicit quote_only=false"
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "10"
          - "15"
          - "30"
          - "60"

permissions:
  id-token: write
  contents: read

jobs:
  premium-probe:
    if: ${{ github.ref == 'refs/heads/main' && inputs.enable_premium_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      TICKFLOW_PREMIUM_PROBE_ENABLED: "true"
      TICKFLOW_PREMIUM_NETWORK_REQUEST_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preflight exact protected main and premium scope before AWS OIDC
        shell: bash
        env:
          SECRET_ARN: ${{ inputs.secret_arn }}
          WS_SECONDS: ${{ inputs.ws_seconds }}
          QUOTE_ONLY: ${{ inputs.quote_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          [[ "$revision" == "$GITHUB_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$revision" ]] || {
            echo 'TICKFLOW_PREMIUM_MAIN_MOVED_ABORT' >&2
            exit 2
          }
          [[ "$WS_SECONDS" =~ ^(0|10|15|30|60)$ ]]
          [[ "$QUOTE_ONLY" == true || "$QUOTE_ONLY" == false ]]
          if [[ "$QUOTE_ONLY" == true && "$WS_SECONDS" != 0 ]]; then
            echo 'TICKFLOW_PREMIUM_QUOTE_ONLY_FORBIDS_WS' >&2
            exit 2
          fi
          if [[ -n "$SECRET_ARN" && "$SECRET_ARN" != 'stock-razor/tickflow/premium-api-key' ]]; then
            [[ "$SECRET_ARN" =~ ^arn:aws:secretsmanager:ap-northeast-1:888425712426:secret:stock-razor/tickflow/premium-api-key-[A-Za-z0-9+=,.@_-]{6,}$ ]]
          fi
          test -s ops/aws/run_tickflow_premium_probe.sh
          test -s scripts/probe_tickflow_isolated.py
          test -s ops/requirements/tickflow-isolated-v0.1.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-premium-probe-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Run bounded isolated probe over SSM
        env:
          SECRET_ARN: ${{ inputs.secret_arn }}
          WS_SECONDS: ${{ inputs.ws_seconds }}
          QUOTE_ONLY: ${{ inputs.quote_only }}
        shell: bash
        run: |
          set -euo pipefail
          # Empty operator reference selects only the preapproved AWS secret name.
          # AWS resolves the name via existing EC2 IAM; no ARN or key is logged.
          if [[ -z "$SECRET_ARN" ]]; then
            SECRET_ARN='stock-razor/tickflow/premium-api-key'
          fi
          if [[ "$SECRET_ARN" != 'stock-razor/tickflow/premium-api-key' ]]; then
            [[ "$SECRET_ARN" =~ ^arn:aws:secretsmanager:ap-northeast-1:888425712426:secret:stock-razor/tickflow/premium-api-key-[A-Za-z0-9+=,.@_-]{6,}$ ]]
          fi
          [[ "$WS_SECONDS" =~ ^(0|10|15|30|60)$ ]]
          [[ "$QUOTE_ONLY" == "true" || "$QUOTE_ONLY" == "false" ]]
          if [[ "$QUOTE_ONLY" == "true" && "$WS_SECONDS" != "0" ]]; then
            echo 'TICKFLOW_PREMIUM_QUOTE_ONLY_FORBIDS_WS' >&2
            exit 2
          fi
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == "${{ github.sha }}" ]]
          bootstrap_hash="$(sha256sum ops/aws/run_tickflow_premium_probe.sh | cut -d' ' -f1)"
          probe_hash="$(sha256sum scripts/probe_tickflow_isolated.py | cut -d' ' -f1)"
          requirements_hash="$(sha256sum ops/requirements/tickflow-isolated-v0.1.txt | cut -d' ' -f1)"
          # Send source from the immutable Actions checkout rather than
          # downloading a public GitHub URL on AWS. No credential is packed.
          bootstrap_payload="$(gzip -n -9 -c ops/aws/run_tickflow_premium_probe.sh | base64 -w0)"
          test -n "$bootstrap_payload"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          bootstrap_stage=REMOTE_INIT
          temp_dir=\$(mktemp -d -t sr-tickflow-premium-bootstrap.XXXXXXXX)
          trap 'rc=\$?; if [ "\$rc" -ne 0 ]; then printf "TICKFLOW_PREMIUM_BOOTSTRAP_STAGE=%s\\n" "\$bootstrap_stage"; fi; rm -rf "\$temp_dir"' EXIT
          bootstrap_stage=DECODE_BOOTSTRAP
          export TICKFLOW_PREMIUM_PROBE_ENABLED=true TICKFLOW_PREMIUM_NETWORK_REQUEST_ENABLED=true
          printf '%s' '$bootstrap_payload' | base64 -d | gzip -d > "\$temp_dir/bootstrap.sh"
          bootstrap_stage=VERIFY_BOOTSTRAP_HASH
          printf '%s  %s\n' '$bootstrap_hash' "\$temp_dir/bootstrap.sh" | sha256sum -c - >/dev/null
          bootstrap_stage=RUN_BOOTSTRAP
          bash "\$temp_dir/bootstrap.sh" '$revision' '$SECRET_ARN' '$probe_hash' '$requirements_hash' '$bootstrap_hash' '$WS_SECONDS' '$QUOTE_ONLY'
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 16000 || {
            echo 'TICKFLOW_PREMIUM_SSM_PAYLOAD_TOO_LARGE' >&2; exit 2;
          }
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$(jq -cn --arg cmd "$remote" '{commands:[$cmd]}')" --timeout-seconds 300 --query 'Command.CommandId' --output text)"
          report_terminal_failure() {
            local response_code output error_output status_details safe_stage
            response_code="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query ResponseCode --output text 2>/dev/null || true)"
            if [[ ! "$response_code" =~ ^(-?[0-9]+|None)$ ]]; then
              response_code=UNKNOWN
            fi
            echo "TICKFLOW_PREMIUM_SSM_RESPONSE_CODE=$response_code" >&2
            output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
            error_output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardErrorContent --output text 2>/dev/null || true)"
            status_details="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StatusDetails --output text 2>/dev/null || true)"
            safe_diagnostics="$(printf '%s\n%s\n' "$output" "$error_output" | awk -F= '
              /^TICKFLOW_PREMIUM_(FAILED_STAGE|BOOTSTRAP_STAGE|AWS_CLI_STAGE)=[A-Z_]+$/ {print; next}
              /^TICKFLOW_PREMIUM_EXIT_CLASS=NONZERO$/ {print; next}
              /^TICKFLOW_PREMIUM_PROBE_FAILURE_CLASS=[A-Za-z][A-Za-z0-9_]{0,63}$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_ARCHIVE=(PASS|CRC_FAILURE|INVALID_ZIP|NO_SPACE|IO_ERROR|PERMISSION_ERROR|OS_ERROR|EXTRACTION_IO_ERROR|ARCHIVE_ERROR|DOWNLOAD_FAILED)$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI=(AVAILABLE|UNAVAILABLE|INVALID)$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_ARCH=(x86_64|aarch64|UNSUPPORTED)$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_PATH=\/[A-Za-z0-9._+\/-]+$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_VERSION=[0-9]+(\.[0-9]+)*$/ {print; next}
              /^TICKFLOW_PREMIUM_SECRET_ERROR_CLASS=(ACCESS_DENIED|RESOURCE_NOT_FOUND|DECRYPTION_FAILURE|INVALID_REQUEST|INVALID_PARAMETER|INVALID_CLIENT_TOKEN|EXPIRED_TOKEN|THROTTLED|ENDPOINT_UNREACHABLE|CREDENTIALS_MISSING|UNKNOWN)$/ {print; next}
            ' | head -n 8)"
            if [[ -n "$safe_diagnostics" ]]; then
              printf '%s\n' "$safe_diagnostics" >&2
            elif [[ "$status_details" == *TimedOut* ]]; then
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=SSM_COMMAND_TIMEOUT' >&2
            elif [[ "$response_code" =~ ^[1-9][0-9]*$ || "$status_details" == *Failed* ]]; then
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=SSM_REMOTE_COMMAND' >&2
            else
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=UNKNOWN' >&2
            fi
          }
          for _ in $(seq 1 100); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                # Never echo untrusted AWS command stdout verbatim to PUBLIC
                # Actions. Only a source-pinned, finite projection may leave.
                output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
                summary="$(printf '%s\n' "$output" | grep -E '^[{]' | tail -n 1 || true)"
                test -n "$summary" || { echo 'TICKFLOW_PREMIUM_SUMMARY_MISSING' >&2; exit 1; }
                printf '%s' "$summary" | EXPECTED_REVISION="$revision" python3 -c '
          import json,os,sys
          data=json.load(sys.stdin)
          assert data.get("schema") == "stock_razor_tickflow_sanitized_probe_v0_1"
          assert data.get("repo_sha") == os.environ["EXPECTED_REVISION"]
          assert data.get("mode") == "premium"
          assert data.get("request_scope") in {
              "ONE_REALTIME_QUOTE_BATCH_ONLY", "STANDARD_ISOLATED_PROBE"
          }
          if data.get("request_scope") == "ONE_REALTIME_QUOTE_BATCH_ONLY":
              assert len(data.get("operations") or []) <= 2
          assert data.get("data_qualification") == "NOT_VERIFIED"
          assert data.get("radar_admission") == "BLOCKED"
          assert data.get("source_arbiter_admission") == "BLOCKED"
          assert data.get("live_trade") is False
          names={"sdk_import","realtime_quote","kline_1m","kline_5m","kline_15m","kline_30m","kline_60m","kline_intraday_15m","kline_intraday_60m","kline_batch_15m","kline_batch_60m","five_level_depth","websocket_quote_smoke"}
          states={"COMPLETED","OBSERVED","NO_EVENTS_OBSERVED","CLOSE_FAILED","FAILED","BLOCKED","SKIPPED","ERROR"}
          raw=data.get("operations")
          assert isinstance(raw,list) and len(raw)<=20
          operations=[]
          for item in raw:
              assert isinstance(item,dict)
              name,state=item.get("name"),item.get("operation")
              assert name in names and state in states
              record={"name":name,"operation":state}
              elapsed=item.get("elapsed_ms")
              if type(elapsed) in (int,float) and 0 <= elapsed <= 100000000:
                  record["elapsed_ms"]=round(elapsed,3)
              scope=item.get("data_scope")
              expected_scope=(
                  "HISTORICAL" if name in ("kline_15m","kline_60m")
                  else "CURRENT_DAY_INTRADAY" if name in (
                      "kline_intraday_15m","kline_intraday_60m",
                      "kline_batch_15m","kline_batch_60m",
                  ) else None
              )
              if expected_scope is not None:
                  assert scope==expected_scope
                  record["data_scope"]=expected_scope
                  symbol=item.get("symbol")
                  if symbol in ("159611.SZ","518880.SH"):
                      record["symbol"]=symbol
                  rows=item.get("row_count")
                  if type(rows) is int and 0 <= rows <= 96:
                      record["row_count"]=rows
              if name in ("kline_15m","kline_60m"):
                  bar=item.get("bar_range_structure")
                  record["bar_range_structure"]=bar if bar in ("PASS","FAIL","NOT_VERIFIED") else "NOT_VERIFIED"
                  order=item.get("timestamp_order")
                  record["timestamp_order"]=order if order in ("STRICTLY_INCREASING","NON_DECREASING","NOT_MONOTONIC","NOT_VERIFIED") else "NOT_VERIFIED"
                  for field in ("numeric_ohlcv","numeric_amount"):
                      val=item.get(field)
                      record[field]=val if val in ("PASS","NOT_VERIFIED") else "NOT_VERIFIED"
                  n=item.get("historical_sample_count")
                  record["historical_sample_count"]=n if type(n) is int and 0 <= n <= 96 else None
                  convention=item.get("historical_grid_convention")
                  record["historical_grid_convention"]=convention if convention in (
                    "BAR_END_GRID_MATCH","BAR_START_GRID_MATCH","GRID_CONFLICT",
                    "INSUFFICIENT","INVALID_TIMESTAMP_ORDER") else "INSUFFICIENT"
                  for field in ("prior_sessions_observed","complete_end_sessions",
                                "complete_start_sessions","current_day_rows_excluded"):
                    value=item.get("historical_grid_"+field)
                    record["historical_grid_"+field]=(
                      value if type(value) is int and 0<=value<=120 else None)
                  assert item.get("historical_grid_is_not_closure_proof") is True
                  record["historical_grid_is_not_closure_proof"]=True
                  assert item.get("freshness")=="NOT_VERIFIED"
                  assert item.get("closure")=="NOT_VERIFIED"
                  assert item.get("provider_live_qualified") is False
                  record["provider_live_qualified"]=False
              if name in ("kline_batch_15m","kline_batch_60m"):
                  count_ceiling=96 if name == "kline_batch_15m" else 24
                  for field in ("requested_symbol_count","returned_symbol_count",
                                "missing_symbol_count","unrequested_symbol_count"):
                      value=item.get(field)
                      record[field]=value if type(value) is int and 0<=value<=5 else None
                  for field,target in (
                      ("batch_symbol_row_counts","batch_symbol_row_counts"),
                      ("batch_symbol_complete_end_sessions","batch_symbol_complete_end_sessions"),
                  ):
                      values=item.get(field)
                      if isinstance(values,list) and len(values)<=5:
                          ceiling=count_ceiling if field=="batch_symbol_row_counts" else 120
                          record[target]=[
                              value if type(value) is int and 0<=value<=ceiling else None
                              for value in values
                          ]
                      else:
                          record[target]=[]
                  conventions=item.get("batch_symbol_grid_conventions")
                  allowed_conventions=(
                      "BAR_END_GRID_MATCH","BAR_START_GRID_MATCH","GRID_CONFLICT",
                      "INSUFFICIENT","INVALID_TIMESTAMP_ORDER"
                  )
                  record["batch_symbol_grid_conventions"]=(
                      [value if value in allowed_conventions else "INSUFFICIENT"
                       for value in conventions]
                      if isinstance(conventions,list) and len(conventions)<=5 else []
                  )
                  assert item.get("freshness")=="NOT_VERIFIED"
                  assert item.get("closure")=="NOT_VERIFIED"
                  assert item.get("provider_live_qualified") is False
                  record["freshness"]="NOT_VERIFIED"
                  record["closure"]="NOT_VERIFIED"
                  record["provider_live_qualified"]=False
              if name == "websocket_quote_smoke":
                  for field in (
                      "quote_callbacks","quote_events","unique_quote_samples",
                      "initial_snapshot_candidates","post_initial_update_candidates",
                      "duplicate_timestamp_events","out_of_order_timestamp_events",
                      "unrequested_symbol_events","invalid_timestamp_events",
                      "error_callbacks",
                  ):
                      val=item.get(field)
                      if type(val) is int and 0 <= val <= 1000000:
                          record[field]=val
                  for field in ("connection_call","subscription_call"):
                      val=item.get(field)
                      if val in ("PASS","FAIL","NOT_VERIFIED"):
                          record[field]=val
                  thread_state=item.get("background_thread_state")
                  if thread_state in ("ALIVE","STOPPED","UNOBSERVABLE"):
                      record["background_thread_state"]=thread_state
                  assert item.get("background_thread_not_provider_connection_proof") is True
                  record["background_thread_not_provider_connection_proof"]=True
                  assert item.get("subscription_ack_evidence") == (
                      "NOT_OBSERVABLE_VIA_OFFICIAL_SYNC_SDK"
                  )
                  assert item.get("sample_latency_qualification") == "NOT_VERIFIED"
                  assert item.get("post_initial_candidates_not_confirmed_live") is True
                  record["provider_live_qualified"]=False
              operations.append(record)
          print("TICKFLOW_PREMIUM_SANITIZED="+json.dumps({
              "schema":"stock_razor_tickflow_sanitized_probe_v0_1",
              "source_revision":os.environ["EXPECTED_REVISION"],
              "request_scope":data.get("request_scope"),
              "operations":operations,
              "data_qualification":"NOT_VERIFIED",
              "radar_admission":"BLOCKED",
              "source_arbiter_admission":"BLOCKED",
              "live_trade":False,
          },sort_keys=True))
          '
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling) echo "TICKFLOW_PREMIUM_PROBE=$status" >&2; report_terminal_failure; exit 1 ;;
            esac
            sleep 3
          done
          echo 'TICKFLOW_PREMIUM_PROBE=TIMEOUT' >&2
          report_terminal_failure
          exit 1
