name: TickFlow AWS Premium Probe (Explicit Opt-In)

on:
  workflow_dispatch:
    inputs:
      enable_premium_probe:
        description: "Must be true only after secret and IAM/provider authorization are independently verified"
        required: true
        type: boolean
        default: false
      secret_arn:
        description: "Exact Tokyo Secrets Manager ARN; never enter the API key"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  premium-probe:
    if: ${{ inputs.enable_premium_probe == true && inputs.secret_arn != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      TICKFLOW_PREMIUM_PROBE_ENABLED: "true"
      TICKFLOW_PREMIUM_NETWORK_REQUEST_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-premium-probe-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Run bounded isolated probe over SSM
        env:
          SECRET_ARN: ${{ inputs.secret_arn }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SECRET_ARN" =~ ^arn:aws:secretsmanager:ap-northeast-1:888425712426:secret:stock-razor/tickflow/premium-[A-Za-z0-9+=,.@_-]{6,}$ ]]
          revision="$(git rev-parse HEAD)"
          bootstrap_hash="$(sha256sum ops/aws/run_tickflow_premium_probe.sh | cut -d' ' -f1)"
          probe_hash="$(sha256sum scripts/probe_tickflow_isolated.py | cut -d' ' -f1)"
          requirements_hash="$(sha256sum ops/requirements/tickflow-isolated-v0.1.txt | cut -d' ' -f1)"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          bootstrap_stage=REMOTE_INIT
          temp_dir=\$(mktemp -d -t sr-tickflow-premium-bootstrap.XXXXXXXX)
          trap 'rc=\$?; if [ "\$rc" -ne 0 ]; then printf "TICKFLOW_PREMIUM_BOOTSTRAP_STAGE=%s\\n" "\$bootstrap_stage"; fi; rm -rf "\$temp_dir"' EXIT
          bootstrap_stage=DOWNLOAD_BOOTSTRAP
          export TICKFLOW_PREMIUM_PROBE_ENABLED=true TICKFLOW_PREMIUM_NETWORK_REQUEST_ENABLED=true
          curl --fail --silent --show-error --max-time 20 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$revision/ops/aws/run_tickflow_premium_probe.sh' \
            -o "\$temp_dir/bootstrap.sh" 2>/dev/null
          bootstrap_stage=VERIFY_BOOTSTRAP_HASH
          printf '%s  %s\n' '$bootstrap_hash' "\$temp_dir/bootstrap.sh" | sha256sum -c - >/dev/null
          bootstrap_stage=RUN_BOOTSTRAP
          bash "\$temp_dir/bootstrap.sh" '$revision' '$SECRET_ARN' '$probe_hash' '$requirements_hash' '$bootstrap_hash'
          REMOTE
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$(jq -cn --arg cmd "$remote" '{commands:[$cmd]}')" --timeout-seconds 300 --query 'Command.CommandId' --output text)"
          report_terminal_failure() {
            local response_code output error_output status_details safe_stage
            response_code="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query ResponseCode --output text 2>/dev/null || true)"
            if [[ ! "$response_code" =~ ^(-?[0-9]+|None)$ ]]; then
              response_code=UNKNOWN
            fi
            echo "TICKFLOW_PREMIUM_SSM_RESPONSE_CODE=$response_code" >&2
            output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
            error_output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardErrorContent --output text 2>/dev/null || true)"
            status_details="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StatusDetails --output text 2>/dev/null || true)"
            safe_diagnostics="$(printf '%s\n%s\n' "$output" "$error_output" | awk -F= '
              /^TICKFLOW_PREMIUM_(FAILED_STAGE|BOOTSTRAP_STAGE|AWS_CLI_STAGE)=[A-Z_]+$/ {print; next}
              /^TICKFLOW_PREMIUM_EXIT_CLASS=NONZERO$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI=(AVAILABLE|UNAVAILABLE|INVALID)$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_ARCH=(x86_64|aarch64|UNSUPPORTED)$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_PATH=\/[A-Za-z0-9._+\/-]+$/ {print; next}
              /^TICKFLOW_PREMIUM_AWS_CLI_VERSION=[0-9]+(\.[0-9]+)*$/ {print; next}
            ' | head -n 5)"
            if [[ -n "$safe_diagnostics" ]]; then
              printf '%s\n' "$safe_diagnostics" >&2
            elif [[ "$status_details" == *TimedOut* ]]; then
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=SSM_COMMAND_TIMEOUT' >&2
            elif [[ "$response_code" =~ ^[1-9][0-9]*$ || "$status_details" == *Failed* ]]; then
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=SSM_REMOTE_COMMAND' >&2
            else
              echo 'TICKFLOW_PREMIUM_FAILED_STAGE=UNKNOWN' >&2
            fi
          }
          for _ in $(seq 1 100); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling) echo "TICKFLOW_PREMIUM_PROBE=$status" >&2; report_terminal_failure; exit 1 ;;
            esac
            sleep 3
          done
          echo 'TICKFLOW_PREMIUM_PROBE=TIMEOUT' >&2
          report_terminal_failure
          exit 1
