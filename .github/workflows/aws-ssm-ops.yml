name: AWS SSM Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only operation to run through SSM
        required: true
        type: choice
        options:
          - health_check
          - mcp_status
          - futures_status
          - us_livefeed_status
          - us_livefeed_runtime_diff_audit
          - us_livefeed_exact_runpy_probe
          - us_livefeed_controlled_restart_probe
          - us_opend_start_order_probe
          - futures_opend_probe
          - futures_opend_env_probe
          - futures_opend_core_mapping
          - futures_opend_snapshot_probe
          - us_opend_k1m_probe
          - us_opend_qot_right_notify_probe
          - us_opend_userinfo_qot_right_probe
          - us_opend_k1m_continuity_probe
          - us_opend_k5m_probe
          - us_opend_k5m_crosscheck_probe
          - us_opend_k1m_reconnect_probe
          - us_opend_adapter_standalone_probe
          - us_opend_adapter_systemd_probe
          - us_opend_bridge_systemd_probe
          - us_opend_persistent_loop_probe
          - futures_opend_client_install
          - mcp_diagnose
          - mcp_protocol_probe
          - secure_mcp_remote_e2e
          - canonical_futures_mcp_remote_e2e
          - secure_mcp_tunnel_deploy

concurrency:
  group: aws-ssm-ops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  read-only-ssm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: github-ops-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout workflow source for bounded provenance evidence
        if: ${{ inputs.action == 'mcp_protocol_probe' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify caller and target instance
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-instances \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"

      - name: Select fixed read-only command set
        id: command-set
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ACTION" in
            health_check)
              printf '%s\n' '["whoami","hostname","date -u"]' > commands.json
              ;;
            mcp_status)
              printf '%s\n' '["ss -ltnp | grep -E '\''(:(11111|22222))\\b'\'' || true","systemctl is-active stock-razor-mcp.service 2>/dev/null || true"]' > commands.json
              ;;
            futures_status)
              read -r -d '' futures_status_script <<'REMOTE' || true
          set -u
          unit='stock-razor-futures.service'
          echo '=== FUTURES UNIT STATE ==='
          systemctl is-active "$unit" 2>&1 || true
          systemctl is-enabled "$unit" 2>&1 || true
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p NRestarts -p MemoryCurrent -p MemoryPeak -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>&1 || true
          echo '=== FUTURES STATUS ==='
          systemctl status "$unit" --no-pager 2>&1 || true
          echo '=== FUTURES JOURNAL ==='
          journalctl -u "$unit" -n 120 --no-pager 2>&1 || true
          echo '=== FUTURES PROCESS ==='
          pid="$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)"
          if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then
            ps -p "$pid" -o pid=,user=,lstart=,etime=,stat=,args= 2>&1 || true
            echo "PID_CWD=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            echo "PID_EXE=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
          else
            echo 'MAIN_PID=NONE'
          fi
          echo '=== FUTURES DEPLOYED PROVENANCE ==='
          workdir="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$workdir" ] && [ "$workdir" != "-" ] && [ -d "$workdir" ]; then
            git -C "$workdir" rev-parse HEAD 2>/dev/null || true
            git -C "$workdir" status --porcelain 2>/dev/null || true
          fi
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$futures_status_script" '[ $script ]' > commands.json
              ;;
            us_opend_start_order_probe)
              read -r -d '' us_opend_start_order_probe_script <<'REMOTE' || true
          set -eu
          svc=stock-razor-us-livefeed.service
          echo '=== US OPEND START-ORDER READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          cleanup(){ systemctl start "$svc" || true; }
          trap cleanup EXIT INT TERM
          echo '--- STOP PERSISTENT ---'
          systemctl stop "$svc"
          systemctl is-active "$svc" || true
          echo '--- TRANSIENT ADAPTER PROBE WHILE PERSISTENT STOPPED ---'
          PYTHONPATH=/opt/stock-razor-us-livefeed/repo HOME=/root /opt/stock-razor-opend-client/venv/bin/python - <<'PY'
          import json,time,uuid
          import futu as ft
          from data_provider.futu_k1m_streaming_adapter import FutuK1MStreamingAdapter
          codes=["US.AMD","US.NVDA","US.TSLA","US.AAPL","US.QQQ"]; events=[]
          ctx=ft.OpenQuoteContext(host="127.0.0.1",port=11111)
          adapter=FutuK1MStreamingAdapter(ctx,ft,runtime_instance_id=str(uuid.uuid4()),controller_generation=lambda:1)
          adapter.register_event_sink(events.append); adapter.start()
          try:
              adapter.subscribe_streams(codes); time.sleep(15)
              print(json.dumps({"phase":"transient_while_persistent_stopped","event_count":len(events),"diagnostics":adapter.diagnostics()},separators=(",",":")),flush=True)
          finally:
              adapter.unsubscribe_streams(codes); adapter.stop(); ctx.close()
          PY
          echo '--- START PERSISTENT AFTER TRANSIENT EXIT ---'
          systemctl start "$svc"
          sleep 15
          systemctl is-active "$svc"
          cat /run/stock-razor-us-livefeed/latest-heartbeat.json
          echo
          trap - EXIT INT TERM
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_opend_start_order_probe_script" '[ $script ]' > commands.json
              ;;
            us_livefeed_controlled_restart_probe)
              read -r -d '' us_livefeed_controlled_restart_probe_script <<'REMOTE' || true
          set -eu
          echo '=== US LIVEFEED CONTROLLED RESTART READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          before=/run/stock-razor-us-livefeed/latest-heartbeat.json
          echo '--- BEFORE ---'
          test -f "$before" && cat "$before" || true
          systemctl restart stock-razor-us-livefeed.service
          sleep 15
          echo '--- UNIT ---'
          systemctl is-active stock-razor-us-livefeed.service
          systemctl show stock-razor-us-livefeed.service -p MainPID -p NRestarts -p ExecMainStartTimestamp --no-pager
          echo '--- AFTER ---'
          test -f "$before" && cat "$before"
          echo
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_livefeed_controlled_restart_probe_script" '[ $script ]' > commands.json
              ;;
            us_livefeed_exact_runpy_probe)
              read -r -d '' us_livefeed_exact_runpy_probe_script <<'REMOTE' || true
          set -u
          echo '=== US LIVEFEED EXACT INSTALLED RUN.PY BOUNDED PROBE ==='
          echo 'LIVE_TRADE=NO'
          test "$(systemctl is-active stock-razor-us-livefeed.service)" = active
          rm -f /tmp/stock-razor-us-livefeed-exact-probe.json
          set +e
          env PYTHONUNBUFFERED=1 PYTHONPATH=/opt/stock-razor-us-livefeed/repo HOME=/root STOCK_RAZOR_REPO_SHA=$(cd /opt/stock-razor-us-livefeed/repo && git rev-parse HEAD) STOCK_RAZOR_US_LIVEFEED_STATUS_PATH=/tmp/stock-razor-us-livefeed-exact-probe.json timeout --signal=TERM --kill-after=5s 32s /opt/stock-razor-opend-client/venv/bin/python /opt/stock-razor-us-livefeed/run.py
          rc=$?
          set -e
          echo "PROBE_EXIT=$rc"
          cat /tmp/stock-razor-us-livefeed-exact-probe.json 2>/dev/null || true
          echo
          echo "FORMAL_SERVICE=$(systemctl is-active stock-razor-us-livefeed.service || true)"
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_livefeed_exact_runpy_probe_script" '[ $script ]' > commands.json
              ;;
            us_livefeed_runtime_diff_audit)
              read -r -d '' us_livefeed_runtime_diff_audit_script <<'REMOTE' || true
          set -eu
          svc=stock-razor-us-livefeed.service
          pid=$(systemctl show "$svc" -p MainPID --value)
          echo '=== US LIVEFEED FORMAL RUNTIME DIFF AUDIT ==='
          systemctl is-active "$svc" || true
          echo "MAIN_PID=$pid"
          systemctl show "$svc" -p WorkingDirectory -p FragmentPath -p User -p Group -p NoNewPrivileges -p PrivateTmp -p ProtectSystem -p Environment --no-pager
          if [ "$pid" != 0 ]; then
            readlink -f /proc/$pid/cwd
            tr '\0' ' ' < /proc/$pid/cmdline; echo
            tr '\0' '\n' < /proc/$pid/environ | sort
          fi
          sha256sum /opt/stock-razor-us-livefeed/run.py
          sha256sum /etc/systemd/system/stock-razor-us-livefeed.service
          cd /opt/stock-razor-us-livefeed/repo
          git rev-parse HEAD
          git status --porcelain
          cat /run/stock-razor-us-livefeed/latest-heartbeat.json 2>/dev/null || true
          echo
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_livefeed_runtime_diff_audit_script" '[ $script ]' > commands.json
              ;;
            us_livefeed_status)
              read -r -d '' us_livefeed_status_script <<'REMOTE' || true
          set -u
          unit='stock-razor-us-livefeed.service'
          status_path='/run/stock-razor-us-livefeed/latest-heartbeat.json'
          snapshot_path='/run/stock-razor-us-livefeed/canonical-market-snapshot.json'
          echo '=== US LIVEFEED UNIT STATE ==='
          systemctl is-active "$unit" 2>&1 || true
          systemctl is-enabled "$unit" 2>&1 || true
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p NRestarts -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>&1 || true
          echo '=== OPEND 11111 LISTENER ==='
          ss -lntp 2>&1 | grep -E ':(11111)\b' || true
          echo '=== US LIVEFEED HEARTBEAT ==='
          if [ -f "$status_path" ]; then
            cat "$status_path"
          else
            echo 'HEARTBEAT=UNKNOWN:FILE_MISSING'
          fi
          echo '=== CANONICAL SNAPSHOT EXPORT ==='
          if [ -s "$snapshot_path" ]; then
            /opt/stock-razor-opend-client/venv/bin/python - "$snapshot_path" <<'PY'
          import json,sys
          path=sys.argv[1]
          try:
              with open(path,encoding="utf-8") as handle:
                  payload=json.load(handle)
              symbols={}
              for code,item in (payload.get("symbols") or {}).items():
                  frames=item.get("timeframes") or {}
                  symbols[code]={
                      tf:{
                          "count":len(frames.get(tf) or []),
                          "latest_end_utc":((frames.get(tf) or [{}])[-1].get("bar_end_utc") if frames.get(tf) else None),
                      }
                      for tf in ("1m","5m","15m","1h")
                  }
              out={
                  "status":"PASS",
                  "schema":payload.get("schema"),
                  "repo_sha":payload.get("repo_sha"),
                  "runtime_instance_id":payload.get("runtime_instance_id"),
                  "sequence":payload.get("sequence"),
                  "emitted_at_utc":payload.get("emitted_at_utc"),
                  "market_state_us":payload.get("market_state_us"),
                  "cache_session_us":payload.get("cache_session_us"),
                  "delivery_mode":payload.get("delivery_mode"),
                  "bar_closure":payload.get("bar_closure"),
                  "radar_admission":payload.get("radar_admission"),
                  "live_trade":payload.get("live_trade"),
                  "symbols":symbols,
              }
              print(json.dumps(out,separators=(",",":")))
          except Exception as exc:
              print(json.dumps({"status":"BLOCKED","error":type(exc).__name__},separators=(",",":")))
          PY
          else
            echo 'CANONICAL_SNAPSHOT=UNKNOWN:FILE_MISSING'
          fi
          echo '=== US LIVEFEED JOURNAL ==='
          journalctl -u "$unit" -n 120 --no-pager 2>&1 || true
          echo '=== US LIVEFEED DEPLOYED PROVENANCE ==='
          workdir="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$workdir" ] && [ "$workdir" != "-" ] && [ -d "$workdir" ]; then
            echo "DEPLOYED_EXACT_SHA=$(git -C "$workdir" rev-parse HEAD 2>/dev/null || true)"
            git -C "$workdir" status --porcelain 2>/dev/null || true
          else
            echo 'DEPLOYED_EXACT_SHA=UNKNOWN'
          fi
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_livefeed_status_script" '[ $script ]' > commands.json
              ;;
            futures_opend_env_probe)
              read -r -d '' futures_opend_env_probe_script <<'REMOTE' || true
          set -u
          echo '=== OPEND FUTU SDK ENVIRONMENT DISCOVERY ==='
          echo 'LIVE_TRADE=NO'
          for py in /usr/bin/python3 /opt/stock-razor-mcp/venv/bin/python /opt/stock-razor-futures/venv/bin/python; do
            if [ ! -x "$py" ]; then
              echo "PYTHON=$py EXISTS=NO FUTU_IMPORT=UNKNOWN"
              continue
            fi
            "$py" - "$py" <<'PY'
          import importlib.util, json, pathlib, sys
          py = sys.argv[1]
          spec = importlib.util.find_spec("futu")
          out = {"python": py, "exists": True, "futu_import": bool(spec)}
          if spec is not None:
              out["futu_origin"] = str(pathlib.Path(spec.origin).resolve()) if spec.origin else "UNKNOWN"
              try:
                  import futu
                  out["futu_version"] = getattr(futu, "__version__", "AVAILABLE")
              except Exception as exc:
                  out["futu_import_error"] = type(exc).__name__
          print(json.dumps(out, separators=(",", ":")))
          PY
          done
          echo '=== OPEND PROCESS/LISTENERS ==='
          pgrep -x OpenD 2>/dev/null | head -n 3 | while read -r pid; do
            echo "OPEND_PID=$pid"
            echo "OPEND_EXE=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            echo "OPEND_CWD=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
          done
          ss -lntp 2>/dev/null | grep -E ':(11111|22222)\\b' || true
          echo 'NO_PACKAGE_INSTALL=TRUE'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$futures_opend_env_probe_script" '[ $script ]' > commands.json
              ;;
            futures_opend_client_install)
              read -r -d '' futures_opend_client_install_script <<'REMOTE' || true
          set -euo pipefail
          install_root=/opt/stock-razor-opend-client
          export HOME=/root
          python3 -m venv "$install_root/venv"
          "$install_root/venv/bin/pip" install --disable-pip-version-check --no-input 'futu-api==10.11.7108'
          "$install_root/venv/bin/python" - <<'PY'
          import futu
          print("FUTU_IMPORT_SMOKE=PASS")
          print("FUTU_VERSION=" + str(getattr(futu, "__version__", "UNKNOWN")))
          PY
          echo 'OPEND_CLIENT_INSTALL=PASS'
          echo 'LIVE_TRADE=NO'
          REMOTE
              encoded="$(printf '%s' "$futures_opend_client_install_script" | base64 -w0)"
              wrapper="printf '%s' '$encoded' | base64 -d | bash"
              jq -c -n --arg script "$wrapper" '[ $script ]' > commands.json
              ;;
            us_opend_persistent_loop_probe)
              read -r -d '' us_opend_persistent_loop_probe_script <<'REMOTE' || true
          set -eu
          echo '=== OPEND PERSISTENT LOOP SYSTEMD READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          probe=/run/stock-razor-us-livefeed/systemd-persistent-loop-probe.py
          out=/run/stock-razor-us-livefeed/systemd-persistent-loop-probe.out
          cat >"$probe" <<'PY'
          import json,time,uuid
          import futu as ft
          from data_provider.futu_k1m_streaming_adapter import FutuK1MStreamingAdapter
          from data_provider.live_feed_types import SemanticStreamKey
          from src.services.live_feed.commands import FakeProviderCommandExecutor
          from src.services.live_feed.controller import LiveFeedController
          from src.services.live_feed.runtime_bridge import LiveFeedRuntimeBridge
          codes=["US.AMD","US.NVDA","US.TSLA","US.AAPL","US.QQQ"]; runtime_id=str(uuid.uuid4()); accepted=[]
          ctx=ft.OpenQuoteContext(host="127.0.0.1",port=11111)
          controller=LiveFeedController(runtime_instance_id=runtime_id,provider_id="futu",command_executor=FakeProviderCommandExecutor())
          adapter=FutuK1MStreamingAdapter(ctx,ft,runtime_instance_id=runtime_id,controller_generation=lambda:controller.snapshot().controller_generation)
          bridge=LiveFeedRuntimeBridge(controller,adapter,on_event_accepted=accepted.append)
          keys=[SemanticStreamKey("futu","us",c,"K_1M","1m") for c in codes]
          try:
              bridge.start(keys)
              samples=[]
              for seq in range(1,7):
                  time.sleep(5); snap=bridge.drain(); samples.append({"sequence":seq,"accepted":len(accepted),"callbacks":adapter.diagnostics()["handler_callback_count"],"subscribed":len(snap.subscribed)})
              print(json.dumps({"probe":"us_opend_persistent_loop_systemd","accepted_event_count":len(accepted),"diagnostics":adapter.diagnostics(),"samples":samples,"delivery_mode":"UNKNOWN","radar_admission":"BLOCKED","live_trade":False},separators=(",",":")),flush=True)
          finally:
              try: bridge.stop()
              finally: ctx.close()
          PY
          rm -f "$out"
          systemd-run --wait --collect --quiet --unit=stock-razor-us-persistent-loop-probe \
            -p WorkingDirectory=/opt/stock-razor-us-livefeed/repo \
            -p Environment=PYTHONPATH=/opt/stock-razor-us-livefeed/repo -p Environment=HOME=/root \
            -p NoNewPrivileges=true -p PrivateTmp=true -p ProtectSystem=strict \
            -p StandardOutput=file:"$out" -p StandardError=append:"$out" \
            /opt/stock-razor-opend-client/venv/bin/python "$probe"
          cat "$out"
          rm -f "$probe" "$out"
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_opend_persistent_loop_probe_script" '[ $script ]' > commands.json
              ;;
            us_opend_bridge_systemd_probe)
              read -r -d '' us_opend_bridge_systemd_probe_script <<'REMOTE' || true
          set -eu
          echo '=== OPEND ADAPTER + CONTROLLER + BRIDGE SYSTEMD READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          probe=/run/stock-razor-us-livefeed/systemd-bridge-probe.py
          out=/run/stock-razor-us-livefeed/systemd-bridge-probe.out
          cat >"$probe" <<'PY'
          import json,time,uuid
          import futu as ft
          from data_provider.futu_k1m_streaming_adapter import FutuK1MStreamingAdapter
          from data_provider.live_feed_types import SemanticStreamKey
          from src.services.live_feed.commands import FakeProviderCommandExecutor
          from src.services.live_feed.controller import LiveFeedController
          from src.services.live_feed.runtime_bridge import LiveFeedRuntimeBridge
          codes=["US.AMD","US.NVDA","US.TSLA","US.AAPL","US.QQQ"]; runtime_id=str(uuid.uuid4()); accepted=[]
          ctx=ft.OpenQuoteContext(host="127.0.0.1",port=11111)
          controller=LiveFeedController(runtime_instance_id=runtime_id,provider_id="futu",command_executor=FakeProviderCommandExecutor())
          adapter=FutuK1MStreamingAdapter(ctx,ft,runtime_instance_id=runtime_id,controller_generation=lambda:controller.snapshot().controller_generation)
          bridge=LiveFeedRuntimeBridge(controller,adapter,on_event_accepted=accepted.append)
          keys=[SemanticStreamKey("futu","us",c,"K_1M","1m") for c in codes]
          try:
              start=bridge.start(keys); time.sleep(30); snap=bridge.drain()
              print(json.dumps({"probe":"us_opend_bridge_systemd","accepted_event_count":len(accepted),"diagnostics":adapter.diagnostics(),"subscribed":[k.symbol for k in snap.subscribed],"controller_lifecycle":snap.controller.lifecycle_state.value,"controller_failure_class":snap.controller.failure_class.value,"delivery_mode":"UNKNOWN","radar_admission":"BLOCKED","live_trade":False},separators=(",",":")),flush=True)
          finally:
              try: bridge.stop()
              finally: ctx.close()
          PY
          rm -f "$out"
          systemd-run --wait --collect --quiet --unit=stock-razor-us-bridge-probe \
            -p WorkingDirectory=/opt/stock-razor-us-livefeed/repo \
            -p Environment=PYTHONPATH=/opt/stock-razor-us-livefeed/repo -p Environment=HOME=/root \
            -p NoNewPrivileges=true -p PrivateTmp=true -p ProtectSystem=strict \
            -p StandardOutput=file:"$out" -p StandardError=append:"$out" \
            /opt/stock-razor-opend-client/venv/bin/python "$probe"
          cat "$out"
          rm -f "$probe" "$out"
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$us_opend_bridge_systemd_probe_script" '[ $script ]' > commands.json
              ;;
            us_opend_adapter_systemd_probe)
              read -r -d '' us_opend_adapter_systemd_probe_script <<'REMOTE' || true
          set -eu
          echo '=== OPEND CANONICAL ADAPTER SYSTEMD SANDBOX READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          probe=/run/stock-razor-us-livefeed/systemd-adapter-probe.py
          out=/run/stock-razor-us-livefeed/systemd-adapter-probe.out
          cat >"$probe" <<'PY'
          import json,time,uuid
          import futu as ft
          from data_provider.futu_k1m_streaming_adapter import FutuK1MStreamingAdapter
          from data_provider.live_feed_types import SemanticStreamKey
          codes=["US.AMD","US.NVDA","US.TSLA","US.AAPL","US.QQQ"]; events=[]
          ctx=ft.OpenQuoteContext(host="127.0.0.1",port=11111)
          adapter=FutuK1MStreamingAdapter(ctx,ft,runtime_instance_id=str(uuid.uuid4()),controller_generation=lambda:1)
          adapter.register_event_sink(events.append)
          try:
              adapter.start(); keys=[SemanticStreamKey("futu","us",c,"K_1M","1m") for c in codes]
              adapter.subscribe_streams(keys); time.sleep(30)
              print(json.dumps({"probe":"us_opend_adapter_systemd","event_count":len(events),"diagnostics":adapter.diagnostics(),"delivery_mode":"UNKNOWN","radar_admission":"BLOCKED","live_trade":False},separators=(",",":")),flush=True)
          finally:
              adapter.stop(); ctx.close()
          PY
          rm -f "$out"
          systemd-run --wait --collect --quiet --unit=stock-razor-us-adapter-probe \
            -p WorkingDirectory=/opt/stock-razor-us-livefeed/repo \
