              with urllib.request.urlopen(req, timeout=90) as res:
                  status = res.status
                  payload = json.loads(res.read().decode('utf-8'))
          except Exception as exc:
              print('CANONICAL_FUTURES_MCP_RESPONSES=FAIL')
              print('CANONICAL_FUTURES_MCP_REASON=' + type(exc).__name__)
              raise SystemExit(1)
          output = payload.get('output') if isinstance(payload, dict) else None
          if status != 200 or not isinstance(output, list):
              print('CANONICAL_FUTURES_MCP_RESPONSES=FAIL'); raise SystemExit(1)
          listed = [x for x in output if isinstance(x, dict) and x.get('type') == 'mcp_list_tools']
          discovered = None
          for item in listed:
              tools = item.get('tools')
              if isinstance(tools, list):
                  names = [t.get('name') for t in tools if isinstance(t, dict)]
                  if set(names) == expected:
                      discovered = names
          calls = [x for x in output if isinstance(x, dict) and x.get('type') == 'mcp_call']
          if discovered is None or len(calls) != 1 or calls[0].get('name') != 'get_futures_runtime_health' or calls[0].get('error') not in (None, ''):
              print('CANONICAL_FUTURES_MCP_PROTOCOL=FAIL'); raise SystemExit(1)
          value = calls[0].get('output')
          if isinstance(value, str):
              value = json.loads(value)
          if not isinstance(value, dict):
              print('CANONICAL_FUTURES_MCP_HEALTH=FAIL'); raise SystemExit(1)
          if value.get('live_trade') is not False or value.get('radar_admission') != 'BLOCKED':
              print('CANONICAL_FUTURES_MCP_FAIL_CLOSED=FAIL'); raise SystemExit(1)
          print('RESPONSES_API_HTTP=PASS')
          print('MCP_LIST_TOOLS=PASS')
          print('DISCOVERED_TOOLS=' + json.dumps(discovered, separators=(',', ':')))
          print('MCP_CALL_GET_FUTURES_RUNTIME_HEALTH=PASS')
          print('CANONICAL_FUTURES_MCP_FAIL_CLOSED=PASS')
          print('RADAR_ADMISSION=BLOCKED')
          print('LIVE_TRADE=NO')
          print('CANONICAL_FUTURES_MCP_E2E=PASS')
          PY
          REMOTE
              jq -c -n --arg script "$canonical_e2e_script" '[ $script ]' > commands.json
              ;;
            secure_mcp_tunnel_deploy)
              read -r -d '' deploy_script <<'REMOTE' || true
          # AWS-RunShellScript invokes commands with /bin/sh on this host;
          # keep the remote bootstrap POSIX-shell compatible.
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          tunnel_id='tunnel_6abedaad9a8881919dbad5a7b56e095d'
          mcp_server_url='http://127.0.0.1:8000/mcp'
          parameter_name='arn:aws:ssm:ap-northeast-1:888425712426:parameter/stock-razor/mcp-tunnel/openai-api-key'
          install_dir='/opt/stock-razor/tunnel-client'
          profile_dir='/etc/stock-razor/tunnel-client'
          wrapper='/usr/local/sbin/stock-razor-tunnel-client'
          unit='/etc/systemd/system/stock-razor-secure-mcp-tunnel.service'
          mkdir -p "$install_dir" "$profile_dir" /usr/local/sbin
          chmod 0755 "$install_dir" /usr/local/sbin

          release_json="$(curl --fail --silent --show-error --location --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/openai/tunnel-client/releases/latest)"
          release_tag="$(printf '%s' "$release_json" | jq -r 'select(.prerelease == false) | .tag_name')"
          case "$release_tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'TUNNEL_CLIENT_RELEASE=UNKNOWN' >&2; exit 1 ;;
          esac
          asset="tunnel-client-${release_tag}-linux-amd64.zip"
          checksum_url="https://github.com/openai/tunnel-client/releases/download/${release_tag}/SHA256SUMS.txt"
          asset_url="https://github.com/openai/tunnel-client/releases/download/${release_tag}/${asset}"
          tmp_dir="$(mktemp -d /tmp/stock-razor-tunnel.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 60 "$checksum_url" -o "$tmp_dir/SHA256SUMS.txt"
          curl --fail --silent --show-error --location --max-time 120 "$asset_url" -o "$tmp_dir/$asset"
          expected_checksum="$(awk -v file="$asset" '$2 == file { print $1; exit }' "$tmp_dir/SHA256SUMS.txt")"
          test "${#expected_checksum}" -eq 64
          printf '%s  %s\n' "$expected_checksum" "$tmp_dir/$asset" | sha256sum --check --status
          python3 - "$tmp_dir/$asset" "$tmp_dir/extracted" <<'PY'
          import sys
          import os
          import zipfile

          os.makedirs(sys.argv[2], exist_ok=True)
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
          client_path="$(find "$tmp_dir/extracted" -type f -name tunnel-client -perm -u+x -print -quit)"
          test -n "$client_path"
          install -m 0755 "$client_path" "$install_dir/tunnel-client"
          "$install_dir/tunnel-client" --version >/dev/null
          echo "TUNNEL_CLIENT_RELEASE=$release_tag"
          echo "TUNNEL_CLIENT_CHECKSUM=PASS"

          if [ ! -s "$profile_dir/stock-razor-secure-mcp.yaml" ]; then
            "$install_dir/tunnel-client" init \
              --sample sample_mcp_with_dcr \
              --profile stock-razor-secure-mcp \
              --profile-dir "$profile_dir" \
              --tunnel-id "$tunnel_id" \
              --mcp-server-url "$mcp_server_url"
          fi
          api_key="$(aws ssm get-parameter --name "$parameter_name" --with-decryption --query 'Parameter.Value' --output text)"
          test -n "$api_key" && test "$api_key" != None
          export CONTROL_PLANE_API_KEY="$api_key"
          unset api_key
          "$install_dir/tunnel-client" doctor \
            --profile-dir "$profile_dir" \
            --profile stock-razor-secure-mcp \
            --explain
          echo 'TUNNEL_CLIENT_DOCTOR=PASS'

          cat > "$wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          parameter_name='arn:aws:ssm:ap-northeast-1:888425712426:parameter/stock-razor/mcp-tunnel/openai-api-key'
          api_key="$(/usr/bin/aws ssm get-parameter --name "$parameter_name" --with-decryption --query 'Parameter.Value' --output text)"
          test -n "$api_key" && test "$api_key" != None
          export CONTROL_PLANE_API_KEY="$api_key"
          unset api_key
          exec /opt/stock-razor/tunnel-client/tunnel-client \
            run --profile-dir /etc/stock-razor/tunnel-client \
            --profile stock-razor-secure-mcp \
            --health.listen-addr 127.0.0.1:18080 \
            --log.level info --log.format struct-text
          WRAPPER
          chmod 0750 "$wrapper"
          chown root:root "$wrapper"

          cat > "$unit" <<'UNIT'
          [Unit]
          Description=Stock Razor Secure MCP Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/sbin/stock-razor-tunnel-client
          Restart=on-failure
          RestartSec=5s
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

          [Install]
          WantedBy=multi-user.target
          UNIT
          chmod 0644 "$unit"
          systemctl daemon-reload
          systemctl enable stock-razor-secure-mcp-tunnel.service >/dev/null
          systemctl restart stock-razor-secure-mcp-tunnel.service

          ready=1
          for attempt in $(seq 1 24); do
            if systemctl is-active --quiet stock-razor-secure-mcp-tunnel.service && \
              curl --fail --silent --show-error --max-time 3 -o /dev/null http://127.0.0.1:18080/readyz; then
              ready=0
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 0 ]; then
            echo 'TUNNEL_CLIENT_CONNECTED_READY=FAIL' >&2
            systemctl is-active stock-razor-secure-mcp-tunnel.service >&2 || true
            exit 1
          fi
          echo 'TUNNEL_CLIENT_CONNECTED_READY=PASS'
          echo 'SECURE_REMOTE_MCP=NOT_VERIFIED'
          echo 'CHATGPT_NATIVE_MCP_READ=NOT_VERIFIED'
          REMOTE
              jq -c -n --arg script "$deploy_script" '[ $script ]' > commands.json
              ;;
            *)
              echo "Unsupported action" >&2
              exit 2
              ;;
          esac
          echo "commands=$(<commands.json)" >> "$GITHUB_OUTPUT"

      - name: Send fixed command through SSM
        id: send-command
        shell: bash
        env:
          COMMANDS: ${{ steps.command-set.outputs.commands }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted to $TARGET_INSTANCE_ID"

      - name: Wait for SSM result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          wait_attempts=30
          if [ "$REQUESTED_ACTION" = "secure_mcp_remote_e2e" ]; then
            wait_attempts=180
          fi
          for attempt in $(seq 1 "$wait_attempts"); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command" >&2
          exit 1
