                                          "source_k1m_volumes":[float(source.get("volume") or 0) for source in source_rows],
                                          "source_k1m_turnovers":[float(source.get("turnover") or 0) for source in source_rows],
                                          "derived_volume":derived_volume,
                                          "native_volume":native_volume,
                                          "volume_delta":derived_volume-native_volume,
                                          "volume_ratio":None if native_volume==0 else derived_volume/native_volume,
                                          "derived_turnover":derived_turnover,
                                          "native_turnover":native_turnover,
                                          "turnover_delta":None if derived_turnover is None else derived_turnover-native_turnover,
                                          "turnover_ratio":None if native_turnover==0 or derived_turnover is None else derived_turnover/native_turnover,
                                      })
                              else: unknown_count+=1
                          unmatched_derived=len(derived)-matched
                          unmatched_native=len(five_day)-matched
                          sorted_volume_abs_deltas=sorted(volume_abs_deltas)
                          sorted_turnover_abs_deltas=sorted(turnover_abs_deltas)
