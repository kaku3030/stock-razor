name: AWS SSM Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only operation to run through SSM
        required: true
        type: choice
        options:
          - health_check
          - mcp_status
          - futures_status
          - futures_opend_probe
          - futures_opend_env_probe
          - futures_opend_client_install
          - mcp_diagnose
          - mcp_protocol_probe
          - secure_mcp_remote_e2e
          - canonical_futures_mcp_remote_e2e
          - secure_mcp_tunnel_deploy

concurrency:
  group: aws-ssm-ops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  read-only-ssm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: github-ops-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout workflow source for bounded provenance evidence
        if: ${{ inputs.action == 'mcp_protocol_probe' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify caller and target instance
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-instances \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"

      - name: Select fixed read-only command set
        id: command-set
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ACTION" in
            health_check)
              printf '%s\n' '["whoami","hostname","date -u"]' > commands.json
              ;;
            mcp_status)
              printf '%s\n' '["ss -ltnp | grep -E '\''(:(11111|22222))\\b'\'' || true","systemctl is-active stock-razor-mcp.service 2>/dev/null || true"]' > commands.json
              ;;
            futures_status)
              read -r -d '' futures_status_script <<'REMOTE' || true
          set -u
          unit='stock-razor-futures.service'
          echo '=== FUTURES UNIT STATE ==='
          systemctl is-active "$unit" 2>&1 || true
          systemctl is-enabled "$unit" 2>&1 || true
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p NRestarts -p MemoryCurrent -p MemoryPeak -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>&1 || true
          echo '=== FUTURES STATUS ==='
          systemctl status "$unit" --no-pager 2>&1 || true
          echo '=== FUTURES JOURNAL ==='
          journalctl -u "$unit" -n 120 --no-pager 2>&1 || true
          echo '=== FUTURES PROCESS ==='
          pid="$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)"
          if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -d "/proc/$pid" ]; then
            ps -p "$pid" -o pid=,user=,lstart=,etime=,stat=,args= 2>&1 || true
            echo "PID_CWD=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            echo "PID_EXE=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
          else
            echo 'MAIN_PID=NONE'
          fi
          echo '=== FUTURES DEPLOYED PROVENANCE ==='
          workdir="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$workdir" ] && [ "$workdir" != "-" ] && [ -d "$workdir" ]; then
            git -C "$workdir" rev-parse HEAD 2>/dev/null || true
            git -C "$workdir" status --porcelain 2>/dev/null || true
          fi
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$futures_status_script" '[ $script ]' > commands.json
              ;;
            futures_opend_env_probe)
              read -r -d '' futures_opend_env_probe_script <<'REMOTE' || true
          set -u
          echo '=== OPEND FUTU SDK ENVIRONMENT DISCOVERY ==='
          echo 'LIVE_TRADE=NO'
          for py in /usr/bin/python3 /opt/stock-razor-mcp/venv/bin/python /opt/stock-razor-futures/venv/bin/python; do
            if [ ! -x "$py" ]; then
              echo "PYTHON=$py EXISTS=NO FUTU_IMPORT=UNKNOWN"
              continue
            fi
            "$py" - "$py" <<'PY'
          import importlib.util, json, pathlib, sys
          py = sys.argv[1]
          spec = importlib.util.find_spec("futu")
          out = {"python": py, "exists": True, "futu_import": bool(spec)}
          if spec is not None:
              out["futu_origin"] = str(pathlib.Path(spec.origin).resolve()) if spec.origin else "UNKNOWN"
              try:
                  import futu
                  out["futu_version"] = getattr(futu, "__version__", "AVAILABLE")
              except Exception as exc:
                  out["futu_import_error"] = type(exc).__name__
          print(json.dumps(out, separators=(",", ":")))
          PY
          done
          echo '=== OPEND PROCESS/LISTENERS ==='
          pgrep -x OpenD 2>/dev/null | head -n 3 | while read -r pid; do
            echo "OPEND_PID=$pid"
            echo "OPEND_EXE=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            echo "OPEND_CWD=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
          done
          ss -lntp 2>/dev/null | grep -E ':(11111|22222)\\b' || true
          echo 'NO_PACKAGE_INSTALL=TRUE'
          echo 'LIVE_TRADE=NO'
          REMOTE
              jq -c -n --arg script "$futures_opend_env_probe_script" '[ $script ]' > commands.json
              ;;
            futures_opend_client_install)
              read -r -d '' futures_opend_client_install_script <<'REMOTE' || true
          set -euo pipefail
          install_root=/opt/stock-razor-opend-client
          python3 -m venv "$install_root/venv"
          "$install_root/venv/bin/pip" install --disable-pip-version-check --no-input 'futu-api==10.11.7108'
          "$install_root/venv/bin/python" - <<'PY'
          import futu
          print("FUTU_IMPORT_SMOKE=PASS")
          print("FUTU_VERSION=" + str(getattr(futu, "__version__", "UNKNOWN")))
          PY
          echo 'OPEND_CLIENT_INSTALL=PASS'
          echo 'LIVE_TRADE=NO'
          REMOTE
              encoded="$(printf '%s' "$futures_opend_client_install_script" | base64 -w0)"
              wrapper="printf '%s' '$encoded' | base64 -d | bash"
              jq -c -n --arg script "$wrapper" '[ $script ]' > commands.json
              ;;
            futures_opend_probe)
              read -r -d '' futures_opend_probe_script <<'REMOTE' || true
          set -u
          echo '=== OPEND FUTURES READ-ONLY CAPABILITY PROBE ==='
          echo 'LIVE_TRADE=NO'
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          result = {
              "probe": "futures_opend_capability",
              "opend_reachable": False,
              "futu_sdk": "UNKNOWN",
              "global_state": "UNKNOWN",
              "futures_account_evidence": "UNKNOWN",
              "us_futures_quote_right": "UNKNOWN",
              "contract_discovery": "UNKNOWN",
              "snapshot": "NOT_ATTEMPTED",
              "subscription": "NOT_ATTEMPTED",
              "live_trade": False,
          }
          try:
              import futu as ft
              result["futu_sdk"] = getattr(ft, "__version__", "AVAILABLE")
          except Exception as exc:
              result["reason"] = "FUTU_SDK_UNAVAILABLE:" + type(exc).__name__
              print(json.dumps(result, separators=(",", ":")))
              raise SystemExit(0)

          ctx = None
          try:
              ctx = ft.OpenQuoteContext(host="127.0.0.1", port=11111)
              result["opend_reachable"] = True
              ret, state = ctx.get_global_state()
              if ret == ft.RET_OK:
                  result["global_state"] = "AVAILABLE"
                  if hasattr(state, "to_dict"):
                      records = state.to_dict("records")
                      safe = []
                      for row in records[:3]:
                          safe.append({str(k): v for k, v in row.items() if str(k).lower() not in {"user_id", "login_user_id"}})
                      result["global_state_sample"] = safe
              else:
                  result["global_state"] = "ERROR:" + str(state)[:200]

              # Static discovery first: no market-data subscription and no trading action.
              discovered = {}
              for market_name in ("US",):
                  try:
                      market = getattr(ft.Market, market_name)
                      ret, data = ctx.get_stock_basicinfo(market, ft.SecurityType.FUTURE)
                      if ret == ft.RET_OK and hasattr(data, "to_dict"):
                          rows = data.to_dict("records")
                          discovered[market_name] = [
                              {k: row.get(k) for k in ("code", "name", "stock_type", "future_main_contract") if k in row}
                              for row in rows[:50]
                          ]
                          result["contract_discovery"] = "PASS" if rows else "EMPTY"
                      else:
                          discovered[market_name] = {"error": str(data)[:200]}
                  except Exception as exc:
                      discovered[market_name] = {"error_type": type(exc).__name__}
              result["discovered"] = discovered

              # Do not subscribe or trade. Quote rights remain UNKNOWN unless independently evidenced.
              result["snapshot"] = "SKIPPED_REQUIRES_CONFIRMED_CONTRACT_AND_QUOTE_RIGHT"
              result["subscription"] = "SKIPPED_NO_PERMISSION_CHANGE"
          except Exception as exc:
              result["reason"] = "OPEND_PROBE_ERROR:" + type(exc).__name__
          finally:
              if ctx is not None:
                  try:
                      ctx.close()
                  except Exception:
                      pass
          result["observed_at_utc"] = datetime.now(timezone.utc).isoformat()
          print(json.dumps(result, separators=(",", ":"), default=str))
          PY
          REMOTE
              jq -c -n --arg script "$futures_opend_probe_script" '[ $script ]' > commands.json
              ;;
            mcp_diagnose)
              read -r -d '' diagnostic_script <<'REMOTE' || true
          set -u
          unit='stock-razor-mcp.service'
          expected='d7622c6a0c549282d6da5be0cb32aa6701fb8f59'
          redact() {
            sed -E 's/((AWS|ALPACA|MCP|API|ACCESS|SECRET|TOKEN|PASSWORD|PASS|KEY)[_-]?[A-Z0-9]*[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig; s/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig; s/(https?:\/\/[^[:space:]]*([?&](token|key|secret|password)=[^&[:space:]]+)[^[:space:]]*)/\1[REDACTED]/Ig; s/((--?)(api[_-]?key|token|secret|password|access[_-]?key)[=[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig'
          }
          unit_load="$(systemctl show "$unit" -p LoadState --value 2>/dev/null || true)"
          echo '=== UNIT ==='
          if [ "$unit_load" = loaded ]; then echo 'UNIT_EXISTS=YES'; else echo 'UNIT_EXISTS=NO_OR_UNREADABLE'; fi
          systemctl cat "$unit" 2>&1 | redact || true
          echo '--- systemctl status ---'
          systemctl status "$unit" --no-pager 2>&1 | redact || true
          echo '--- unit state ---'
          systemctl is-active "$unit" 2>&1 | redact || true
          systemctl is-enabled "$unit" 2>&1 | redact || true
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>&1 | redact || true
          echo '=== JOURNAL (last 150, redacted) ==='
          journalctl -u "$unit" -n 150 --no-pager 2>&1 | redact || true
          echo '=== RELEVANT PROCESSES ==='
          pattern='stock-razor|mcp|realtime_monitor|gunicorn|uvicorn|python'
          ps -eo pid=,user=,lstart=,args= | grep -Ei "$pattern" | grep -v -E 'grep -E|grep -Ei' | redact || true
          candidates=""
          working_dir="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$working_dir" ] && [ "$working_dir" != "-" ]; then candidates="$candidates $working_dir"; fi
          for pid in $(pgrep -f "$pattern" 2>/dev/null || true); do
            [ -d "/proc/$pid" ] || continue
            proc_line="$(ps -p "$pid" -o pid=,user=,lstart=,args= 2>/dev/null || true)"
            [ -n "$proc_line" ] || continue
            echo "PID_DETAIL=$(printf '%s' "$proc_line" | redact)"
            cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            exe="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            echo "PID_PATHS pid=$pid cwd=${cwd:-UNKNOWN} exe=${exe:-UNKNOWN}"
            [ -n "$cwd" ] && candidates="$candidates $cwd"
          done
          echo '=== LISTENING SOCKETS ==='
          ss -lntp 2>&1 | redact || true
          echo '=== OPEND (read-only) ==='
          for pid in $(pgrep -x opend 2>/dev/null || true); do
            ps -p "$pid" -o pid=,user=,lstart=,args= 2>/dev/null | redact || true
          done
          ss -lntp 2>/dev/null | grep -E ':(11111|22222)\b' | redact || true
          echo '=== IDENTIFIED CHECKOUTS ==='
          for candidate in $candidates; do
            [ -d "$candidate" ] || continue
            top="$(git -C "$candidate" rev-parse --show-toplevel 2>/dev/null || true)"
            [ -n "$top" ] || continue
            head="$(git -C "$top" rev-parse HEAD 2>/dev/null || true)"
            echo "CHECKOUT=$top"
            echo "DEPLOYED_COMMIT=${head:-UNKNOWN}"
            if [ "$head" = "$expected" ]; then echo 'EXPECTED_d7622c6_MATCH=PASS'; else echo 'EXPECTED_d7622c6_MATCH=FAIL_OR_UNKNOWN'; fi
            if [ -n "$(git -C "$top" status --porcelain 2>/dev/null || true)" ]; then echo 'CHECKOUT_DIRTY=YES'; else echo 'CHECKOUT_DIRTY=NO'; fi
          done
          echo '=== BOUNDED IDENTIFIED PATH STATS ==='
          for candidate in $candidates; do
            [ -e "$candidate" ] && stat -c 'PATH=%n TYPE=%F MODE=%a OWNER=%U SIZE=%s MTIME=%y' "$candidate" 2>/dev/null || true
          done
          echo '=== LOCAL HTTP PROBE ==='
          echo 'SKIPPED_UNLESS_HTTP_ENDPOINT_IS_EXPLICITLY_EVIDENT_IN_UNIT_OR_LISTENER_OUTPUT'
          REMOTE
              jq -c -n --arg script "$diagnostic_script" '[ $script ]' > commands.json
              ;;
            mcp_protocol_probe)
              expected_manifest_b64=''
              expected_manifest_sha256='UNAVAILABLE'
              expected='d7622c6a0c549282d6da5be0cb32aa6701fb8f59'
              if git cat-file -e "$expected^{commit}" 2>/dev/null; then
                expected_manifest_b64="$(git show "$expected:realtime_monitor/readonly_mcp_server.py" 2>/dev/null | python3 -c 'import base64,hashlib,sys; data=sys.stdin.buffer.read(); print(base64.b64encode(("realtime_monitor/readonly_mcp_server.py " + hashlib.sha256(data).hexdigest() + "\\n").encode()).decode())' || true)"
                if [ -n "$expected_manifest_b64" ]; then
                  expected_manifest_sha256="$(printf '%s' "$expected_manifest_b64" | base64 -d | sha256sum | awk '{print $1}')"
                fi
              fi
              read -r -d '' protocol_script <<'REMOTE' || true
          set -u
          pid=8607
          cwd="$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"
          source="$cwd/realtime_monitor/readonly_mcp_server.py"
          expected='d7622c6a0c549282d6da5be0cb32aa6701fb8f59'
          expected_manifest_b64='__EXPECTED_MANIFEST_B64__'
          expected_manifest_sha256='__EXPECTED_MANIFEST_SHA256__'
          redact() { sed -E 's/((AWS|ALPACA|MCP|API|ACCESS|SECRET|TOKEN|PASSWORD|PASS|KEY)[_-]?[A-Z0-9]*[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig; s/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig'; }
          echo 'PROBE_V2_1_IDENTITY=PASS'
          echo "MCP_PROCESS_PID=$pid"
          echo "MCP_PROCESS_CWD=$cwd"
          echo "MCP_PROCESS_EXE=$(readlink -f /proc/$pid/exe 2>/dev/null || true)"
          cmdline="$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null || true)"
          echo "MCP_PROCESS_CMDLINE=$(printf '%s' "$cmdline" | redact)"
          echo "MCP_PROCESS_USER=$(ps -p "$pid" -o user= 2>/dev/null | awk '{print $1}')"
          echo "MCP_PROCESS_START=$(ps -p "$pid" -o lstart= 2>/dev/null || true)"
          socket_line="$(ss -lntp 2>/dev/null | grep "pid=$pid," | head -n 1 || true)"
          echo "MCP_LISTENER=$socket_line"
          if ! printf '%s' "$cmdline" | grep -q 'readonly_mcp_server\.py'; then echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=readonly-mcp-process-not-evidenced'; exit 0; fi
          echo '=== DEPLOYED PROVENANCE (BEFORE PROTOCOL) ==='
          if [ -z "$cwd" ] || [ "$(git -C "$cwd" rev-parse --is-inside-work-tree 2>/dev/null || true)" != true ]; then
            echo 'RUNTIME_GIT_WORKTREE=NO'; echo 'DEPLOYED_COMMIT=UNKNOWN'; echo 'CHECKOUT_DIRTY=UNKNOWN'
          else
            echo 'RUNTIME_GIT_WORKTREE=YES'
            echo "DEPLOYED_COMMIT=$(git -C "$cwd" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
            echo "CHECKOUT_DIRTY=$([ -n "$(git -C "$cwd" status --porcelain 2>/dev/null || true)" ] && echo YES || echo NO)"
          fi
          echo '=== CONTENT PROVENANCE (BOUNDED RUNTIME SOURCE) ==='
          if [ ! -r "$source" ]; then echo 'CONTENT_PROVENANCE_MATCH=UNKNOWN'; echo 'EXPECTED_d7622c6_MATCH=UNKNOWN'; echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=source-not-readable'; exit 0; fi
          runtime_manifest_b64="$(python3 - "$source" <<'PY'
          import hashlib, pathlib, sys
          p = pathlib.Path(sys.argv[1]).resolve()
          root = p.parent.parent
          rel = p.relative_to(root).as_posix()
          print((rel + ' ' + hashlib.sha256(p.read_bytes()).hexdigest() + '\n').encode().hex())
          PY
          )"
          runtime_manifest_b64="$(printf '%s' "$runtime_manifest_b64" | xxd -r -p | base64 -w0)"
          runtime_manifest_sha256="$(printf '%s' "$runtime_manifest_b64" | base64 -d | sha256sum | awk '{print $1}')"
          echo "RUNTIME_SOURCE_MANIFEST_SHA256=$runtime_manifest_sha256"
          echo "EXPECTED_SOURCE_MANIFEST_SHA256=$expected_manifest_sha256"
          if [ -z "$expected_manifest_b64" ] || [ "$expected_manifest_sha256" = UNAVAILABLE ]; then
            echo 'EXPECTED_SOURCE_MANIFEST=UNAVAILABLE'
            echo 'CONTENT_PROVENANCE_MATCH=UNKNOWN'
            echo 'EXPECTED_d7622c6_MATCH=UNKNOWN'
            echo 'CONTENT_PROVENANCE_REASON=EXPECTED_GIT_OBJECT_UNAVAILABLE'
          elif [ "$runtime_manifest_b64" = "$expected_manifest_b64" ]; then
            echo 'EXPECTED_SOURCE_MANIFEST=AVAILABLE'
            echo 'CONTENT_PROVENANCE_MATCH=PASS'
            echo 'EXPECTED_d7622c6_MATCH=PASS_BY_CONTENT'
          else
            echo 'EXPECTED_SOURCE_MANIFEST=AVAILABLE'
            echo 'CONTENT_PROVENANCE_MATCH=FAIL'
            echo 'EXPECTED_d7622c6_MATCH=FAIL'
            echo 'CONTENT_PROVENANCE_REASON=complete_bounded_manifest_mismatch'
          fi
          echo 'RUNTIME_SOURCE_FILES=realtime_monitor/readonly_mcp_server.py'
          python3 - "$source" <<'PY'
          import ast, pathlib, sys
          tree = ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          local = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import): local.extend(a.name for a in node.names if a.name.startswith('realtime_monitor.'))
              if isinstance(node, ast.ImportFrom) and node.module and node.module.startswith('realtime_monitor.'): local.append(node.module)
          print('RUNTIME_LOCAL_IMPORTS=' + (','.join(sorted(set(local))) if local else 'NONE'))
          PY
          echo '=== DIRECT SOURCE AND SOCKET ENDPOINT EVIDENCE ==='
          if ! printf '%s' "$socket_line" | grep -q '127.0.0.1:8000'; then echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=listener-not-owned-by-proven-pid'; exit 0; fi
          route_evidence="$(python3 - "$source" <<'PY'
          import ast, importlib, inspect, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          tree = ast.parse(text)
          has_transport = any(isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'streamable_http_app' for n in ast.walk(tree))
          has_run = 'streamable-http' in text
          try:
              mod = importlib.import_module('mcp.server.mcpserver')
              src = inspect.getsource(getattr(mod, 'MCPServer'))
              library = 'mcp.server.mcpserver.MCPServer'
          except Exception:
              src = ''
              library = 'unavailable'
          print('transport=' + str(has_transport and has_run).lower() + ';library=' + library + ';library_source=' + str(bool(src)).lower())
          PY
          )"
          echo "MCP_ROUTE_TRANSPORT_EVIDENCE=$route_evidence"
          if ! printf '%s' "$route_evidence" | grep -q 'transport=true'; then echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=streamable-http-construction-not-source-evidenced'; exit 0; fi
          route_status="$(curl --silent --show-error --max-time 5 -o /dev/null -X OPTIONS -w '%{http_code}' http://127.0.0.1:8000/mcp 2>/dev/null || true)"
          echo "MCP_ROUTE_OPTIONS_STATUS=$route_status"
          case "$route_status" in 404|000|'') echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=localhost-route-not-evidenced'; exit 0 ;; 2*|3*|4*) : ;; *) echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=localhost-route-not-evidenced'; exit 0 ;; esac
          echo 'MCP_PROTOCOL_ENDPOINT=http://127.0.0.1:8000/mcp'
          python3 - "$source" "http://127.0.0.1:8000/mcp" <<'PY'
          import datetime as dt,http.client,json,sys
          from urllib.parse import urlsplit
          source=sys.argv[1]; endpoint=urlsplit(sys.argv[2]); host=endpoint.hostname; port=endpoint.port or 80; path=endpoint.path
          allowed={'get_market_snapshots','get_market_bars','get_livefeed_health'}; results={}
          def safe(value):
              if isinstance(value,dict): return {k:('[REDACTED]' if any(x in k.lower() for x in ('token','session','secret','password','api_key','access_key')) else safe(v)) for k,v in value.items()}
              if isinstance(value,list): return [safe(v) for v in value]
              return value
          def send(body,sid=None):
              c=http.client.HTTPConnection(host,port,15); h={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}
              if sid:h['Mcp-Session-Id']=sid
              c.request('POST',path,json.dumps(body),h); r=c.getresponse(); raw=r.read().decode('utf-8','replace'); sid=r.getheader('Mcp-Session-Id') or sid
              if 'text/event-stream' in (r.getheader('Content-Type') or ''): raw=''.join(x[5:].strip() for x in raw.splitlines() if x.startswith('data:'))
              try:o=json.loads(raw)
              except:o={'http_status':r.status,'body_prefix':'[REDACTED]'}
              return r.status,o,sid
          def ok(st,o):return st==200 and isinstance(o,dict) and 'error' not in o and 'result' in o
          def args(t,sym=None):
              sch=t.get('inputSchema',{}); p=sch.get('properties',{}) or {}; out={}
              for k in sch.get('required',[]) or []:
                  n=k.lower(); q=p.get(k,{})
                  if n in ('symbol','ticker','symbol_name','code','stock_code'):out[k]=sym
                  elif n in ('symbols','tickers','codes','stock_codes'):out[k]=[sym]
