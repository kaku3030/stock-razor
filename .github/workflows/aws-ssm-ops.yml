name: AWS SSM Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only operation to run through SSM
        required: true
        type: choice
        options:
          - health_check
          - mcp_status
          - mcp_diagnose
          - mcp_protocol_probe

concurrency:
  group: aws-ssm-ops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  read-only-ssm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: github-ops-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller and target instance
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-instances \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"

      - name: Select fixed read-only command set
        id: command-set
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ACTION" in
            health_check)
              printf '%s\n' '["whoami","hostname","date -u"]' > commands.json
              ;;
            mcp_status)
              printf '%s\n' '["ss -ltnp | grep -E '\''(:(11111|22222))\\b'\'' || true","systemctl is-active stock-razor-mcp.service 2>/dev/null || true"]' > commands.json
              ;;
            mcp_diagnose)
              read -r -d '' diagnostic_script <<'REMOTE' || true
          set -u
          unit='stock-razor-mcp.service'
          expected='d7622c6a0c549282d6da5be0cb32aa6701fb8f59'
          redact() {
            sed -E 's/((AWS|ALPACA|MCP|API|ACCESS|SECRET|TOKEN|PASSWORD|PASS|KEY)[_-]?[A-Z0-9]*[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig; s/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig; s/(https?:\/\/[^[:space:]]*([?&](token|key|secret|password)=[^&[:space:]]+)[^[:space:]]*)/\1[REDACTED]/Ig; s/((--?)(api[_-]?key|token|secret|password|access[_-]?key)[=[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig'
          }
          unit_load="$(systemctl show "$unit" -p LoadState --value 2>/dev/null || true)"
          echo '=== UNIT ==='
          if [ "$unit_load" = loaded ]; then echo 'UNIT_EXISTS=YES'; else echo 'UNIT_EXISTS=NO_OR_UNREADABLE'; fi
          systemctl cat "$unit" 2>&1 | redact || true
          echo '--- systemctl status ---'
          systemctl status "$unit" --no-pager 2>&1 | redact || true
          echo '--- unit state ---'
          systemctl is-active "$unit" 2>&1 | redact || true
          systemctl is-enabled "$unit" 2>&1 | redact || true
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>&1 | redact || true
          echo '=== JOURNAL (last 150, redacted) ==='
          journalctl -u "$unit" -n 150 --no-pager 2>&1 | redact || true
          echo '=== RELEVANT PROCESSES ==='
          pattern='stock-razor|mcp|realtime_monitor|gunicorn|uvicorn|python'
          ps -eo pid=,user=,lstart=,args= | grep -Ei "$pattern" | grep -v -E 'grep -E|grep -Ei' | redact || true
          candidates=""
          working_dir="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$working_dir" ] && [ "$working_dir" != "-" ]; then candidates="$candidates $working_dir"; fi
          for pid in $(pgrep -f "$pattern" 2>/dev/null || true); do
            [ -d "/proc/$pid" ] || continue
            proc_line="$(ps -p "$pid" -o pid=,user=,lstart=,args= 2>/dev/null || true)"
            [ -n "$proc_line" ] || continue
            echo "PID_DETAIL=$(printf '%s' "$proc_line" | redact)"
            cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            exe="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            echo "PID_PATHS pid=$pid cwd=${cwd:-UNKNOWN} exe=${exe:-UNKNOWN}"
            [ -n "$cwd" ] && candidates="$candidates $cwd"
          done
          echo '=== LISTENING SOCKETS ==='
          ss -lntp 2>&1 | redact || true
          echo '=== OPEND (read-only) ==='
          for pid in $(pgrep -x opend 2>/dev/null || true); do
            ps -p "$pid" -o pid=,user=,lstart=,args= 2>/dev/null | redact || true
          done
          ss -lntp 2>/dev/null | grep -E ':(11111|22222)\b' | redact || true
          echo '=== IDENTIFIED CHECKOUTS ==='
          for candidate in $candidates; do
            [ -d "$candidate" ] || continue
            top="$(git -C "$candidate" rev-parse --show-toplevel 2>/dev/null || true)"
            [ -n "$top" ] || continue
            head="$(git -C "$top" rev-parse HEAD 2>/dev/null || true)"
            echo "CHECKOUT=$top"
            echo "DEPLOYED_COMMIT=${head:-UNKNOWN}"
            if [ "$head" = "$expected" ]; then echo 'EXPECTED_d7622c6_MATCH=PASS'; else echo 'EXPECTED_d7622c6_MATCH=FAIL_OR_UNKNOWN'; fi
            if [ -n "$(git -C "$top" status --porcelain 2>/dev/null || true)" ]; then echo 'CHECKOUT_DIRTY=YES'; else echo 'CHECKOUT_DIRTY=NO'; fi
          done
          echo '=== BOUNDED IDENTIFIED PATH STATS ==='
          for candidate in $candidates; do
            [ -e "$candidate" ] && stat -c 'PATH=%n TYPE=%F MODE=%a OWNER=%U SIZE=%s MTIME=%y' "$candidate" 2>/dev/null || true
          done
          echo '=== LOCAL HTTP PROBE ==='
          echo 'SKIPPED_UNLESS_HTTP_ENDPOINT_IS_EXPLICITLY_EVIDENT_IN_UNIT_OR_LISTENER_OUTPUT'
          REMOTE
              jq -c -n --arg script "$diagnostic_script" '[ $script ]' > commands.json
              ;;
            mcp_protocol_probe)
              read -r -d '' protocol_script <<'REMOTE' || true
          set -u
          pid=8607
          cwd="$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"
          source="$cwd/realtime_monitor/readonly_mcp_server.py"
          echo "MCP_PROCESS_PID=$pid"
          echo "MCP_PROCESS_CWD=$cwd"
          echo "MCP_PROCESS_EXE=$(readlink -f /proc/$pid/exe 2>/dev/null || true)"
          echo "MCP_PROCESS_CMDLINE=$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null || true)"
          echo "MCP_PROCESS_USER=$(ps -p "$pid" -o user= 2>/dev/null | awk '{print $1}')"
          echo "MCP_PROCESS_START=$(ps -p "$pid" -o lstart= 2>/dev/null || true)"
          socket_line="$(ss -lntp 2>/dev/null | grep "pid=$pid," | head -n 1 || true)"
          echo "MCP_LISTENER=$socket_line"
          echo '=== DIRECT SOURCE ENDPOINT EVIDENCE ==='
          if [ ! -r "$source" ]; then echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=source-not-readable'; exit 0; fi
          grep -nE 'streamable-http|/mcp|127\.0\.0\.1|8000|mcp.run' "$source" 2>/dev/null || true
          if ! grep -q '/mcp' "$source" || ! printf '%s' "$socket_line" | grep -q '127.0.0.1:8000'; then echo 'MCP_PROTOCOL_ENDPOINT=UNKNOWN'; echo 'MCP_PROBE_REASON=endpoint-not-directly-evidenced'; exit 0; fi
          echo 'MCP_PROTOCOL_ENDPOINT=http://127.0.0.1:8000/mcp'
          python3 - "$source" <<'PY'
          import datetime as dt,http.client,json,sys
          source=sys.argv[1]; allowed={'get_market_snapshots','get_market_bars','get_livefeed_health'}
          def send(body,sid=None):
              c=http.client.HTTPConnection('127.0.0.1',8000,15); h={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}
              if sid:h['Mcp-Session-Id']=sid
              c.request('POST','/mcp',json.dumps(body),h); r=c.getresponse(); raw=r.read().decode('utf-8','replace'); sid=r.getheader('Mcp-Session-Id') or sid
              if 'text/event-stream' in (r.getheader('Content-Type') or ''): raw=''.join(x[5:].strip() for x in raw.splitlines() if x.startswith('data:'))
              try:o=json.loads(raw)
              except:o={'http_status':r.status,'body_prefix':raw[:500]}
              return r.status,o,sid
          def ok(st,o):return st==200 and isinstance(o,dict) and 'error' not in o and 'result' in o
          def args(t,sym=None):
              sch=t.get('inputSchema',{}); p=sch.get('properties',{}) or {}; out={}
              for k in sch.get('required',[]) or []:
                  n=k.lower(); q=p.get(k,{})
                  if n in ('symbol','ticker','symbol_name','code','stock_code'):out[k]=sym
                  elif n in ('symbols','tickers','codes','stock_codes'):out[k]=[sym]
                  elif n in ('interval','timeframe','frequency','period'):out[k]='1m'
                  elif n in ('limit','count','n','num_bars','bar_count'):out[k]=10
                  elif n in ('start','start_time','from','begin','begin_time'):out[k]=(dt.datetime.now(dt.timezone.utc)-dt.timedelta(days=1)).isoformat()
                  elif n in ('end','end_time','to','until'):out[k]=dt.datetime.now(dt.timezone.utc).isoformat()
                  elif 'enum' in q:out[k]=q['enum'][0]
                  elif q.get('type')=='boolean':out[k]=False
                  else:raise RuntimeError('unsupported-required-arg:'+k)
              return out
          st,o,sid=send({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'ect-readonly-probe','version':'1'}}})
          print('MCP_INITIALIZE='+('PASS' if ok(st,o) else 'FAIL'))
          if not ok(st,o):print('MCP_INITIALIZE_DETAIL='+json.dumps(o)[:500]);raise SystemExit
          send({'jsonrpc':'2.0','method':'notifications/initialized'},sid); st,o,sid=send({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}},sid)
          tools=(o.get('result') or {}).get('tools',[]) if isinstance(o,dict) else []; names=[t.get('name') for t in tools]; by={t.get('name'):t for t in tools}
          print('DISCOVERED_TOOLS='+json.dumps(names,separators=(',',':'))); print('PRIVATE_MCP_TOOL_DISCOVERY_3_OF_3='+('PASS' if len(names)==3 and set(names)==allowed else 'FAIL'))
          for t in tools:print('TOOL_SCHEMA_'+str(t.get('name'))+'='+json.dumps(t.get('inputSchema',{}),separators=(',',':')))
          def call(n,a):
              st,z,_=send({'jsonrpc':'2.0','id':100+len(n),'method':'tools/call','params':{'name':n,'arguments':a}},sid); good=ok(st,z) and not (z.get('result') or {}).get('isError',False); print('MCP_CALL_'+n+('=PASS' if good else '=FAIL')); print('MCP_RESULT_'+n+'='+json.dumps(z.get('result',z),separators=(',',':'))[:3000])
          if len(names)==3 and set(names)==allowed:
              call('get_livefeed_health',args(by['get_livefeed_health']))
              for s in ('AMD','QQQ'):call('get_market_snapshots',args(by['get_market_snapshots'],s))
              for s in ('AMD','QQQ'):call('get_market_bars',args(by['get_market_bars'],s))
          print('DIRECT_OPEND_OVERLAP_MATCH=NOT_RUN'); print('CURRENTNESS_METADATA=UNKNOWN'); print('ENTITLEMENT=UNKNOWN'); print('GENERATION=UNKNOWN'); print('AMD_1M_CURRENT=UNKNOWN'); print('QQQ_1M_CURRENT=UNKNOWN'); print('BAR_ADVANCEMENT=UNKNOWN'); print('STALE_TAIL_REGRESSION=UNKNOWN'); print('MCP_PUBLIC_EXPOSURE=NO'); print('AWS_PRIVATE_MCP_RUNTIME=PASS')
          print('DEPLOYED_COMMIT='+('d7622c6a0c549282d6da5be0cb32aa6701fb8f59' if source.endswith('d7622c6a0c549282d6da5be0cb32aa6701fb8f59/realtime_monitor/readonly_mcp_server.py') else 'UNKNOWN')); print('EXPECTED_d7622c6_MATCH='+('PASS' if source.endswith('d7622c6a0c549282d6da5be0cb32aa6701fb8f59/realtime_monitor/readonly_mcp_server.py') else 'UNKNOWN')); print('CHECKOUT_DIRTY=UNKNOWN')
          PY
          REMOTE
              jq -c -n --arg script "$protocol_script" '[ $script ]' > commands.json
              ;;
            *)
              echo "Unsupported action" >&2
              exit 2
              ;;
          esac
          echo "commands=$(<commands.json)" >> "$GITHUB_OUTPUT"

      - name: Send fixed command through SSM
        id: send-command
        shell: bash
        env:
          COMMANDS: ${{ steps.command-set.outputs.commands }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted to $TARGET_INSTANCE_ID"

      - name: Wait for SSM result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command" >&2
          exit 1
