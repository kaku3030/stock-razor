              ;;
            *)
              echo "Unsupported action" >&2
              exit 2
              ;;
          esac
          echo "commands=$(<commands.json)" >> "$GITHUB_OUTPUT"

      - name: Send fixed command through SSM
        id: send-command
        shell: bash
        env:
          COMMANDS: ${{ steps.command-set.outputs.commands }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted to $TARGET_INSTANCE_ID"

      - name: Wait for SSM result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command" >&2
          exit 1
