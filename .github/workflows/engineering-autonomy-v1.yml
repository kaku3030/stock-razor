name: Engineering Autonomy V1

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: engineering-autonomy-v1
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  bounded-run:
    name: bounded-run
    runs-on: ubuntu-latest
    if: vars.ENGINEERING_AUTONOMY_ENABLED == 'true'
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate task allowlist
        run: python scripts/engineering_autonomy.py validate-manifest

      - name: Require App token configuration
        env:
          AUTONOMY_APP_TOKEN: ${{ secrets.ENGINEERING_AUTONOMY_APP_TOKEN }}
        run: |
          test -n "$AUTONOMY_APP_TOKEN" || {
            echo 'BLOCKED: ENGINEERING_AUTONOMY_APP_TOKEN is not configured.' >&2
            exit 1
          }

      - name: Create isolated run branch
        env:
          RUN_ID: ${{ github.run_id }}
          BASE_SHA: ${{ github.sha }}
        run: |
          git switch --create "autonomy/run-${RUN_ID}"
          python scripts/engineering_autonomy.py record-run \
            --run-id "$RUN_ID" \
            --base-sha "$BASE_SHA"

      - name: Commit sanitized record
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'stock-razor-engineering-autonomy'
          git config user.email '322462903+kaku3030@users.noreply.github.com'
          git add docs/engineering-autonomy/runs
          git diff --cached --check
          git commit -m "chore: record engineering autonomy run ${RUN_ID}"

      - name: Push and open PR with App token
        env:
          GH_TOKEN: ${{ secrets.ENGINEERING_AUTONOMY_APP_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh auth setup-git
          git push --set-upstream origin "autonomy/run-${RUN_ID}"
          gh pr create \
            --base main \
            --head "autonomy/run-${RUN_ID}" \
            --title "chore: record engineering autonomy run ${RUN_ID}" \
            --body "Automated bounded audit-only run. Required checks and exact-head rules remain authoritative."

      - name: Enable guarded auto-merge
        env:
          GH_TOKEN: ${{ secrets.ENGINEERING_AUTONOMY_APP_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PR_NUMBER=$(gh pr list --head "autonomy/run-${RUN_ID}" --json number --jq '.[0].number')
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
