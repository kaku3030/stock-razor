name: Research Radar Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/repositories/candidate_pool_repo.py"
      - "src/repositories/oos_consumption_ledger_repo.py"
      - "src/repositories/financial_change_repo.py"
      - "src/repositories/research_event_repo.py"
      - "src/repositories/research_priority_repo.py"
      - "src/repositories/stock_radar_technical_state_repo.py"
      - "data_provider/alpaca_market_data_adapter.py"
      - "src/schemas/research_financials.py"
      - "src/services/a_share_provider_lineage.py"
      - "src/services/a_share_reconciliation_lineage.py"
      - "src/services/a_share_intraday_semantics.py"
      - "src/services/data_capability_service.py"
      - "src/services/screening/industry_radar.py"
      - "src/services/screening/earnings_valuation_radar.py"
      - "src/services/screening/financial_change.py"
      - "src/services/screening/financial_change_radar.py"
      - "src/services/screening/news_change.py"
      - "src/services/screening/research_priority.py"
      - "src/services/screening/research_priority_transition.py"
      - "src/services/screening/research_priority_notifications.py"
      - "src/services/stock_radar_v2/**"
      - "src/services/strategy_lab/**"
      - "scripts/run_us_research_scan.py"
      - "scripts/run_stock_radar_qa.py"
      - "scripts/run_stock_radar_technical_state.py"
      - "tests/test_a_share_provider_lineage.py"
      - "tests/test_a_share_reconciliation_lineage.py"
      - "tests/test_a_share_intraday_semantics.py"
      - "tests/test_data_capability_service.py"
      - "tests/test_candidate_pool_repo.py"
      - "tests/test_oos_consumption_ledger_repo.py"
      - "tests/test_alpaca_market_data_adapter.py"
      - "tests/test_candidate_pool_industry_metrics.py"
      - "tests/test_candidate_pool_financials.py"
      - "tests/test_industry_radar.py"
      - "tests/test_earnings_valuation_radar.py"
      - "tests/test_financial_change.py"
      - "tests/test_financial_change_repo.py"
      - "tests/test_research_news_change.py"
      - "tests/test_research_priority.py"
      - "tests/test_research_priority_repo.py"
      - "tests/test_research_priority_transition.py"
      - "tests/test_research_priority_notifications.py"
      - "tests/test_stock_radar_v2_*.py"
      - "tests/test_strategy_lab_*.py"
      - ".github/workflows/research-radar-tests.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run focused research radar tests
        run: |
          python -m pytest -q \
            tests/test_a_share_provider_lineage.py \
            tests/test_a_share_reconciliation_lineage.py \
            tests/test_a_share_intraday_semantics.py \
            tests/test_data_capability_service.py \
            tests/test_alpaca_market_data_adapter.py \
            tests/test_candidate_pool_repo.py \
            tests/test_candidate_pool_industry_metrics.py \
            tests/test_candidate_pool_financials.py \
            tests/test_industry_radar.py \
            tests/test_earnings_valuation_radar.py \
            tests/test_financial_change.py \
            tests/test_financial_change_repo.py \
            tests/test_research_news_change.py \
            tests/test_research_priority.py \
            tests/test_research_priority_repo.py \
            tests/test_research_priority_transition.py \
            tests/test_research_priority_notifications.py \
            tests/test_stock_radar_v2_config.py \
            tests/test_stock_radar_v2_health.py \
            tests/test_stock_radar_v2_router.py \
            tests/test_stock_radar_v2_confidence.py \
            tests/test_stock_radar_v2_notifications.py \
            tests/test_stock_radar_v2_runtime_notifications.py \
            tests/test_stock_radar_v2_provider_runtime.py \
            tests/test_stock_radar_v2_technical_state.py \
            tests/test_stock_radar_v2_technical_state_history.py \
            tests/test_stock_radar_v2_technical_state_radar.py \
            tests/test_stock_radar_v2_validation.py \
            tests/test_strategy_lab_hard_gates.py \
            tests/test_strategy_lab_adversarial.py \
            tests/test_strategy_lab_parameter_stability.py \
            tests/test_strategy_lab_edge_concentration.py \
            tests/test_strategy_lab_execution_stress.py \
            tests/test_strategy_lab_validation_gate.py \
            tests/test_strategy_lab_experiment_governance.py \
            tests/test_strategy_lab_information_dependency.py \
            tests/test_strategy_lab_temporal_contract.py \
            tests/test_strategy_lab_universe_integrity.py \
            tests/test_strategy_lab_walk_forward.py \
            tests/test_strategy_lab_oos_consumption.py \
            tests/test_oos_consumption_ledger_repo.py \
            tests/test_strategy_lab_parameter_drift.py \
            tests/test_strategy_lab_replay_a2.py \
            tests/test_strategy_lab_replay_integrity_a2.py \
            tests/test_strategy_lab_recorded_fixtures_a3.py \
            tests/test_strategy_lab_recorded_fixtures_a3_provenance.py \
            tests/test_strategy_lab_raw_capture_a4.py \
            tests/test_strategy_lab_raw_capture_integrity_a4.py \
            tests/test_strategy_lab_provider_recorded_fixture_a4b.py \
            tests/test_run_stock_radar_qa.py \
            tests/test_run_stock_radar_technical_state.py

      - name: Import smoke test for US research scan
        run: python -c "import scripts.run_us_research_scan; import scripts.run_stock_radar_qa; import scripts.run_stock_radar_technical_state; print('research runtime imports ok')"
