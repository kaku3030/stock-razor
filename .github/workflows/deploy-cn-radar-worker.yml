name: Deploy Read-Only CN Radar Worker
on:
  workflow_dispatch:
    inputs:
      approve_restart:
        description: "Explicitly permit a controlled restart of the EXISTING read-only CN Radar Worker"
        type: boolean
        required: true
        default: false
      source_provider:
        description: "Existing cache used for research analysis (no provider requests)"
        type: choice
        required: true
        default: eastmoney
        options:
          - eastmoney
          - tickflow
      expected_main_sha:
        description: "Full 40-character GitHub main SHA to deploy (must match this workflow run)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-read-only-cn-radar-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.approve_restart == true && inputs.expected_main_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout immutable workflow source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind deployment to exact current main and verified source hashes
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          # This workflow currently depends on PUBLIC raw.github and EC2 git
          # fetch. Do not start AWS operations after a visibility change.
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "PRIVATE_REPO_CLOUD_SOURCE_TRANSPORT_NOT_MIGRATED" >&2
            exit 3
          fi
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          [[ "$revision" == "${{ github.sha }}" ]]
          [[ "$revision" == "$EXPECTED_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$revision" == "$current_main" ]] || {
            echo 'CN_RADAR_MAIN_MOVED_ABORT' >&2
            exit 2
          }
          test -s ops/aws/install_cn_radar_worker.sh
          test -s ops/aws/verify_cn_radar_worker.sh
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "install_sha=$(sha256sum ops/aws/install_cn_radar_worker.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "verify_sha=$(sha256sum ops/aws/verify_cn_radar_worker.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: cn-radar-guarded-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Check fixed authorized SSM instance
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online

      - name: Deploy SHA-pinned verified files with sanitized SSM results
        id: deploy
        shell: bash
        env:
          SOURCE_PROVIDER: ${{ inputs.source_provider }}
          REPO_REF: ${{ steps.source.outputs.sha }}
          INSTALL_SHA: ${{ steps.source.outputs.install_sha }}
          VERIFY_SHA: ${{ steps.source.outputs.verify_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE_PROVIDER" in eastmoney|tickflow) ;; *) exit 2;; esac
          [[ "$REPO_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INSTALL_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$VERIFY_SHA" =~ ^[a-f0-9]{64}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$REPO_REF" ]] || { echo 'CN_RADAR_PRE_SSM_MAIN_MOVED_ABORT' >&2; exit 2; }
          # Read-only SSM execution probe: distinguish RunShellScript health from the deployment payload.
          probe_command="printf '%s\n' CN_RADAR_SSM_PROBE=PASS"
          probe_params="$(jq -cn --arg c "$probe_command" '{commands:[$c]}')"
          probe_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$probe_params" --timeout-seconds 30 --query 'Command.CommandId' --output text)"
          [[ "$probe_id" =~ ^[a-f0-9-]{36}$ ]]
          probe_status=UNKNOWN
          for _ in $(seq 1 12); do
            probe_status="$(aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$probe_status" in Success|Failed|Cancelled|Cancelling|TimedOut) break ;; esac
            sleep 2
          done
          probe_out="$(aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
          if [[ "$probe_status" != Success ]] || ! grep -Fxq CN_RADAR_SSM_PROBE=PASS <<< "$probe_out"; then
            probe_response_code="$(aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$TARGET_INSTANCE_ID" --query ResponseCode --output text 2>/dev/null || true)"
            [[ "$probe_response_code" =~ ^-?[0-9]+$ ]] || probe_response_code=UNKNOWN
            probe_status_details="$(aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$TARGET_INSTANCE_ID" --query StatusDetails --output text 2>/dev/null || true)"
            case "$probe_status_details" in Failed|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelled|AccessDenied|InvalidPlatform|Success) ;; *) probe_status_details=UNKNOWN ;; esac
            probe_stderr="$(aws ssm get-command-invocation --command-id "$probe_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardErrorContent --output text 2>/dev/null || true)"
            [[ "$probe_stderr" == None ]] && probe_stderr=""
            printf 'CN_RADAR_SSM_PREFLIGHT=NOT_VERIFIED\nCN_RADAR_SSM_PREFLIGHT_STATUS=%s\nCN_RADAR_SSM_PREFLIGHT_DETAILS=%s\nCN_RADAR_SSM_PREFLIGHT_RESPONSE_CODE=%s\nCN_RADAR_SSM_PREFLIGHT_STDOUT_CHARS=%s\nCN_RADAR_SSM_PREFLIGHT_STDERR_CHARS=%s\n' \
              "$probe_status" "$probe_status_details" "$probe_response_code" "${#probe_out}" "${#probe_stderr}" >&2            exit 1
          fi
          echo 'CN_RADAR_SSM_PREFLIGHT=PASS'
          # The two immutable commit-path downloads and their hashes must
          # BOTH verify before any systemd restart occurs.
          read -r -d '' remote <<REMOTE || true
          set -eu
          stage_code=REMOTE_INIT
          trap 'rc=\$?; if [ "\$rc" -ne 0 ]; then printf "CN_RADAR_STAGE=%s\\nCN_RADAR_REMOTE_EXIT_CODE=%s\\n" "\$stage_code" "\$rc" >&2; fi; if [ -n "\${stage:-}" ]; then rm -rf "\$stage"; fi' EXIT
          printf 'CN_RADAR_STAGE=REMOTE_STARTED\\n' >&2
          umask 077
          stage_code=TEMP_DIR
          if ! stage=\$(mktemp -d); then
            echo 'CN_RADAR_STAGE=TEMP_DIR' >&2
            exit 1
          fi
          stage_code=INSTALL_DOWNLOAD
          if ! curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_cn_radar_worker.sh' -o "\$stage/install.sh"; then
            echo 'CN_RADAR_STAGE=INSTALL_DOWNLOAD' >&2; exit 1
          fi
          stage_code=INSTALL_HASH
          if ! printf '%s  %s\n' '$INSTALL_SHA' "\$stage/install.sh" | sha256sum -c - >/dev/null; then
            echo 'CN_RADAR_STAGE=INSTALL_HASH' >&2; exit 1
          fi
          stage_code=VERIFY_DOWNLOAD
          if ! curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_cn_radar_worker.sh' -o "\$stage/verify.sh"; then
            echo 'CN_RADAR_STAGE=VERIFY_DOWNLOAD' >&2; exit 1
          fi
          stage_code=VERIFY_HASH
          if ! printf '%s  %s\n' '$VERIFY_SHA' "\$stage/verify.sh" | sha256sum -c - >/dev/null; then
            echo 'CN_RADAR_STAGE=VERIFY_HASH' >&2; exit 1
          fi
          stage_code=INSTALL
          if ! SOURCE_PROVIDER='$SOURCE_PROVIDER' REPO_REF='$REPO_REF' bash "\$stage/install.sh" > "\$stage/install.log" 2> "\$stage/install.err"; then
            echo 'CN_RADAR_INSTALL=FAILED' >&2
            exit 1
          fi
          # Runtime SHA, research-only flags and service sandbox are verified privately.
          stage_code=ACCEPTANCE
          if ! bash "\$stage/verify.sh" '$REPO_REF' '$SOURCE_PROVIDER' > "\$stage/verify.log" 2> "\$stage/verify.err"; then
            echo 'CN_RADAR_ACCEPTANCE=FAILED' >&2
            exit 1
          fi
          stage_code=VERIFY_OUTPUT
          if ! grep -Fx enabled "\$stage/verify.log" >/dev/null ||
             ! grep -Fx active "\$stage/verify.log" >/dev/null ||
             ! grep -Fx CN_RADAR_WORKER_VERIFY=PASS "\$stage/verify.log" >/dev/null ||
             ! grep -Fx RADAR_ADMISSION=BLOCKED "\$stage/verify.log" >/dev/null ||
             ! grep -Fx LIVE_TRADE=NO "\$stage/verify.log" >/dev/null; then
            echo 'CN_RADAR_STAGE=VERIFY_OUTPUT' >&2; exit 1
          fi
          printf 'CN_RADAR_WORKER_AWS_DEPLOYMENT=PASS\nRADAR_ADMISSION=BLOCKED\nLIVE_TRADE=NO\n'
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 16000 || {
            echo 'CN_RADAR_DEPLOY_SSM_PAYLOAD_TOO_LARGE' >&2
            exit 2
          }
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$params" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)"
          [[ "$command_id" =~ ^[a-f0-9-]{36}$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Verify bounded SSM evidence without printing raw cloud logs
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          status=UNKNOWN
          for _ in $(seq 1 110); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|Cancelling|TimedOut) break ;;
            esac
            sleep 5
          done
          if [[ "$status" != Success ]]; then
            # SSM output can lag terminal status briefly. Retry bounded reads
            # from both streams; print only fixed allowlisted markers.
            stderr=""
            stdout=""
            for _ in $(seq 1 5); do
              stderr="$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$TARGET_INSTANCE_ID" \
                --query 'StandardErrorContent' --output text 2>/dev/null || true)"
              stdout="$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$TARGET_INSTANCE_ID" \
                --query 'StandardOutputContent' --output text 2>/dev/null || true)"
              [[ "$stderr" == None ]] && stderr=""
              [[ "$stdout" == None ]] && stdout=""
              [[ -n "$stderr" || -n "$stdout" ]] && break
              sleep 2
            done
            evidence="${stderr} ${stdout}"
            response_code="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query ResponseCode --output text 2>/dev/null || true)"
            [[ "$response_code" =~ ^-?[0-9]+$ ]] || response_code=UNKNOWN
            failure_class=REMOTE_COMMAND
            for candidate in REMOTE_STARTED REMOTE_INIT TEMP_DIR INSTALL_DOWNLOAD INSTALL_HASH VERIFY_DOWNLOAD VERIFY_HASH INSTALL ACCEPTANCE VERIFY_OUTPUT; do
              if grep -Fxq "CN_RADAR_STAGE=$candidate" <<< "$evidence"; then
                failure_class="$candidate"
                break
              fi
            done
            if [[ "$failure_class" == REMOTE_COMMAND ]]; then
              if [[ -z "$stderr" && -z "$stdout" ]]; then
                failure_class=REMOTE_NO_OUTPUT
              elif grep -Eiq "syntax error|unexpected EOF" <<< "$evidence"; then
                failure_class=REMOTE_SYNTAX
              elif grep -Eiq "command not found|not found|No such file" <<< "$evidence"; then
                failure_class=REMOTE_MISSING_COMMAND
              elif grep -Eiq "Permission denied" <<< "$evidence"; then
                failure_class=REMOTE_PERMISSION
              else
                failure_class=REMOTE_UNCLASSIFIED_OUTPUT
              fi
            fi
            if grep -Fxq 'CN_RADAR_INSTALL=FAILED' <<< "$evidence"; then
              failure_class=INSTALL
            elif grep -Fxq 'CN_RADAR_ACCEPTANCE=FAILED' <<< "$evidence"; then
              failure_class=ACCEPTANCE
            fi
            printf 'CN_RADAR_WORKER_AWS_DEPLOYMENT=NOT_VERIFIED\nCN_RADAR_SSM_STATUS=%s\nCN_RADAR_SSM_RESPONSE_CODE=%s\nCN_RADAR_FAILURE_CLASS=%s\n' \
              "$status" "$response_code" "$failure_class" >&2
            printf 'CN_RADAR_SSM_STDOUT_CHARS=%s\nCN_RADAR_SSM_STDERR_CHARS=%s\n' "${#stdout}" "${#stderr}" >&2
            exit 1
          fi
          out="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text)"
          grep -Fx CN_RADAR_WORKER_AWS_DEPLOYMENT=PASS <<< "$out" >/dev/null
          grep -Fx RADAR_ADMISSION=BLOCKED <<< "$out" >/dev/null
          grep -Fx LIVE_TRADE=NO <<< "$out" >/dev/null
          echo 'CN_RADAR_WORKER_AWS_DEPLOYMENT=PASS'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
