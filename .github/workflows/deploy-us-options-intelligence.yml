name: Deploy US Options Intelligence Collector

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-us-options-intelligence
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash -n ops/aws/install_us_options_intelligence.sh
          bash -n ops/aws/verify_us_options_intelligence.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-options-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy exact collector SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: "${{ steps.source.outputs.sha }}"
        run: |
          set -euo pipefail
          remote="curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_us_options_intelligence.sh -o /tmp/install_us_options_intelligence.sh && chmod 0755 /tmp/install_us_options_intelligence.sh && REPO_REF=$REPO_REF /tmp/install_us_options_intelligence.sh && curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_us_options_intelligence.sh -o /tmp/verify_us_options_intelligence.sh && chmod 0755 /tmp/verify_us_options_intelligence.sh && REQUIRE_SNAPSHOT=true /tmp/verify_us_options_intelligence.sh $REPO_REF"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"

      - name: Verify collector evidence
        shell: bash
        env:
          COMMAND_ID: "${{ steps.deploy.outputs.command_id }}"
          COLLECTOR_SHA: "${{ steps.source.outputs.sha }}"
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          printf '%s\n' "$inv"
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<<"$inv")"
          grep -q '^enabled$' <<<"$out"
          grep -q '^active$' <<<"$out"
          grep -q '"type":"us_options_intelligence_heartbeat"' <<<"$out"
          grep -q "\"repo_sha\":\"$COLLECTOR_SHA\"" <<<"$out"
          grep -q '"opend_host":"127.0.0.1"' <<<"$out"
          grep -q '"snapshot_written":true' <<<"$out"
          grep -q '"research_only":true' <<<"$out"
          grep -q '"trading_authority":false' <<<"$out"
          grep -q '"live_trade":false' <<<"$out"
          grep -q '^US_OPTIONS_INTELLIGENCE_VERIFY=PASS$' <<<"$out"
          grep -q '^RADAR_ADMISSION=CONTEXT_ONLY$' <<<"$out"
          grep -q '^LIVE_TRADE=NO$' <<<"$out"
          echo "US_OPTIONS_INTELLIGENCE_AWS_DEPLOYMENT=PASS"
