name: Engineering Autonomy Coding V1.1 (test-only pilot)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'I authorize one test-only DeepSeek+Aider run (never a schedule)'
        required: true
        type: boolean
        default: false

concurrency:
  group: engineering-autonomy-coding-v1-1
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.queue.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted one-shot task
        run: python -m engineering_autonomy.coding_gate prompt --output /tmp/autonomy-prompt.txt
      - name: Skip if any existing PR already claims this ID
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Single reviewed smoke task; never generate an endless PR stream.
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json body \
               --jq 'any(.[]; (.body // "") | contains("AUTO_TASK_ID=autonomy-test-hardening"))')" = 'true' ]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: preflight
    if: needs.preflight.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create trusted prompt and require DeepSeek secret
        env:
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$API_KEY" ]; then
            echo 'BLOCKED: DEEPSEEK_API_KEY missing' >&2
            exit 1
          fi
          python -m engineering_autonomy.coding_gate prompt --output /tmp/autonomy-prompt.txt
      - name: Enforce official DeepSeek balance budget before any paid completion
        id: budget
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m engineering_autonomy.deepseek_budget check \
            --status-file "$RUNNER_TEMP/deepseek-budget-status.json"
      - name: Install pinned Aider coding CLI
        run: python -m pip install --disable-pip-version-check --no-cache-dir aider-chat==0.86.2
      - name: Run isolated DeepSeek coding agent (bounded, non-streaming)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_HARD_COST_GUARANTEE: ${{ vars.DEEPSEEK_HARD_COST_GUARANTEE }}
          LITELLM_MAX_RETRIES: '0'
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          # The wrapper blocks unless a provider-side CNY 5 cap is explicitly verified,
          # and kills the child on 240s, 2 requests, 20k input or 4k output.
          python -m engineering_autonomy.deepseek_budget run \
            --analytics-log "$RUNNER_TEMP/autonomy-aider-usage.jsonl" -- \
            aider \
            --file tests/test_engineering_autonomy.py \
            --read .gitignore \
            --no-gitignore \
            --input-history-file "$RUNNER_TEMP/autonomy-aider-input.history" \
            --chat-history-file "$RUNNER_TEMP/autonomy-aider-chat.history.md" \
            --map-tokens 0 \
            --no-analytics \
            --analytics-log "$RUNNER_TEMP/autonomy-aider-usage.jsonl" \
            --no-cache-prompts \
            --no-stream \
            --timeout 90 \
            --model deepseek/deepseek-flash \
            --model-metadata-file docs/engineering-autonomy/deepseek-flash-model-metadata.json \
            --edit-format diff \
            --message-file /tmp/autonomy-prompt.txt \
            --yes-always \
            --no-auto-commits \
            --no-check-update
      - name: Summarize Aider token usage without publishing raw analytics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m engineering_autonomy.deepseek_budget usage \
            --analytics-log "$RUNNER_TEMP/autonomy-aider-usage.jsonl" \
            --output "$RUNNER_TEMP/autonomy-deepseek-usage.json"
      - name: Retain sanitized token counters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-deepseek-usage
          path: ${{ runner.temp }}/autonomy-deepseek-usage.json
          retention-days: 30
          if-no-files-found: warn
      - name: Recheck official DeepSeek budget after attempted coding
        if: always() && steps.budget.outcome == 'success'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m engineering_autonomy.deepseek_budget check \
            --monitor --status-file "$RUNNER_TEMP/deepseek-budget-after.json"
      - name: Diagnose changed worktree paths only (no file contents)
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          entries = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          ).split(b"\x00")
          entries = [entry for entry in entries if entry]
          print(f"WORKTREE_CHANGED_PATH_COUNT={len(entries)}")
          for entry in entries[:30]:
              # Git filenames only; never emit patch bodies, history, or secrets.
              print("WORKTREE_PATH_STATUS", repr(entry[:220]))
          if len(entries) > 30:
              print("WORKTREE_STATUS_TRUNCATED")
          PY
      - name: Capture allowlisted test-only patch
        run: python -m engineering_autonomy.coding_gate capture --output /tmp/autonomy.patch
      - uses: actions/upload-artifact@v4
        with:
          name: untrusted-autonomy-patch
          path: /tmp/autonomy.patch
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: untrusted-autonomy-patch
          path: /tmp/autonomy-artifact
      - name: Validate and apply patch, without secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m engineering_autonomy.coding_gate check-patch --output /tmp/autonomy-artifact/autonomy.patch
          git apply --check /tmp/autonomy-artifact/autonomy.patch
          git apply /tmp/autonomy-artifact/autonomy.patch
          python -m engineering_autonomy.coding_gate capture --output /tmp/verified.patch
      - name: Install isolated test dependency
        run: python -m pip install pytest==8.4.2
      - name: Execute focused tests, without secrets
        run: python -m pytest --noconftest -q tests/test_engineering_autonomy.py tests/test_engineering_coding_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-autonomy-patch
          path: /tmp/verified.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-autonomy-patch
          path: /tmp/autonomy-artifact
      - name: Apply verified patch without executing its code
        run: |
          set -euo pipefail
          python -m engineering_autonomy.coding_gate check-patch --output /tmp/autonomy-artifact/verified.patch
          git apply --check /tmp/autonomy-artifact/verified.patch
          git apply --index /tmp/autonomy-artifact/verified.patch
          git diff --cached --check
      - name: Mint short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENGINEERING_AUTONOMY_APP_ID }}
          private-key: ${{ secrets.ENGINEERING_AUTONOMY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: stock-razor
          permission-contents: write
          permission-pull-requests: write
      - name: Require short-lived publication credential
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo 'BLOCKED: App installation token not configured' >&2; exit 1; }
      - name: Publish PR only, never merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="autonomy/test-hardening-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name 'stock-razor-engineering-autonomy'
          git config user.email '322462903+kaku3030@users.noreply.github.com'
          git commit -m 'test: autonomously harden audit record regression tests'
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title 'test: Autonomy V1.1 bounded coding pilot' \
            --body 'AUTO_TASK_ID=autonomy-test-hardening — Test-only bounded Coding Agent pilot. Secretless verification passed. No auto-merge, deployment, Radar, Paper or trading changes. Independent CI and review required.'
