name: Deploy Read-Only US Radar Worker
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-read-only-us-radar-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}

      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-radar-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover canonical source SHA
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          remote="python3 -c 'import json; p=json.load(open(\"/run/stock-razor-us-livefeed/latest-heartbeat.json\",encoding=\"utf-8\")); s=str(p.get(\"repo_sha\") or \"\").strip().lower(); assert len(s)==40 and all(c in \"0123456789abcdef\" for c in s), \"INVALID_SOURCE_REPO_SHA\"; print(s)'"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          status=""
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          inv="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          test "$status" = Success
          source_sha="$(jq -r '.StandardOutputContent // ""' <<<"$inv" | tr -d '\r' | tail -n 1)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_SOURCE_SHA=$source_sha"

      - name: Deploy exact worker SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: "${{ steps.source.outputs.sha }}"
          SOURCE_REPO_SHA: "${{ steps.canonical.outputs.sha }}"
        run: |
          set -euo pipefail
          remote="curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_us_radar_worker.sh -o /tmp/install_us_radar_worker.sh && chmod 0755 /tmp/install_us_radar_worker.sh && REPO_REF=$REPO_REF SOURCE_REPO_SHA=$SOURCE_REPO_SHA /tmp/install_us_radar_worker.sh && curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_us_radar_worker.sh -o /tmp/verify_us_radar_worker.sh && chmod 0755 /tmp/verify_us_radar_worker.sh && /tmp/verify_us_radar_worker.sh $REPO_REF $SOURCE_REPO_SHA"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"

      - name: Verify worker evidence
        shell: bash
        env:
          COMMAND_ID: "${{ steps.deploy.outputs.command_id }}"
          WORKER_SHA: "${{ steps.source.outputs.sha }}"
          SOURCE_SHA: "${{ steps.canonical.outputs.sha }}"
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          printf '%s\n' "$inv"
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<<"$inv")"
          grep -q '^enabled$' <<<"$out"
          grep -q '^active$' <<<"$out"
          grep -q '"type":"us_radar_research_heartbeat"' <<<"$out"
          grep -q "\"worker_repo_sha\":\"$WORKER_SHA\"" <<<"$out"
          grep -q "\"expected_source_repo_sha\":\"$SOURCE_SHA\"" <<<"$out"
          grep -q '"research_only":true' <<<"$out"
          grep -q '"can_confirm_signal":false' <<<"$out"
          grep -q '"radar_admission":"BLOCKED"' <<<"$out"
          grep -q '"live_trade":false' <<<"$out"
          grep -q '^US_RADAR_WORKER_VERIFY=PASS$' <<<"$out"
          grep -q '^RADAR_ADMISSION=BLOCKED$' <<<"$out"
          grep -q '^LIVE_TRADE=NO$' <<<"$out"
          echo "US_RADAR_WORKER_AWS_DEPLOYMENT=PASS"
