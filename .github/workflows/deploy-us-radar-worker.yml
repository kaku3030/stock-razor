name: Deploy Read-Only US Radar Worker
on:
  workflow_dispatch:
    inputs:
      approve_restart:
        description: "Explicit consent: restart the existing read-only US Radar Worker"
        type: boolean
        required: true
        default: false
      closed_bar_events_enabled:
        description: "Opt in to persistent research event collection only (no model invocation)"
        type: boolean
        required: false
        default: false
      expected_main_sha:
        description: "Exact full GitHub main SHA; must equal this workflow run commit"
        type: string
        required: true
      expected_source_sha:
        description: "Optional exact existing LiveFeed SHA for worker-only deployment; defaults to main"
        type: string
        required: false
        default: ""
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-read-only-us-radar-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_restart == true && inputs.expected_main_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo 'PRIVATE_REPO_CLOUD_SOURCE_TRANSPORT_NOT_MIGRATED' >&2
            exit 3
          fi
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          [[ "$revision" == "${{ github.sha }}" && "$revision" == "$EXPECTED_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$revision" == "$current_main" ]] || { echo 'US_RADAR_MAIN_MOVED_ABORT' >&2; exit 2; }
          test -s ops/aws/install_us_radar_worker.sh
          test -s ops/aws/verify_us_radar_worker.sh
          source_revision="${REQUESTED_SOURCE_SHA:-$revision}"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]] || { echo 'INVALID_SOURCE_REPO_SHA' >&2; exit 2; }
          echo "expected_source_sha=$source_revision" >> "$GITHUB_OUTPUT"
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "install_sha=$(sha256sum ops/aws/install_us_radar_worker.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "verify_sha=$(sha256sum ops/aws/verify_us_radar_worker.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-radar-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover canonical source SHA
        id: canonical
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: "${{ steps.source.outputs.expected_source_sha }}"
        run: |
          set -euo pipefail
          remote="$(cat <<'REMOTE'
          expected="${EXPECTED_SOURCE_SHA:?EXPECTED_SOURCE_SHA is required}"
          for _ in $(seq 1 30); do
            if [ -s /run/stock-razor-us-livefeed/latest-heartbeat.json ]; then
              if observed="$(python3 -c 'import json; p=json.load(open("/run/stock-razor-us-livefeed/latest-heartbeat.json",encoding="utf-8")); s=str(p.get("repo_sha") or "").strip().lower(); assert len(s)==40 and all(c in "0123456789abcdef" for c in s), "INVALID_SOURCE_REPO_SHA"; print(s)')"; then
                if [ "$observed" = "$expected" ]; then
                  printf '%s\n' "$observed"
                  exit 0
                fi
                echo "CANONICAL_SOURCE_SHA_MISMATCH observed=$observed expected=$expected" >&2
              fi
            fi
            sleep 2
          done
          echo "CANONICAL_SOURCE_HEARTBEAT_TIMEOUT expected=$expected" >&2
          exit 1
          REMOTE
          )"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "export EXPECTED_SOURCE_SHA='$EXPECTED_SOURCE_SHA'; printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          status=""
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          inv="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          # Keep raw SSM response strictly inside the job process (not Actions logs).
          test "$status" = Success
          source_sha="$(jq -r '.StandardOutputContent // ""' <<<"$inv" | tr -d '\r' | awk '/^[0-9a-f]{40}$/ {sha=$0} END {print sha}')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "INVALID_SOURCE_REPO_SHA" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_SOURCE_SHA=$source_sha"

      - name: Deploy exact worker SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: "${{ steps.source.outputs.sha }}"
          SOURCE_REPO_SHA: "${{ steps.canonical.outputs.sha }}"
          CLOSED_BAR_EVENTS_ENABLED: "${{ inputs.closed_bar_events_enabled && 'true' || 'false' }}"
          INSTALL_SHA: "${{ steps.source.outputs.install_sha }}"
          VERIFY_SHA: "${{ steps.source.outputs.verify_sha }}"
        run: |
          set -euo pipefail
          case "$CLOSED_BAR_EVENTS_ENABLED" in true|false) ;; *) exit 2;; esac
          [[ "$REPO_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INSTALL_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$VERIFY_SHA" =~ ^[a-f0-9]{64}$ ]]
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_us_radar_worker.sh' -o "\$stage/install.sh"
          printf '%s  %s\n' '$INSTALL_SHA' "\$stage/install.sh" | sha256sum -c - >/dev/null
          curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_us_radar_worker.sh' -o "\$stage/verify.sh"
          printf '%s  %s\n' '$VERIFY_SHA' "\$stage/verify.sh" | sha256sum -c - >/dev/null
          if ! CLOSED_BAR_EVENTS_ENABLED='$CLOSED_BAR_EVENTS_ENABLED' REPO_REF='$REPO_REF' SOURCE_REPO_SHA='$SOURCE_REPO_SHA' bash "\$stage/install.sh" > "\$stage/install.log" 2> "\$stage/install.err"; then
            echo 'US_RADAR_INSTALL=FAILED' >&2
            exit 1
          fi
          if ! bash "\$stage/verify.sh" '$REPO_REF' '$SOURCE_REPO_SHA' '$CLOSED_BAR_EVENTS_ENABLED' > "\$stage/verify.log" 2> "\$stage/verify.err"; then
            echo 'US_RADAR_ACCEPTANCE=FAILED' >&2
            exit 1
          fi
          grep -Fx US_RADAR_WORKER_VERIFY=PASS "\$stage/verify.log" >/dev/null
          grep -Fx RADAR_ADMISSION=BLOCKED "\$stage/verify.log" >/dev/null
          grep -Fx LIVE_TRADE=NO "\$stage/verify.log" >/dev/null
          printf 'US_RADAR_WORKER_VERIFY=PASS\nRADAR_ADMISSION=BLOCKED\nLIVE_TRADE=NO\n'
          REMOTE
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"

      - name: Verify worker evidence
        shell: bash
        env:
          COMMAND_ID: "${{ steps.deploy.outputs.command_id }}"
          WORKER_SHA: "${{ steps.source.outputs.sha }}"
          SOURCE_SHA: "${{ steps.canonical.outputs.sha }}"
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          # Keep raw SSM response strictly inside the job process (not Actions logs).
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<<"$inv")"
          # Remote verifier has already checked the heartbeat and systemd
          # sandbox privately; the runner accepts fixed sanitized markers.
          grep -Fx US_RADAR_WORKER_VERIFY=PASS <<< "$out" >/dev/null
          grep -Fx RADAR_ADMISSION=BLOCKED <<< "$out" >/dev/null
          grep -Fx LIVE_TRADE=NO <<< "$out" >/dev/null
                    echo "US_RADAR_WORKER_AWS_DEPLOYMENT=PASS"
