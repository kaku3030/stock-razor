name: Immutable Source Bundle Research (Manual Only)

# Build a GitHub Actions artifact only. NO AWS dispatch, SSM, IAM or deploy.
# Never treat the self-declared digest alone as an authenticated trust root.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-bundle-${{ github.sha }}
  cancel-in-progress: false

jobs:
  produce-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact immutable commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build and validate bounded source bundle offline
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          BUNDLE_PATH: ${{ runner.temp }}/stock-razor-source.tar
          RECEIPT_PATH: ${{ runner.temp }}/stock-razor-source-receipt.json
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo 'SOURCE_COMMIT_MISMATCH' >&2
            exit 2
          }
          # Only Git-tracked commit content is archived. This step neither
          # embeds an access token nor needs an unverified public raw URL.
          # docs/assets contains large documentation-only GIF/PSD imagery,
          # >67 MiB by current Git tree accounting. Exclude ONLY those
          # resources from the cloud-runtime package; all other Git-tracked
          # source remains pinned to the exact commit.
          # CLAUDE.md is a Git symlink (mode 120000), also excluded:
          # the existing private_source_artifact verifier blocks all links.
          git archive --format=tar --output="$BUNDLE_PATH" HEAD ':(exclude)docs/assets' ':(exclude)CLAUDE.md'
          # Ensure the excluded scope cannot drift back into the artifact.
          tar -tf "$BUNDLE_PATH" >"${{ runner.temp }}/source-tree-paths.txt"
          if grep -Eq '(^|/)docs/assets(/|$)|^CLAUDE[.]md
            echo 'SOURCE_BUNDLE_DOC_ASSETS_NOT_EXCLUDED' >&2
            exit 2
          fi
          # The Python verifier has a hard MAX_ARCHIVE_BYTES=64 MiB cap.
          # Check before reading the tar into Python memory.
          test "$(wc -c < "$BUNDLE_PATH")" -le 67108864 || {
            echo 'SOURCE_BUNDLE_EXCEEDS_VERIFIER_LIMIT' >&2
            exit 2
          }
          for required in src/services/private_source_artifact.py realtime_monitor/readonly_mcp_server.py ops/aws/install_readonly_mcp.sh; do
            grep -Fxq "$required" "${{ runner.temp }}/source-tree-paths.txt" || {
              echo 'SOURCE_BUNDLE_RUNTIME_PATH_MISSING' >&2
              exit 2
            }
          done
          python3 - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path
          from src.services.private_source_artifact import verify_private_source_tar

          bundle = Path(os.environ["BUNDLE_PATH"]).read_bytes()
          trusted = sha256(bundle).hexdigest()
          receipt = verify_private_source_tar(bundle, trusted_sha256=trusted)
          output = {
              "schema": "stock_razor_private_source_bundle_v0_1",
              "scope": "TRACKED_SOURCE_EXCLUDING_DOCS_ASSETS",
              "source_commit_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "bundle_sha256": receipt.archive_sha256,
              "regular_file_count": receipt.file_count,
              "total_uncompressed_bytes": receipt.total_uncompressed_bytes,
              "cloud_deployment_performed": False,
              "trading_gates_unchanged": True,
              "authenticated_cloud_receipt": False,
              "private_migration_ready": False,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(output, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SOURCE_BUNDLE_OFFLINE_VERIFIER=PASS")
          print("SOURCE_BUNDLE_CLOUD_DEPLOYMENT=NO")
          print("SOURCE_BUNDLE_PRIVATE_REPO_MIGRATION_READY=NO")
          PY

      - name: Upload immutable bundle and audit metadata (restricted Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stock-razor-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stock-razor-source.tar
            ${{ runner.temp }}/stock-razor-source-receipt.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
 "${{ runner.temp }}/source-tree-paths.txt"; then
            echo 'SOURCE_BUNDLE_DOC_ASSETS_NOT_EXCLUDED' >&2
            exit 2
          fi
          # The Python verifier has a hard MAX_ARCHIVE_BYTES=64 MiB cap.
          # Check before reading the tar into Python memory.
          test "$(wc -c < "$BUNDLE_PATH")" -le 67108864 || {
            echo 'SOURCE_BUNDLE_EXCEEDS_VERIFIER_LIMIT' >&2
            exit 2
          }
          for required in src/services/private_source_artifact.py realtime_monitor/readonly_mcp_server.py ops/aws/install_readonly_mcp.sh; do
            grep -Fxq "$required" "${{ runner.temp }}/source-tree-paths.txt" || {
              echo 'SOURCE_BUNDLE_RUNTIME_PATH_MISSING' >&2
              exit 2
            }
          done
          python3 - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path
          from src.services.private_source_artifact import verify_private_source_tar

          bundle = Path(os.environ["BUNDLE_PATH"]).read_bytes()
          trusted = sha256(bundle).hexdigest()
          receipt = verify_private_source_tar(bundle, trusted_sha256=trusted)
          output = {
              "schema": "stock_razor_private_source_bundle_v0_1",
              "scope": "TRACKED_SOURCE_EXCLUDING_DOCS_ASSETS",
              "source_commit_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "bundle_sha256": receipt.archive_sha256,
              "regular_file_count": receipt.file_count,
              "total_uncompressed_bytes": receipt.total_uncompressed_bytes,
              "cloud_deployment_performed": False,
              "trading_gates_unchanged": True,
              "authenticated_cloud_receipt": False,
              "private_migration_ready": False,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(output, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SOURCE_BUNDLE_OFFLINE_VERIFIER=PASS")
          print("SOURCE_BUNDLE_CLOUD_DEPLOYMENT=NO")
          print("SOURCE_BUNDLE_PRIVATE_REPO_MIGRATION_READY=NO")
          PY

      - name: Upload immutable bundle and audit metadata (restricted Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stock-razor-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stock-razor-source.tar
            ${{ runner.temp }}/stock-razor-source-receipt.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
