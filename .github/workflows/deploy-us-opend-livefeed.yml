name: Deploy Read-Only US OpenD LiveFeed
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-read-only-us-opend-livefeed
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-livefeed-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy exact main SHA over SSM
        id: deploy
        shell: bash
        env: {REPO_REF: "${{ steps.source.outputs.sha }}"}
        run: |
          set -euo pipefail
          remote="curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_us_opend_livefeed.sh -o /tmp/install_us_opend_livefeed.sh && chmod 0755 /tmp/install_us_opend_livefeed.sh && REPO_REF=$REPO_REF /tmp/install_us_opend_livefeed.sh && for i in $(seq 1 12); do hb=$(cat /run/stock-razor-us-livefeed/latest-heartbeat.json 2>/dev/null || true); echo $hb | grep -q \"\\\"repo_sha\\\":\\\"$REPO_REF\\\"\" && echo $hb | grep -Eq \"\\\"event_count\\\":[1-9][0-9]*\" && break; sleep 5; done && systemctl is-enabled stock-razor-us-livefeed.service && systemctl is-active stock-razor-us-livefeed.service && cat /run/stock-razor-us-livefeed/latest-heartbeat.json"
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"
      - name: Verify runtime evidence
        shell: bash
        env: {COMMAND_ID: "${{ steps.deploy.outputs.command_id }}"}
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          inv="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --output json)"
          printf '%s\n' "$inv"
          test "$status" = Success
          out="$(jq -r '.StandardOutputContent // ""' <<<"$inv")"
          grep -q '^enabled$' <<<"$out"
          grep -q '^active$' <<<"$out"
          grep -q '"type":"us_opend_livefeed_heartbeat"' <<<"$out"
          grep -Eq '"event_count":[1-9][0-9]*' <<<"$out"
          grep -Eq '"last_push_utc":"[^"]+"' <<<"$out"
          grep -q '"live_trade":false' <<<"$out"
          grep -q '"delivery_mode":"UNKNOWN"' <<<"$out"
          echo "US_LIVEFEED_EVENT_COUNT=PASS"
          echo "US_LIVEFEED_LAST_PUSH=PASS"
          echo "US_OPEND_LIVEFEED_AWS_DEPLOYMENT=PASS"
          echo "LIVE_TRADE=NO"
