name: Deploy Read-Only US OpenD LiveFeed
on:
  workflow_dispatch:
    inputs:
      approve_restart:
        description: "Explicitly permit a controlled restart of the EXISTING read-only US LiveFeed"
        type: boolean
        required: true
        default: false
      expected_main_sha:
        description: "Full 40-character GitHub main SHA to deploy (must match this workflow run)"
        required: true
        type: string
      subscribe_ab_blend:
        description: "Add QQQ, SCHD, KMLM, GLD, DBMF and BTAL to the read-only OpenD feed (requires fresh quota proof)"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-read-only-us-opend-livefeed
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_restart == true && inputs.expected_main_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout immutable workflow source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind deployment to exact current main and verified source hashes
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          # This workflow currently depends on PUBLIC raw.github and EC2 git
          # fetch. Do not start AWS operations after a visibility change.
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "PRIVATE_REPO_CLOUD_SOURCE_TRANSPORT_NOT_MIGRATED" >&2
            exit 3
          fi
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          [[ "$revision" == "${{ github.sha }}" ]]
          [[ "$revision" == "$EXPECTED_SHA" ]]
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$revision" == "$current_main" ]] || {
            echo 'US_LIVEFEED_MAIN_MOVED_ABORT' >&2
            exit 2
          }
          test -s ops/aws/install_us_opend_livefeed.sh
          test -s ops/aws/verify_us_opend_livefeed.sh
          # Before OIDC / SSM, abort if deployment would overlap the US
          # weekday trading window. The EC2 installer rechecks independently.
          python3 scripts/guard_us_livefeed_restart_window.py
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "install_sha=$(sha256sum ops/aws/install_us_opend_livefeed.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "verify_sha=$(sha256sum ops/aws/verify_us_opend_livefeed.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-livefeed-guarded-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Check fixed authorized SSM instance
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online

      - name: Deploy SHA-pinned verified files with sanitized SSM results
        id: deploy
        shell: bash
        env:
          REPO_REF: ${{ steps.source.outputs.sha }}
          INSTALL_SHA: ${{ steps.source.outputs.install_sha }}
          VERIFY_SHA: ${{ steps.source.outputs.verify_sha }}
          AB_BLEND_SUBSCRIBE: ${{ inputs.subscribe_ab_blend && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ "$REPO_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INSTALL_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$VERIFY_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$AB_BLEND_SUBSCRIBE" =~ ^[01]$ ]]
          # The two immutable commit-path downloads and their hashes must
          # BOTH verify before any systemd restart occurs.
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_us_opend_livefeed.sh' -o "\$stage/install.sh"
          printf '%s  %s\n' '$INSTALL_SHA' "\$stage/install.sh" | sha256sum -c - >/dev/null
          curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/verify_us_opend_livefeed.sh' -o "\$stage/verify.sh"
          printf '%s  %s\n' '$VERIFY_SHA' "\$stage/verify.sh" | sha256sum -c - >/dev/null
          if ! REPO_REF='$REPO_REF' STOCK_RAZOR_AB_BLEND_SUBSCRIBE='$AB_BLEND_SUBSCRIBE' bash "\$stage/install.sh" > "\$stage/install.log" 2> "\$stage/install.err"; then
            echo 'US_LIVEFEED_INSTALL=FAILED' >&2
            exit 1
          fi
          # verify.sh performs deep runtime, repo SHA, 3-session warm-start,
          # daily, snapshot and BLOCKED/NO safety checks. Its raw heartbeat
          # and internal errors stay private on the fixed EC2 instance.
          if ! bash "\$stage/verify.sh" '$REPO_REF' '$AB_BLEND_SUBSCRIBE' > "\$stage/verify.log" 2> "\$stage/verify.err"; then
            echo 'US_LIVEFEED_ACCEPTANCE=FAILED' >&2
            exit 1
          fi
          grep -Fx enabled "\$stage/verify.log" >/dev/null
          grep -Fx active "\$stage/verify.log" >/dev/null
          grep -Fx CANONICAL_SNAPSHOT_EXPORT=PASS "\$stage/verify.log" >/dev/null
          grep -Fx OPEND_CANDIDATE_PREVIEW=READONLY_PASS "\$stage/verify.log" >/dev/null
          if [[ '$AB_BLEND_SUBSCRIBE' == '1' ]]; then
            grep -Fx AB_BLEND_OPEND_QUOTA_PREFLIGHT=PASS "\$stage/install.log" >/dev/null
            grep -Fx AB_BLEND_OPEND_SUBSCRIPTIONS=PASS "\$stage/verify.log" >/dev/null
          fi
          grep -Fx CANONICAL_SNAPSHOT_PATH=/run/stock-razor-us-livefeed/canonical-market-snapshot.json "\$stage/verify.log" >/dev/null
          printf 'US_OPEND_LIVEFEED_AWS_DEPLOYMENT=PASS\nCANONICAL_SNAPSHOT_EXPORT=PASS\nOPEND_CANDIDATE_PREVIEW=READONLY_PASS\nRADAR_ADMISSION=BLOCKED\nLIVE_TRADE=NO\n'
          if [[ '$AB_BLEND_SUBSCRIBE' == '1' ]]; then
            printf 'AB_BLEND_OPEND_SUBSCRIPTIONS=PASS\\nAB_BLEND_OPEND_QUOTA_PREFLIGHT=PASS\\n'
          fi
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 16000 || {
            echo 'US_LIVEFEED_DEPLOY_SSM_PAYLOAD_TOO_LARGE' >&2
            exit 2
          }
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$params" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)"
          [[ "$command_id" =~ ^[a-f0-9-]{36}$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Verify bounded SSM evidence without printing raw cloud logs
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          AB_BLEND_SUBSCRIBE: ${{ inputs.subscribe_ab_blend && '1' || '0' }}
        run: |
          set -euo pipefail
          status=UNKNOWN
          # Cover the bounded 900s systemd startup plus stop/import/verification.
          for _ in $(seq 1 240); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|Cancelling|TimedOut) break ;;
            esac
            sleep 5
          done
          if [[ "$status" != Success ]]; then
            # NEVER print StandardOutputContent or StandardErrorContent.
            echo 'US_OPEND_LIVEFEED_AWS_DEPLOYMENT=NOT_VERIFIED' >&2
            exit 1
          fi
          out="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text)"
          grep -Fx US_OPEND_LIVEFEED_AWS_DEPLOYMENT=PASS <<< "$out" >/dev/null
          grep -Fx CANONICAL_SNAPSHOT_EXPORT=PASS <<< "$out" >/dev/null
          grep -Fx OPEND_CANDIDATE_PREVIEW=READONLY_PASS <<< "$out" >/dev/null
          if [[ "$AB_BLEND_SUBSCRIBE" == "1" ]]; then
            grep -Fx AB_BLEND_OPEND_SUBSCRIPTIONS=PASS <<< "$out" >/dev/null
            grep -Fx AB_BLEND_OPEND_QUOTA_PREFLIGHT=PASS <<< "$out" >/dev/null
          fi
          grep -Fx RADAR_ADMISSION=BLOCKED <<< "$out" >/dev/null
          grep -Fx LIVE_TRADE=NO <<< "$out" >/dev/null
          echo 'US_OPEND_LIVEFEED_AWS_DEPLOYMENT=PASS'
          echo 'CANONICAL_SNAPSHOT_EXPORT=PASS'
          echo 'OPEND_CANDIDATE_PREVIEW=READONLY_PASS'
          if [[ "$AB_BLEND_SUBSCRIBE" == "1" ]]; then echo 'AB_BLEND_OPEND_SUBSCRIPTIONS=PASS'; fi
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
