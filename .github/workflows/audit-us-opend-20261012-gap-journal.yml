name: Audit US OpenD 2026-10-12 K1M Gap Timeline (Read Only)

# Only an operator can request the historical journal comparison. The single
# SSM command reads PID-1 systemd journal entries and returns fixed enums/UTC
# timestamps. It never touches OpenD, provider API, services or canonical data.
on:
  workflow_dispatch:
    inputs:
      approve_readonly_journal_audit:
        description: "Explicitly approve fixed EC2 historical journal read; no provider requests or restarts"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: us-opend-20261012-gap-journal-readonly
  cancel-in-progress: false

jobs:
  historical-journal:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_readonly_journal_audit == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      RADAR_ADMISSION: BLOCKED
      LIVE_TRADE: "NO"
    steps:
      - name: Checkout exact protected main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact main and bounded local script before AWS OIDC
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$source_sha" = "$remote_main"
          test "$RADAR_ADMISSION" = BLOCKED
          test "$LIVE_TRADE" = NO
          test -s scripts/audit_us_opend_20261012_gap_journal.py
          source_hash="$(sha256sum scripts/audit_us_opend_20261012_gap_journal.py | cut -d' ' -f1)"
          [[ "$source_hash" =~ ^[a-f0-9]{64}$ ]]
          echo "source_hash=$source_hash" >> "$GITHUB_OUTPUT"

      - name: Assume existing limited AWS SSM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-opend-gap-journal-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Invoke private fixed-target journal read using exact-source SSM
        id: send
        shell: bash
        env:
          SOURCE_HASH: ${{ steps.source.outputs.source_hash }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_HASH" =~ ^[a-f0-9]{64}$ ]]
          packed="$(gzip -n -9 -c scripts/audit_us_opend_20261012_gap_journal.py | base64 -w0)"
          test -n "$packed"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d -t sr-us-gap-journal.XXXXXXXX)
          trap 'rm -rf "\$stage"' EXIT
          printf '%s' '$packed' | base64 -d | gzip -d > "\$stage/audit.py"
          printf '%s  %s\n' '$SOURCE_HASH' "\$stage/audit.py" | sha256sum -c - >/dev/null
          export AWS_EC2_METADATA_DISABLED=true
          timeout 20 python3 "\$stage/audit.py"
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 17000
          params="$(jq -cn --arg cmd "$remote" '{commands:[$cmd]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$params" --timeout-seconds 70 \
            --query 'Command.CommandId' --output text)"
          [[ "$command_id" =~ ^[a-f0-9-]{36}$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Emit only finite non-sensitive chronology facts
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          [[ "$COMMAND_ID" =~ ^[a-f0-9-]{36}$ ]]
          status=UNKNOWN
          for _ in $(seq 1 35); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|Cancelling|TimedOut)
                echo 'OPEND_GAP_JOURNAL=NOT_VERIFIED'
                echo 'RAW_SSM_OUTPUT_WITHHELD=YES'
                exit 1 ;;
            esac
            sleep 2
          done
          test "$status" = Success || {
            echo 'OPEND_GAP_JOURNAL=NOT_VERIFIED'
            echo 'RAW_SSM_OUTPUT_WITHHELD=YES'
            exit 1
          }
          private_json="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
            --query StandardOutputContent --output text)"
          # stdout can contain arbitrary EC2/private text. Never echo it.
          printf '%s' "$private_json" | python3 -c '
          import json,re,sys
          o=json.load(sys.stdin)
          assert isinstance(o,dict)
          assert o.get("schema")=="stock_razor_opend_gap_restart_journal_audit_v1"
          assert o.get("source")=="LOCAL_EC2_SYSTEMD_JOURNAL_ONLY"
          assert o.get("time_window_utc")=="2026-10-12T14:57:00Z/2026-10-12T15:02:00Z"
          assert o.get("status") in ("RESTART_SEQUENCE_OBSERVED","NOT_VERIFIED")
          assert o.get("manager_restart_pair") in ("OBSERVED","NOT_VERIFIED")
          assert o.get("manager_restart_pair")==("OBSERVED" if o["status"]=="RESTART_SEQUENCE_OBSERVED" else "NOT_VERIFIED")
          assert o.get("reason") in (None,"JOURNAL_UNAVAILABLE","NO_MANAGER_EVENTS_OBSERVED","BOUND_EXCEEDED","INVALID_RECORD","MANAGER_EVENTS_INCOMPLETE")
          for key in ("manager_stops_utc","manager_starts_utc"):
              v=o.get(key)
              assert isinstance(v,list) and len(v)<=10
              assert all(isinstance(s,str) and re.fullmatch(r"2026-10-12T(14:(57|58|59)|15:(00|01|02)):[0-5][0-9]Z",s) for s in v)
          for key in ("causal_attribution","provider_delivery","missing_provider_bar"):
              assert o.get(key)=="NOT_VERIFIED"
          assert o.get("radar_admission")=="BLOCKED"
          assert o.get("source_arbiter_admission")=="BLOCKED"
          for key in ("paper_auto_ready","live_trade","trade_execution"):
              assert o.get(key)=="NO"
          print("OPEND_GAP_SYSTEMD_RESTART_SEQUENCE="+o["manager_restart_pair"])
          print("OPEND_GAP_SYSTEMD_STOP_OBSERVATIONS="+str(len(o["manager_stops_utc"])))
          print("OPEND_GAP_SYSTEMD_START_OBSERVATIONS="+str(len(o["manager_starts_utc"])))
          print("OPEND_GAP_CAUSAL_ATTRIBUTION=NOT_VERIFIED")
          print("RAW_SSM_OUTPUT_WITHHELD=YES")
          print("RADAR_ADMISSION=BLOCKED")
          print("LIVE_TRADE=NO")
          '
