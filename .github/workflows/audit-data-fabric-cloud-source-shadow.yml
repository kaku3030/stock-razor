name: Audit Data Fabric Cloud Source Arbiter Shadow

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: audit-data-fabric-cloud-arbiter-shadow
  cancel-in-progress: false

jobs:
  cloud-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout pinned main commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configure AWS OIDC operations credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: data-fabric-cloud-shadow
          aws-region: ap-northeast-1
      - name: Ensure fixed AWS SSM instance is online
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online
      - name: Read US/CN cache evidence and reject unqualified sources
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha="$(git rev-parse HEAD)"
          [[ "$canonical_sha" =~ ^[0-9a-f]{40}$ ]]
          read -r -d '' remote <<'REMOTE' || true
          set -euo pipefail
          expected_sha="$1"
          repo="/opt/stock-razor-mcp/repo"
          py="/opt/stock-razor-mcp/venv/bin/python"
          test -x "$py"
          test -f "$repo/scripts/probe_cloud_source_arbiter_shadow.py"
          cd "$repo"
          test "$(git rev-parse HEAD)" = "$expected_sha" || {
            echo 'CLOUD_SHADOW_DEPLOYED_SHA_MISMATCH'
            exit 1
          }
          export PYTHONPATH="$repo"
          export STOCK_RAZOR_US_LIVEFEED_STATUS_PATH="/run/stock-razor-us-livefeed/latest-heartbeat.json"
          export STOCK_RAZOR_US_CANONICAL_SNAPSHOT_PATH="/run/stock-razor-us-livefeed/canonical-market-snapshot.json"
          export STOCK_RAZOR_CN_EASTMONEY_STATUS_PATH="/run/stock-razor-cn-eastmoney/latest-observation.json"
          report="$("$py" scripts/probe_cloud_source_arbiter_shadow.py 2>/dev/null)" || {
            echo 'CLOUD_SHADOW_PROBE_FAILED'
            exit 1
          }
          printf '%s' "$report" | "$py" -c '
          import json,sys
          p=json.load(sys.stdin)
          assert p.get("schema") == "stock_razor_data_fabric_aws_shadow_witness_v0_1"
          assert p.get("scope") == "AWS_EXISTING_READ_ONLY_CACHE_WITH_UNQUALIFIED_SOURCES"
          assert p.get("proposals_admitted") == 0
          assert p.get("sources_proven_qualified") == 0
          assert p.get("source_arbiter_runtime_admission") == "BLOCKED"
          assert p.get("canonical_writer_created") is False
          assert p.get("radar_admission") == "BLOCKED"
          assert p.get("live_trade") is False
          assert p.get("can_confirm_signal") is False
          assert p.get("data_qualification") == "NOT_VERIFIED"
          progress=p.get("source_progress")
          assert isinstance(progress,dict)
          assert progress.get("measurement_scope") == "TWO_SEPARATE_AWS_CACHE_READS_NOT_PROVIDER_SLO"
          assert progress.get("unique_provider_event_delivery_qualified") is False
          assert progress.get("cloud_off_pc_independence") == "NOT_VERIFIED"
          assert progress.get("radar_admission") == "BLOCKED"
          assert set(progress.get("cn",{})) == {"159611","518880"}
          assert "event_progress_classification" in progress.get("us",{})
          assert len(p.get("entries",[])) == 4
          assert {x.get("market") for x in p["entries"]} == {"US","CN"}
          assert all(x.get("decision",{}).get("decision") == "BLOCKED"
                     and x["decision"].get("canonical_write_authorized") is False
                     for x in p["entries"])
          print(json.dumps(p,sort_keys=True))
          '
          echo "CLOUD_SOURCE_ARBITER_SHADOW=PASS"
          echo "CLOUD_SOURCE_ARBITER_PRODUCTION_ADMISSION=BLOCKED"
          echo "LIVE_TRADE=NO"
          REMOTE
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          parameters="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash -s -- '$canonical_sha'" '{commands:[$c]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$parameters" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          [[ -n "$command_id" && "$command_id" != None ]]
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                output="$(aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
                  --query StandardOutputContent --output text)"
                printf '%s\n' "$output" | grep -Fx 'CLOUD_SOURCE_ARBITER_SHADOW=PASS'
                printf '%s\n' "$output" | grep -Fx 'CLOUD_SOURCE_ARBITER_PRODUCTION_ADMISSION=BLOCKED'
                printf '%s\n' "$output" | grep -Fx 'LIVE_TRADE=NO'
                summary="$(printf '%s\n' "$output" | grep -E '^[{]' | tail -n1)"
                printf '%s' "$summary" | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          assert p.get("schema") == "stock_razor_data_fabric_aws_shadow_witness_v0_1"
          assert p.get("source_progress",{}).get("unique_provider_event_delivery_qualified") is False
          assert p.get("source_arbiter_runtime_admission") == "BLOCKED"
          assert p.get("proposals_admitted") == 0
          assert p.get("canonical_writer_created") is False
          assert p.get("radar_admission") == "BLOCKED"
          assert p.get("live_trade") is False
          print(json.dumps(p,sort_keys=True))
          '
                echo 'CLOUD_SOURCE_ARBITER_AUDIT_EXECUTED=YES'
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "CLOUD_SOURCE_ARBITER_AUDIT_FAILED=$status" >&2
                exit 1 ;;
            esac
            sleep 3
          done
          echo 'CLOUD_SOURCE_ARBITER_AUDIT_TIMEOUT' >&2
          exit 1
