name: STOCK RAZOR Fast Context Discussion Sync

"on":
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: stock-razor-discussion-sync
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'kaku3030/stock-razor' &&
      github.event.issue.number == 924 &&
      github.event.comment.user.login == 'kaku3030' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      INSTALL_ROOT: /opt/stock-razor-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Parse and validate only an owner-published project sync packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kaku3030/stock-razor
          test "$GITHUB_ACTOR" = kaku3030
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current" && test "$current" = "$(git rev-parse HEAD)"
          # No arbitrary comment body is ever passed to SSM.
          python scripts/stock_razor_fast_sync.py \
            --parse-comment "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/fast-sync-packet.json"
          jq -e '.status == "ACCEPTED" and .delivery_receipt == "NOT_VERIFIED_UNTIL_SSM_READBACK"' \
            "$RUNNER_TEMP/fast-sync-packet.json" > /dev/null
          echo "SYNC_ENVELOPE_VALIDATED=YES"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: discussion-sync-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Record allowlisted event in existing cloud Context Manager
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/fast-sync-packet.json"
          event_id="$(jq -r '.event_id' "$packet")"
          event_type="$(jq -r '.event_type' "$packet")"
          source="$(jq -r '.source' "$packet")"
          source_ref="$(jq -r '.source_ref' "$packet")"
          ttl="$(jq -r '.ttl_seconds' "$packet")"
          [[ "$event_id" =~ ^github:sync:[0-9]+$ ]]
          [[ "$event_type" =~ ^(radar_sync|priorities_sync)$ ]]
          [[ "$source" =~ ^(radar|engineering)$ ]]
          [[ "$source_ref" =~ ^github/issue_comment/[0-9]+$ ]]
          test "$ttl" = 259200
          payload_b64="$(jq -c .payload "$packet" | base64 -w0)"
          remote="$(printf '%s\n' \
            'set -eu' \
            "export PYTHONPATH='$INSTALL_ROOT/repo'" \
            'export STOCK_RAZOR_CONTEXT_STATE_PATH=/var/lib/stock-razor/context-manager/current.json' \
            'export STOCK_RAZOR_CONTEXT_EVENTS_PATH=/var/lib/stock-razor/context-manager/events.jsonl' \
            "payload=\$(printf '%s' '$payload_b64' | base64 -d)" \
            "'$INSTALL_ROOT/venv/bin/python' '$INSTALL_ROOT/repo/scripts/record_context_event.py' --event-id '$event_id' --event-type '$event_type' --source '$source' --source-ref '$source_ref' --payload-json \"\$payload\" --ttl-seconds '$ttl'")"
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          cmd_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" \
            --timeout-seconds 120 --query Command.CommandId --output text)"
          test -n "$cmd_id"
          status=UNKNOWN
          for _ in $(seq 1 45); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          if [ "$status" != Success ]; then
            echo "CONTEXT_DISCUSSION_SSM=$status" >&2
            exit 1
          fi
          result="$(aws ssm get-command-invocation --command-id "$cmd_id" \
            --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent \
            --output text | tr -d '\r')"
          printf '%s' "$result" | jq -e '.status == "RECORDED" or .status == "DUPLICATE"' >/dev/null
          echo "CONTEXT_DISCUSSION_SYNC=PASS"
          echo "CONTEXT_DISCUSSION_RECEIPT=SSM_RECORDED_OR_DUPLICATE"
          # A mobile client or another chat window read is independently NOT_VERIFIED.
