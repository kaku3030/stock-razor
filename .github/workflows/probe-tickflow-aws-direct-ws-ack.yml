name: TickFlow Direct WS ACK Cloud Probe (Explicit Opt-In)

# Private key stays on existing Tokyo EC2. Manual read-only quotes and five
# bounded K-line fingerprint checkpoints; no canonical writes or orders.
on:
  workflow_dispatch:
    inputs:
      approve_paid_direct_ws_probe:
        description: "Explicitly approve private AWS TickFlow paid WS handshake & quote updates"
        type: boolean
        required: true
        default: false
      ws_seconds:
        description: "Read-only observation duration; reconnects use bounded backoff"
        type: choice
        required: true
        default: "30"
        options:
          - "10"
          - "15"
          - "30"
          - "60"
          - "900"
          - "3600"
          - "7200"
          - "9000"
          - "14160"
          - "16800"

permissions:
  id-token: write
  contents: read

concurrency:
  group: tickflow-direct-ws-ack-cloud-probe
  cancel-in-progress: false

jobs:
  direct-ws-ack:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_paid_direct_ws_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      RADAR_ADMISSION: BLOCKED
      SOURCE_ARBITER_ADMISSION: BLOCKED
      LIVE_TRADE: "NO"
      TRADE_EXECUTION: "NO"
    steps:
      - name: Checkout immutable protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard protected main, paid scope and exact source before AWS OIDC
        shell: bash
        env:
          WS_SECONDS: ${{ inputs.ws_seconds }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          head="$(git rev-parse HEAD)"
          [[ "$head" =~ ^[a-f0-9]{40}$ ]]
          test "$head" = "$GITHUB_SHA"
          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$live_main" == "$head" ]] || {
            echo 'TICKFLOW_WS_MAIN_MOVED_ABORT' >&2
            exit 2
          }
          [[ "$WS_SECONDS" =~ ^(10|15|30|60|900|3600|7200|9000|14160|16800)$ ]]
          test "$RADAR_ADMISSION" = BLOCKED
          test "$SOURCE_ARBITER_ADMISSION" = BLOCKED
          test "$LIVE_TRADE" = NO
          test "$TRADE_EXECUTION" = NO
          for file in \
            ops/aws/run_tickflow_premium_probe.sh \
            scripts/probe_tickflow_isolated.py \
            scripts/tickflow_ws_protocol_probe.py \
            scripts/sanitize_tickflow_ws_protocol_probe.py \
            ops/requirements/tickflow-isolated-v0.1.txt; do
            test -s "$file"
          done

      - name: Assume existing bounded AWS SSM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-ws-ack-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Run pinned standalone direct WS protocol evidence on fixed EC2
        id: invoke
        shell: bash
        env:
          WS_SECONDS: ${{ inputs.ws_seconds }}
        run: |
          set -euo pipefail
          [[ "$WS_SECONDS" =~ ^(10|15|30|60|900|3600|7200|9000|14160|16800)$ ]]
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == "$GITHUB_SHA" ]]
          bootstrap_hash="$(sha256sum ops/aws/run_tickflow_premium_probe.sh | cut -d' ' -f1)"
          probe_hash="$(sha256sum scripts/probe_tickflow_isolated.py | cut -d' ' -f1)"
          requirements_hash="$(sha256sum ops/requirements/tickflow-isolated-v0.1.txt | cut -d' ' -f1)"
          protocol_hash="$(sha256sum scripts/tickflow_ws_protocol_probe.py | cut -d' ' -f1)"
          sanitizer_hash="$(sha256sum scripts/sanitize_tickflow_ws_protocol_probe.py | cut -d' ' -f1)"
          payload="$(gzip -n -9 -c ops/aws/run_tickflow_premium_probe.sh | base64 -w0)"
          test -n "$payload"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d -t sr-ws-ack-bootstrap.XXXXXXXX)
          trap 'rm -rf "\$stage"' EXIT
          export TICKFLOW_PREMIUM_PROBE_ENABLED=true
          export TICKFLOW_PREMIUM_NETWORK_REQUEST_ENABLED=true
          export TICKFLOW_WS_SYMBOLS='159209.SZ 159611.SZ 600519.SH 000001.SZ 300750.SZ 601318.SH 600036.SH 000858.SZ 601398.SH 600900.SH 601888.SH 600276.SH 000333.SZ 002594.SZ 600030.SH 601857.SH 600028.SH 600809.SH 000651.SZ 601012.SH'
          printf '%s' '$payload' | base64 -d | gzip -d > "\$stage/bootstrap.sh"
          printf '%s  %s\n' '$bootstrap_hash' "\$stage/bootstrap.sh" | sha256sum -c - >/dev/null
          bash "\$stage/bootstrap.sh" '$revision' \
            'stock-razor/tickflow/premium-api-key' '$probe_hash' \
            '$requirements_hash' '$bootstrap_hash' '$WS_SECONDS' false \
            '$protocol_hash' '$sanitizer_hash'
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 18000
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$(jq -cn --arg script "$remote" '{commands:[$script]}')" \
            --timeout-seconds 16800 \
            --query 'Command.CommandId' --output text)"
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Emit only finite sanitized WS protocol counters
        shell: bash
        env:
          COMMAND_ID: ${{ steps.invoke.outputs.command_id }}
        run: |
          set -euo pipefail
          [[ "$COMMAND_ID" =~ ^[0-9a-f-]{36}$ ]]
          status=UNKNOWN
          for _ in $(seq 1 5600); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo 'TICKFLOW_WS_ACK_CLOUD=NOT_VERIFIED'
                echo 'RAW_SSM_OUTPUT_WITHHELD=YES'
                exit 1 ;;
            esac
            sleep 3
          done
          test "$status" = Success || {
            echo 'TICKFLOW_WS_ACK_CLOUD=NOT_VERIFIED'
            echo 'RAW_SSM_OUTPUT_WITHHELD=YES'
            exit 1
          }
          private_output="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
            --query StandardOutputContent --output text)"
          # Untrusted EC2 stdout stays private; project only enumerated facts.
          sanitized="$(printf '%s\n' "$private_output" | grep -E '^[{]' | tail -n 1 || true)"
          test -n "$sanitized" || {
            echo 'TICKFLOW_WS_ACK_SANITIZED_SUMMARY_MISSING'
            exit 1
          }
          printf '%s' "$sanitized" | EXPECTED_REVISION="$GITHUB_SHA" python3 -c '
          import json,os,sys
          d=json.load(sys.stdin)
          assert d.get("schema")=="stock_razor_tickflow_ws_ack_sanitized_v0_1"
          assert d.get("source_revision")==os.environ["EXPECTED_REVISION"]
          assert d.get("request_scope")=="DIRECT_QUOTE_WS_PROTOCOL_ONLY"
          assert d.get("protocol_acceptance") in ("PASS","FAIL","NOT_VERIFIED")
          assert d.get("subscription_ack") in ("PASS","FAIL","NOT_VERIFIED")
          assert d.get("bounded_window_status") in ("COMPLETED","TERMINATED_EARLY","UNOBSERVED")
          assert d.get("post_initial_progress_status") in ("OBSERVED_NOT_QUALIFIED","INSUFFICIENT")
          assert d.get("protocol_progress_observation") in ("OBSERVED_NOT_QUALIFIED","NOT_VERIFIED")
          counters=d.get("counters")
          assert isinstance(counters,dict)
          expected={"ack_messages","invalid_ack_messages","pre_ack_quote_frames","quote_frames",
                    "initial_snapshot_candidates","post_initial_update_candidates",
                    "duplicate_timestamp_count","out_of_order_timestamp_count",
                    "invalid_timestamp_count","unknown_symbol_count",
                    "protocol_error_frames","invalid_frames","reconnect_attempts",
                    "reconnect_successes","planned_rotations","kline_snapshots",
                    "kline_digest_changes","kline_read_errors"}
          assert set(counters)==expected
          assert all(type(n) is int and 0<=n<=1000000 for n in counters.values())
          assert d.get("post_initial_p95_lag_bucket") in (
            "NOT_VERIFIED","CLOCK_CONFLICT","UNDER_2S","TWO_TO_FIVE_S",
            "FIVE_TO_THIRTY_S","OVER_THIRTY_S")
          n=d.get("post_initial_lag_samples")
          future=d.get("post_initial_future_timestamp_count")
          assert type(n) is int and 0<=n<=4096
          assert type(future) is int and 0<=future<=1000000
          assert d.get("timestamp_lag_qualification")=="OBSERVED_NOT_QUALIFIED"
          assert d.get("data_qualification")=="NOT_VERIFIED"
          assert d.get("continuous_feed_qualified") is False
          assert d.get("source_arbiter_admission")=="BLOCKED"
          assert d.get("radar_admission")=="BLOCKED"
          assert d.get("paper_auto_ready")=="NO"
          assert d.get("live_trade") is False
          assert d.get("trade_execution")=="NO"
          assert d.get("canonical_write") is False
          assert d.get("order_execution") is False
          print("TICKFLOW_WS_ACK="+d["subscription_ack"])
          print("TICKFLOW_WS_PROTOCOL="+d["protocol_acceptance"])
          print("TICKFLOW_WS_WINDOW="+d["bounded_window_status"])
          print("TICKFLOW_WS_PROGRESS="+d["protocol_progress_observation"])
          print("TICKFLOW_WS_POST_INITIAL_CANDIDATES="+str(counters["post_initial_update_candidates"]))
          print("TICKFLOW_WS_RECONNECT_ATTEMPTS="+str(counters["reconnect_attempts"]))
          print("TICKFLOW_WS_RECONNECT_SUCCESSES="+str(counters["reconnect_successes"]))
          print("TICKFLOW_WS_PLANNED_ROTATIONS="+str(counters["planned_rotations"]))
          print("TICKFLOW_WS_KLINE_SNAPSHOT_READS="+str(counters["kline_snapshots"]))
          print("TICKFLOW_WS_KLINE_DIGEST_CHANGES="+str(counters["kline_digest_changes"]))
          print("TICKFLOW_WS_KLINE_READ_ERRORS="+str(counters["kline_read_errors"]))
          print("TICKFLOW_WS_POST_INITIAL_P95_EVENT_LAG_BUCKET="+d["post_initial_p95_lag_bucket"])
          print("TICKFLOW_WS_POST_INITIAL_LAG_SAMPLES="+str(n))
          print("TICKFLOW_WS_FUTURE_EVENT_TIMESTAMPS="+str(future))
          print("TICKFLOW_WS_DATA_QUALIFICATION=NOT_VERIFIED")
          print("RADAR_ADMISSION=BLOCKED")
          print("LIVE_TRADE=NO")
          print("RAW_SSM_OUTPUT_WITHHELD=YES")
          '
