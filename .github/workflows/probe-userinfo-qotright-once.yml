name: One-Shot OpenD User Quote Right Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-userinfo-qotright-once.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  read-only-userinfo-qotright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: userinfo-qotright-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller and target instance
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-instances \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text | grep -Fx "$TARGET_INSTANCE_ID"

      - name: Submit fixed read-only GetUserInfo QOTRIGHT probe
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' probe_script <<'REMOTE' || true
          set -u
          echo '=== OPEND US GET_USER_INFO QOT_RIGHT READ-ONLY PROBE ==='
          echo 'LIVE_TRADE=NO'
          HOME=/root /opt/stock-razor-opend-client/venv/bin/python - <<'PY'
          import json
          from datetime import datetime, timezone
          import futu as ft

          out={
              "probe":"us_opend_userinfo_qot_right",
              "opend_reachable":False,
              "query_status":"UNKNOWN",
              "us_qot_right":"UNKNOWN",
              "delivery_mode":"UNKNOWN",
              "radar_admission":"BLOCKED",
              "live_trade":False,
          }
          ctx=None
          try:
              ctx=ft.OpenQuoteContext(host="127.0.0.1",port=11111)
              out["opend_reachable"]=True
              ret,data=ctx.get_user_info([ft.UserInfoField.QOTRIGHT])
              if ret==ft.RET_OK and isinstance(data,dict):
                  out["query_status"]="PASS"
                  out["us_qot_right"]=str(data.get("us_qot_right","UNKNOWN"))
              else:
                  out["query_status"]="BLOCKED"
                  out["reason"]="GET_USER_INFO_QOT_RIGHT_FAILED"
                  out["error"]=str(data)[:500]
          except Exception as exc:
              out["query_status"]="BLOCKED"
              out["reason"]="GET_USER_INFO_QOT_RIGHT_ERROR:"+type(exc).__name__
          finally:
              if ctx is not None:
                  try: ctx.close()
                  except Exception: pass

          out["observed_at_utc"]=datetime.now(timezone.utc).isoformat()
          print(json.dumps(out,separators=(",",":"),default=str))
          print("DELIVERY_MODE=UNKNOWN")
          print("RADAR_ADMISSION=BLOCKED")
          print("LIVE_TRADE=NO")
          PY
          REMOTE

          commands="$(jq -c -n --arg script "$probe_script" '[ $script ]')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "{\"commands\":$commands}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          echo "SSM_COMMAND_SUBMITTED=$command_id"

      - name: Collect and validate evidence
        shell: bash
        env:
          COMMAND_ID: ${{ steps.submit.outputs.command_id }}
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --output json)"
          printf '%s\n' "$invocation"
          test "$status" = Success

          out="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          probe_line="$(grep -m1 '^{"probe":"us_opend_userinfo_qot_right"' <<<"$out")"
          test -n "$probe_line"

          PROBE_JSON="$probe_line" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ["PROBE_JSON"])
          assert value.get("probe") == "us_opend_userinfo_qot_right"
          assert value.get("opend_reachable") in {True, False}
          assert value.get("query_status") in {"PASS","BLOCKED","UNKNOWN"}
          assert isinstance(value.get("us_qot_right"), str)
          assert value.get("delivery_mode") == "UNKNOWN"
          assert value.get("radar_admission") == "BLOCKED"
          assert value.get("live_trade") is False
          print("QUERY_STATUS=" + value["query_status"])
          print("US_QOT_RIGHT=" + value["us_qot_right"])
          print("OPEND_REACHABLE=" + str(value["opend_reachable"]).upper())
          print("PROBE_REASON=" + str(value.get("reason","NONE")))
          PY

          grep -Fx 'DELIVERY_MODE=UNKNOWN' <<<"$out"
          grep -Fx 'RADAR_ADMISSION=BLOCKED' <<<"$out"
          grep -Fx 'LIVE_TRADE=NO' <<<"$out"
          echo 'USERINFO_QOTRIGHT_EVIDENCE=PASS'
