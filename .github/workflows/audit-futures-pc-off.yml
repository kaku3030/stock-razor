name: Audit Futures PC-Off Independence

on:
  workflow_dispatch:
    inputs:
      pc_off_from_utc:
        description: "Externally observed user-PC offline start (ISO-8601 UTC)"
        required: true
        type: string
      pc_off_until_utc:
        description: "Optional externally observed user-PC offline end (ISO-8601 UTC); blank uses workflow start UTC"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
      USER_DEVICE_ID: DESKTOP-2SLTODA
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: futures-pc-off-audit-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read runtime journal without restart
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters '{"commands":["journalctl -u stock-razor-futures.service --since \"24 hours ago\" --no-pager | grep '\''\"type\":\"futures_runtime_heartbeat\"'\'' || true"]}' \
            --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          test "$status" = "Success"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text > /tmp/heartbeat.log
          test -s /tmp/heartbeat.log

      - name: Evaluate formal cloud PC-off contract
        shell: bash
        env:
          PC_OFF_FROM: ${{ inputs.pc_off_from_utc }}
          PC_OFF_UNTIL: ${{ inputs.pc_off_until_utc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from src.services.live_feed.cloud_runtime_evidence import RuntimeHeartbeat, PcOffWindow, evaluate_cloud_pc_off_independence
          from src.services.live_feed.pc_off_audit_parser import extract_futures_heartbeat_payloads

          def dt(v):
              return datetime.fromisoformat(v.replace("Z", "+00:00"))

          with open("/tmp/heartbeat.log", encoding="utf-8") as evidence_file:
              payloads = extract_futures_heartbeat_payloads(evidence_file)
          rows = [
              RuntimeHeartbeat(
                  runtime_instance_id=p["runtime_instance_id"], generation=int(p["generation"]),
                  host_id=p["host_id"], sequence=int(p["sequence"]), emitted_at_utc=dt(p["emitted_at_utc"]),
                  observer_id=f"github-actions-run-${{ github.run_id }}", observer_host_id=f"github-hosted-runner-${{ github.run_id }}"
              )
              for p in payloads
          ]
          start=dt(os.environ["PC_OFF_FROM"])
          raw_end=os.environ.get("PC_OFF_UNTIL", "").strip()
          end=dt(raw_end) if raw_end else datetime.now(timezone.utc)
          inside=tuple(h for h in rows if start <= h.emitted_at_utc <= end)
          window=PcOffWindow(user_device_id=os.environ["USER_DEVICE_ID"], offline_from_utc=start, offline_until_utc=end,
              observer_id="chatgpt-remote-device-observation", observer_host_id="openai-remote-observer")
          decision=evaluate_cloud_pc_off_independence(inside, window)
          print(f"PC_OFF_FROM_UTC={start.isoformat()}")
          print(f"PC_OFF_UNTIL_UTC={end.isoformat()}")
          print(f"HEARTBEATS_IN_PC_OFF_WINDOW={len(inside)}")
          print(f"CLOUD_PC_OFF_VERIFIED={str(decision.verified).upper()}")
          print(f"CLOUD_PC_OFF_REASON={decision.reason}")
          print("LIVE_TRADE=NO")
          if not decision.verified:
              raise SystemExit(1)
          PY
