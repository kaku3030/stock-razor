name: Audit TickFlow AWS Inventory (Read Only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: audit-tickflow-aws-inventory-readonly
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TARGET_INSTANCE_ID: i-01738342af3efac72

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact main before AWS identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          echo 'INVENTORY_SOURCE_GUARD=PASS'

      - name: Configure temporary AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-inventory-readonly-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read EC2 and SSM metadata only
        shell: bash
        run: |
          set -euo pipefail
          instance_json="$(aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE_ID" --query 'Reservations[0].Instances[0]' --output json 2>/dev/null || true)"
          if [[ -z "$instance_json" || "$instance_json" == null ]]; then
            echo 'EC2_METADATA=UNKNOWN'
            echo 'EC2_METADATA_BLOCKER=ACCESS_OR_TARGET_UNAVAILABLE'
          else
            jq -e --arg id "$TARGET_INSTANCE_ID" '.InstanceId == $id' <<<"$instance_json" >/dev/null
            echo 'EC2_METADATA=PASS'
            jq -r '
              "EC2_STATE=" + (.State.Name // "UNKNOWN"),
              "EC2_PLATFORM=" + (.PlatformDetails // "UNKNOWN" | if test("^[A-Za-z0-9 ._()/-]+$") then . else "UNKNOWN" end),
              "EC2_TAG_NAME=" + (if any(.Tags[]?; .Key == "Name") then "PRESENT" else "MISSING" end),
              "EC2_TAG_SERVICE=" + (if any(.Tags[]?; .Key == "Service") then "PRESENT" else "MISSING" end),
              "EC2_TAG_ROLE=" + (if any(.Tags[]?; .Key == "Role") then "PRESENT" else "MISSING" end),
              "EC2_TAG_COMPONENT=" + (if any(.Tags[]?; .Key == "Component") then "PRESENT" else "MISSING" end),
              "EC2_TAG_ENVIRONMENT=" + (if any(.Tags[]?; .Key == "Environment") then "PRESENT" else "MISSING" end)
            ' <<<"$instance_json"
          fi

          ssm_json="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0]' --output json 2>/dev/null || true)"
          if [[ -z "$ssm_json" || "$ssm_json" == null ]]; then
            echo 'SSM_METADATA=UNKNOWN'
            echo 'SSM_METADATA_BLOCKER=ACCESS_OR_TARGET_UNAVAILABLE'
          else
            jq -e --arg id "$TARGET_INSTANCE_ID" '.InstanceId == $id' <<<"$ssm_json" >/dev/null
            jq -r '
              "SSM_METADATA=PASS",
              "SSM_PING=" + (.PingStatus // "UNKNOWN"),
              "SSM_PLATFORM_TYPE=" + (.PlatformType // "UNKNOWN"),
              "SSM_PLATFORM_NAME=" + (.PlatformName // "UNKNOWN" | if test("^[A-Za-z0-9 ._()/-]+$") then . else "UNKNOWN" end),
              "SSM_AGENT_VERSION_PRESENT=" + (if (.AgentVersion // "") != "" then "YES" else "NO" end)
            ' <<<"$ssm_json"
          fi

      - name: Read service division through SSM without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ssm_json="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0]' --output json 2>/dev/null || true)"
          if [[ -z "$ssm_json" || "$ssm_json" == null ]] || [[ "$(jq -r '.PingStatus // "UNKNOWN"' <<<"$ssm_json")" != Online ]]; then
            echo 'SERVICE_DIVISION=NOT_REACHED'
            echo 'SERVICE_DIVISION_REASON=SSM_NOT_ONLINE_OR_UNKNOWN'
            exit 0
          fi
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo 'INVENTORY_MAIN_MOVED_ABORT' >&2
            exit 2
          fi
          read -r -d '' remote <<'REMOTE' || true
          set -eu
          units="$(systemctl list-units --type=service --state=running --no-legend 2>/dev/null || true)"
          if [ -z "$units" ]; then
            echo "SERVICE_DIVISION=UNKNOWN"
            echo "SERVICE_DIVISION_REASON=SYSTEMD_UNAVAILABLE_OR_NO_RUNNING_UNITS"
            exit 0
          fi
          classify() {
            label="$1"
            pattern="$2"
            if printf "%s\n" "$units" | awk '{print $1}' | grep -Eiq "$pattern"; then
              printf "SERVICE_%s=PRESENT\n" "$label"
            else
              printf "SERVICE_%s=NOT_FOUND\n" "$label"
            fi
          }
          echo "SERVICE_DIVISION=PASS"
          classify OPEND '(^|[-_.])(opend|futu)([-_.]|@|$)'
          classify MCP '(^|[-_.])mcp([-_.]|@|$)'
          classify CN_WORKER '(^|[-_.])(cn|tickflow|eastmoney|radar)([-_.]|@|$)'
          echo "SERVICE_UNIT_COUNT=$(printf "%s\n" "$units" | awk 'NF {n++} END {print n+0}')"
          echo "SERVICE_MUTATIONS=NONE"
          REMOTE
          commands="$(jq -cn --arg command "$remote" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$commands" --timeout-seconds 90 --query 'Command.CommandId' --output text 2>/dev/null || true)"
          if [[ -z "$command_id" || "$command_id" == None ]]; then
            echo 'SERVICE_DIVISION=UNKNOWN'
            echo 'SERVICE_DIVISION_REASON=SSM_SEND_COMMAND_BLOCKED'
            exit 0
          fi
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                report="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
                printf '%s\n' "$report" | grep -E '^SERVICE_(DIVISION|OPEND|MCP|CN_WORKER|UNIT_COUNT|MUTATIONS)=' || echo 'SERVICE_DIVISION=UNKNOWN'
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SERVICE_DIVISION=UNKNOWN"
                echo "SERVICE_DIVISION_REASON=SSM_COMMAND_$status"
                exit 0
                ;;
            esac
            sleep 2
          done
          echo 'SERVICE_DIVISION=UNKNOWN'
          echo 'SERVICE_DIVISION_REASON=SSM_COMMAND_TIMEOUT'

      - name: Read bounded Cost Explorer fact
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u -d '7 days ago' +%F)"
          end="$(date -u +%F)"
          if ! cost="$(aws ce get-cost-and-usage --time-period "Start=$start,End=$end" --granularity DAILY --metrics UnblendedCost --query 'ResultsByTime[].Total.UnblendedCost.Amount' --output json 2>/dev/null)"; then
            echo 'COST_EXPLORER=BLOCKED'
            echo 'COST_EXPLORER_ACCESS=DENIED_OR_UNAVAILABLE'
            exit 0
          fi
          if [[ -z "$cost" || "$cost" == null || "$cost" == '[]' ]]; then
            echo 'COST_EXPLORER=EMPTY_OR_NOT_ENABLED'
            echo 'COST_EXPLORER_ACCESS=PASS_BUT_NO_ROWS'
            exit 0
          fi
          total="$(jq -r '[.[] | tonumber] | add // 0' <<<"$cost" 2>/dev/null || echo invalid)"
          if [[ "$total" == invalid ]]; then
            echo 'COST_EXPLORER=UNKNOWN'
            echo 'COST_EXPLORER_ACCESS=PASS_BUT_SCHEMA_UNKNOWN'
            exit 0
          fi
          bucket="$(awk -v value="$total" 'BEGIN { if (value < 1) print "LT_1"; else if (value < 10) print "1_TO_10"; else if (value < 100) print "10_TO_100"; else print "GE_100" }')"
          echo 'COST_EXPLORER=PASS'
          echo "COST_PERIOD_UTC=${start}_TO_${end}"
          echo "COST_TOTAL_USD_BUCKET=$bucket"

      - name: Preserve fail-closed safety state
        shell: bash
        run: |
          echo 'AWS_INVENTORY_SCOPE=READ_ONLY'
          echo 'AWS_INVENTORY_SECRETS=NOT_READ'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'PAPER_AUTO_READY=NO'
          echo 'LIVE_TRADE=NO'
