name: Benchmark Actual US Radar Technical Compute (Read Only)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: us-radar-readonly-compute-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          python3 -m py_compile scripts/benchmark_us_radar_actual_compute_readonly.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: radar-cpu-readonly-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Execute isolated Radar technical calculation over private snapshot
        shell: bash
        run: |
          set -euo pipefail
          script_b64="$(base64 -w0 scripts/benchmark_us_radar_actual_compute_readonly.py)"
          command_text="printf '%s' '$script_b64' | base64 -d | /opt/stock-razor-us-radar/venv/bin/python -"
          params="$(jq -cn --arg script "$command_text" '{commands:[$script]}')"
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" \
            --timeout-seconds 140 --query Command.CommandId --output text)"
          state=UNKNOWN
          for _ in $(seq 1 75); do
            state="$(aws ssm get-command-invocation --command-id "$command_id" \
               --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 2
          done
          if [ "$state" != Success ]; then
            echo "RADAR_COMPUTE_BENCHMARK_SSM=$state"
            echo 'PRIVATE_SSM_OUTPUT_WITHHELD=YES'
            exit 1
          fi
          raw="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null)"
          if [ "$(printf '%s' "$raw" | wc -c)" -gt 4000 ]; then
            echo 'RADAR_COMPUTE_BENCHMARK_OVERSIZE=BLOCKED'
            exit 1
          fi
          printf '%s' "$raw" | jq -ec '
            select(.schema=="stock_razor_us_radar_actual_compute_latency_v1"
               and .source_arbiter_admission=="BLOCKED"
               and .radar_admission=="BLOCKED"
               and .live_trade==false
               and .production_writes==0
               and .provider_requests==0
               and .model_inference==false)
            | {schema,observed_utc,status,reason,failure_class,
               source_age_seconds,source_bar_closure,source_delivery_mode,
               snapshot_load_and_parse_ms,canonical_symbols_present,
               daily_history_validation,daily_symbols_present,
               iterations_completed,symbol_evaluations,
               analysis_batch_p50_ms,analysis_batch_p95_ms,analysis_batch_max_ms,
               analysis_symbol_p50_ms,analysis_symbol_p95_ms,
               analysis_symbols,live_data_freshness_qualified,
               end_to_end_latency_qualified,provider_requests,production_writes,
               radar_admission,source_arbiter_admission,live_trade}
          '
          echo 'US_RADAR_TECHNICAL_REPLAY_EXECUTED=YES'
          echo 'US_RADAR_PRODUCTION_CYCLE_SLO=NOT_VERIFIED'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
