name: Research Universe Capture

on:
  workflow_dispatch:
  push:
    branches:
      - research/rule-validation-harness-v0-1
  schedule:
    - cron: "45 22 * * 1-5"

jobs:
  capture-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install capture dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Validate research universe contract
        run: python scripts/validate_research_universe.py --config config/research_universe_v0_1.json
      - name: Capture frozen research universe
        continue-on-error: true
        run: |
          python scripts/capture_research_universe.py \
            --config config/research_universe_v0_1.json \
            --output-dir artifacts/universe
      - name: Validate captured universe evidence
        run: |
          python scripts/validate_research_universe_capture.py \
            --config config/research_universe_v0_1.json \
            --input-dir artifacts/universe
      - name: Capture AKShare cross-source sample
        continue-on-error: true
        run: |
          for symbol in sh.600000 sh.600519 sh.601318; do
            safe_symbol=${symbol//./_}
            python scripts/capture_research_eod.py \
              --market cn --source akshare --symbol "$symbol" \
              --start 2015-01-01 --end "$(date -u +%Y-%m-%d)" \
              --output "artifacts/universe/cn_${safe_symbol}_akshare.csv" --retries 3 || true
          done
      - name: Compare Baostock and AKShare sample
        run: |
          for symbol in sh.600000 sh.600519 sh.601318; do
            safe_symbol=${symbol//./_}
            right="artifacts/universe/cn_${safe_symbol}_akshare.csv"
            if [ -f "$right" ] && [ -f "$right.manifest.json" ]; then
              python scripts/compare_recorded_captures.py \
                --left-csv "artifacts/universe/cn_${safe_symbol}.csv" \
                --left-manifest "artifacts/universe/cn_${safe_symbol}.csv.manifest.json" \
                --right-csv "$right" --right-manifest "$right.manifest.json"
            else
              echo "{\"status\":\"UNKNOWN\",\"reason\":\"AKSHARE_CAPTURE_UNAVAILABLE\",\"symbol\":\"$symbol\"}"
            fi
          done
      - name: Compute cross-sectional RS
        run: |
          python scripts/compute_cross_sectional_rs.py \
            --input-dir artifacts/universe \
            --output artifacts/universe/rs_rankings.json
      - name: Run historical RS replay
        run: |
          python scripts/run_rs_replay.py --input-dir artifacts/universe \
            --output artifacts/universe/rs_replay.json
      - name: Summarize RS replay
        run: |
          python scripts/summarize_rs_replay.py \
            --input artifacts/universe/rs_replay.json \
            --output artifacts/universe/rs_summary.json
      - name: Upload universe captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-universe-${{ github.run_id }}
          path: artifacts/universe/
          if-no-files-found: warn
          retention-days: 14
