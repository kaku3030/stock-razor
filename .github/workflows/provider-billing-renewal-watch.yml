name: STOCK RAZOR Provider Billing & Renewal Watch (Read Only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'True: offline demonstration; false: query configured read-only APIs and send via Discord'
        type: boolean
        default: true
        required: true
  schedule:
    # 01:20 UTC = 10:20 JST daily. Cloud runner, not the user's Windows PC.
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: stock-razor-provider-billing-watch
  cancel-in-progress: false

jobs:
  aws-cost:
    # Dedicated OIDC job: OpenAI and DeepSeek keys are NOT available here.
    # Cost Explorer API is billed ($0.01/request). Require separate explicit owner opt-in.
    if: vars.AWS_COST_EXPLORER_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    outputs:
      status: ${{ steps.cost.outputs.status || steps.unavailable.outputs.status }}
      mtd_usd: ${{ steps.cost.outputs.mtd_usd }}
      estimated: ${{ steps.cost.outputs.estimated }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assume existing AWS Ops role for Cost Explorer READ ONLY
        id: oidc
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: provider-billing-${{ github.run_id }}
          aws-region: us-east-1
      - name: Query AWS month-to-date Cost Explorer without mutation
        id: cost
        if: steps.oidc.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aws_provider_billing_cost.py
      - name: Preserve UNKNOWN if AWS OIDC is not authorized
        id: unavailable
        if: steps.oidc.outcome != 'success'
        shell: bash
        run: echo 'status=NOT_AUTHORIZED_OR_UNAVAILABLE' >> "$GITHUB_OUTPUT"
  watch:
    needs: aws-cost
    # Even an AWS OIDC/CE failure must not suppress OpenAI/DeepSeek/TickFlow checks.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AWS_COST_STATUS: ${{ needs.aws-cost.outputs.status }}
      AWS_COST_MTD_USD: ${{ needs.aws-cost.outputs.mtd_usd }}
      AWS_COST_ESTIMATED: ${{ needs.aws-cost.outputs.estimated }}
      AWS_MONTHLY_BUDGET_USD: ${{ vars.AWS_MONTHLY_BUDGET_USD }}
      OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
      OPENAI_MONTHLY_BUDGET_USD: ${{ vars.OPENAI_MONTHLY_BUDGET_USD }}
      OPENAI_CREDIT_SNAPSHOT_USD: ${{ vars.OPENAI_CREDIT_SNAPSHOT_USD }}
      OPENAI_CREDIT_SNAPSHOT_DATE_UTC: ${{ vars.OPENAI_CREDIT_SNAPSHOT_DATE_UTC }}
      TICKFLOW_RENEWAL_DATE: ${{ vars.TICKFLOW_RENEWAL_DATE }}
      DISCORD_RADAR_WEBHOOK_URL: ${{ secrets.DISCORD_RADAR_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify pinned checkout and read-only monitor
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/provider_billing_renewal_watch.py
      - name: Unified provider costs, DeepSeek funds, AWS estimate and TickFlow renewal
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.dry_run }}" == true ]]; then
            python3 -m scripts.provider_billing_renewal_watch --dry-run
          elif [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            python3 -m scripts.provider_billing_renewal_watch --send-report
          else
            python3 -m scripts.provider_billing_renewal_watch
          fi
