name: Verify TickFlow Cloud MCP Loopback (Read Only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tickflow-cloud-mcp-loopback-readonly
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact current protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-mcp-loopback-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Call actual local MCP HTTP tools through SSM (cache only)
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' remote <<'REMOTE' || true
          set -eu
          test "$(systemctl is-active stock-razor-mcp.service)" = active
          test -x /opt/stock-razor-mcp/venv/bin/python
          PYTHONPATH=/opt/stock-razor-mcp/repo /opt/stock-razor-mcp/venv/bin/python - 2>/dev/null <<'PY'
          import asyncio
          import json

          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          CASES = (("159611.SZ", "15m"), ("159611.SZ", "60m"),
                   ("518880.SH", "15m"), ("518880.SH", "60m"))

          def unpack(result):
              value = getattr(result, "structuredContent", None)
              if not isinstance(value, dict):
                  value = getattr(result, "structured_content", None)
              if isinstance(value, dict):
                  return value.get("result", value)
              blocks = [x.text for x in result.content
                        if getattr(x, "type", None) == "text"
                        and isinstance(getattr(x, "text", None), str)]
              if len(blocks) != 1:
                  return {}
              value = json.loads(blocks[0])
              return value.get("result", value) if isinstance(value, dict) else {}

          async def main():
              print("TICKFLOW_MCP_NETWORK=ATTEMPTED", flush=True)
              async with streamablehttp_client("http://127.0.0.1:8000/mcp") as (read, write, _):
                  async with ClientSession(read, write) as client:
                      await client.initialize()
                      print("TICKFLOW_MCP_PROTOCOL=PASS", flush=True)
                      listed = await client.list_tools()
                      if "get_cn_tickflow_research_data" not in {x.name for x in listed.tools}:
                          print("TICKFLOW_MCP_TOOL_DISCOVERY=BLOCKED", flush=True)
                          return 2
                      print("TICKFLOW_MCP_TOOL_DISCOVERY=PASS", flush=True)
                      statuses = []
                      rows_total = 0
                      for symbol, timeframe in CASES:
                          response = await client.call_tool(
                              "get_cn_tickflow_research_data",
                              {"symbol": symbol, "timeframe": timeframe,
                               "limit": 1, "research_mode": "historical_only"},
                              read_timeout_seconds=None,
                          )
                          if response.isError:
                              statuses.append("ERROR")
                              continue
                          d = unpack(response)
                          status = d.get("status", "INVALID")
                          rows = d.get("rows")
                          safe = (d.get("research_only") is True
                                  and d.get("radar_admission") == "BLOCKED"
                                  and d.get("source_arbiter_admission") == "BLOCKED"
                                  and d.get("live_trade") is False
                                  and d.get("bar_finality") == "NOT_VERIFIED")
                          if not safe:
                              statuses.append("UNSAFE")
                              continue
                          if (status == "PASS_HISTORICAL_ONLY" and d.get("ok") is True
                                  and isinstance(rows, list) and len(rows) == 1
                                  and all(isinstance(rows[0].get(k), (int, float))
                                          for k in ("open", "high", "low", "close", "volume"))):
                              statuses.append("PASS")
                              rows_total += 1
                          elif status in ("STALE", "NO_DATA", "INVALID_CACHE",
                                          "BAR_LABEL_BEHIND_SESSION"):
                              statuses.append(status)
                          else:
                              statuses.append("OTHER")
                      print("TICKFLOW_MCP_CALLS=4", flush=True)
                      print("TICKFLOW_MCP_VALID_BARS=" + str(rows_total), flush=True)
                      print("TICKFLOW_MCP_HISTORICAL=" + (
                          "PASS" if statuses == ["PASS"] * 4 else "BLOCKED"), flush=True)
                      print("TICKFLOW_MCP_PROVIDER_FINALITY=NOT_VERIFIED", flush=True)
                      print("TICKFLOW_MCP_CHATGPT_APP=NOT_VERIFIED", flush=True)
                      print("RADAR_ADMISSION=BLOCKED", flush=True)
                      print("LIVE_TRADE=NO", flush=True)
                      return 0 if statuses == ["PASS"] * 4 else 2

          raise SystemExit(asyncio.run(asyncio.wait_for(main(), timeout=35)))
          PY
          REMOTE
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$(jq -cn --arg command "$remote" '{commands:[$command]}')" --timeout-seconds 80 --query Command.CommandId --output text)"
          test -n "$command_id"
          state=""
          for _ in $(seq 1 40); do
            state="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 2
          done
          raw="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
          for evidence in 'TICKFLOW_MCP_PROTOCOL=PASS' 'TICKFLOW_MCP_TOOL_DISCOVERY=PASS' 'TICKFLOW_MCP_CALLS=4' 'TICKFLOW_MCP_VALID_BARS=4' 'TICKFLOW_MCP_HISTORICAL=PASS' 'TICKFLOW_MCP_PROVIDER_FINALITY=NOT_VERIFIED' 'TICKFLOW_MCP_CHATGPT_APP=NOT_VERIFIED' 'RADAR_ADMISSION=BLOCKED' 'LIVE_TRADE=NO'; do
            if ! grep -Fxq "$evidence" <<<"$raw"; then
              echo 'TICKFLOW_MCP_LOOPBACK=BLOCKED'
              echo 'PRIVATE_SSM_OUTPUT_WITHHELD=YES'
              exit 1
            fi
            echo "$evidence"
          done
          test "$state" = Success
          echo 'TICKFLOW_MCP_LOOPBACK=PASS'
