name: Probe US Cloud Exact Main (Read-Only)

on:
  # Exact GitHub Owner-only read-only EC2 probe without local PC.
  # No untrusted comment may reach AWS OIDC.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Bounded read-only observation window"
        required: true
        type: choice
        default: "30"
        options:
          - "30"
          - "60"
      symbols:
        description: "Comma-separated canonical US.* symbols to inspect"
        required: false
        default: "US.AMD,US.NVDA,US.TSLA,US.AAPL,US.QQQ,US.GLDM,US.LITE,US.AAOI,US.CIEN"

permissions:
  id-token: write
  contents: read

concurrency:
  group: probe-us-cloud-exact-main
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 708 &&
          github.event.issue.pull_request != null &&
          github.actor == github.repository_owner &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/stock-razor us-exact-cloud read-only'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize owner comment, immutable main, fixed US scope before AWS OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
              .issue.number == 708 and
              (.issue.pull_request != null) and
              .sender.login == $owner and
              .comment.user.login == $owner and
              .comment.author_association == "OWNER" and
              .comment.body == "/stock-razor us-exact-cloud read-only"
            ' "$GITHUB_EVENT_PATH" >/dev/null
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          echo 'US_EXACT_PROBE_MAIN_OWNER=VERIFIED'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: us-cloud-exact-readonly-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Run bounded US-only read-only probe
        shell: bash
        env:
          DURATION_SECONDS: ${{ github.event_name == 'issue_comment' && '30' || inputs.duration_seconds }}
          SYMBOLS: ${{ github.event_name == 'issue_comment' && 'US.AMD,US.NVDA,US.TSLA,US.AAPL,US.QQQ,US.GLDM,US.LITE,US.AAOI,US.CIEN' || inputs.symbols }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "${{ github.sha }}"
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          test -f scripts/probe_us_cloud_exact.py
          [[ "$DURATION_SECONDS" == "30" || "$DURATION_SECONDS" == "60" ]] || {
            echo "US_EXACT_CLOUD_PROBE_INVALID_DURATION" >&2; exit 2;
          }
          # Never put unvalidated workflow_dispatch input into the SSM shell.
          [[ "$SYMBOLS" =~ ^US\.[A-Z0-9.]{1,12}(,US\.[A-Z0-9.]{1,12}){0,11}$ ]] || {
            echo "US_EXACT_CLOUD_PROBE_INVALID_SYMBOLS" >&2; exit 2;
          }
          # Avoid public-source cloud pulls. Transmit source bytes from the
          # exact reviewed runner checkout over existing fixed-target SSM.
          probe_hash="$(sha256sum scripts/probe_us_cloud_exact.py | cut -d' ' -f1)"
          packed="$(gzip -n -9 -c scripts/probe_us_cloud_exact.py | base64 -w0)"
          test -n "$packed"
          # Target AWS-RunShellScript executes POSIX sh; no bash-only flags.
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          printf '%s' '$packed' | base64 -d | gzip -d > "\$stage/probe.py"
          printf '%s  %s\n' '$probe_hash' "\$stage/probe.py" | sha256sum -c - >/dev/null
          python3 "\$stage/probe.py" --expected-sha '$revision' --duration-seconds '$DURATION_SECONDS' --symbols '$SYMBOLS' --ssm-summary-only
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 16000 || {
            echo "US_EXACT_CLOUD_PROBE_SSM_PAYLOAD_TOO_LARGE" >&2; exit 2;
          }
          command="$remote"
          params="$(jq -cn --arg c "$command" '{commands:[$c]}')"
          # Immutable reviewed source still matches protected main at SSM spend gate.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 180 --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 80); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                report="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
                # The original report embeds detailed cloud heartbeat and Radar
                # payloads; never mirror it into PUBLIC GitHub Actions logs.
                printf '%s' "$report" | python3 -c '
          import json,sys
          x=json.load(sys.stdin)
          assert x.get("schema") == "stock_razor_us_exact_cloud_probe_v1"
          assert x.get("radar_admission") == "BLOCKED"
          assert x.get("source_arbiter_admission") == "BLOCKED"
          assert x.get("live_trade") == "NO"
          def qual(value):
              return value if value in ("PASS", "NOT_VERIFIED") else "NOT_VERIFIED"
          exact_sha = qual(x.get("runtime_exact_sha"))
          print("US_EXACT_CLOUD_PROBE_SANITIZED="+json.dumps({
              "runtime_exact_sha":exact_sha,
              "sequence":qual((x.get("continuous_live_quote_sequence") or {}).get("status")),
              "timestamp_freshness":qual((x.get("timestamp_freshness") or {}).get("status")),
              "bar_closure_15m_60m":qual((x.get("bar_closure_15m_60m") or {}).get("status")),
              "radar_admission":"BLOCKED",
              "source_arbiter_admission":"BLOCKED",
              "live_trade":"NO",
          },sort_keys=True))
          # A successful SSM transport is not proof that deployed US services
          # match the immutable git revision of this probe.
          if exact_sha != "PASS":
              print("US_EXACT_CLOUD_RUNTIME_SHA=NOT_VERIFIED", file=sys.stderr)
              sys.exit(3)
          '
                echo 'US_EXACT_CLOUD_PROBE_EXECUTED=YES'
                echo 'RADAR_ADMISSION=BLOCKED'
                echo 'SOURCE_ARBITER_ADMISSION=BLOCKED'
                echo 'LIVE_TRADE=NO'
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "US_EXACT_CLOUD_PROBE=$status" >&2
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query 'ResponseCode' --output text 2>/dev/null | sed 's/^/US_EXACT_CLOUD_PROBE_RESPONSE_CODE=/' >&2 || true
                echo 'US_EXACT_CLOUD_PROBE_SSM_STDERR_WITHHELD=YES' >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          echo 'US_EXACT_CLOUD_PROBE=TIMEOUT' >&2
          exit 1
