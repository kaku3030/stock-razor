name: Qualify AWS OpenD Native K-Line Limits (Read Only)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: opend-native-kline-bounded-readonly
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current exact protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          python3 -m py_compile scripts/benchmark_opend_native_klines_readonly.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: opend-kline-read-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Collect actual OpenD native K-line timings through SSM
        shell: bash
        run: |
          set -euo pipefail
          script_b64="$(base64 -w0 scripts/benchmark_opend_native_klines_readonly.py)"
          # Code-only transfer. No account secrets or provider prices.
          cmd="printf '%s' '$script_b64' | base64 -d | HOME=/root /opt/stock-razor-opend-client/venv/bin/python -"
          params="$(jq -cn --arg script "$cmd" '{commands:[$script]}')"
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" \
            --timeout-seconds 170 --query Command.CommandId --output text)"
          state="UNKNOWN"
          for _ in $(seq 1 100); do
            state="$(aws ssm get-command-invocation --command-id "$command_id" \
               --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 2
          done
          if [ "$state" != Success ]; then
            echo "OPEND_NATIVE_BENCHMARK_SSM=$state"
            echo 'PRIVATE_SSM_STDERR_WITHHELD=YES'
            exit 1
          fi
          raw="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null)"
          if [ "$(printf '%s' "$raw" | wc -c)" -gt 24000 ]; then
            echo 'OPEND_NATIVE_BENCHMARK_OVERSIZE=BLOCKED'
            exit 1
          fi
          # OpenD Python may emit SDK diagnostic lines alongside its single
          # JSON report. Parse ONLY well-formed JSON lines of the exact schema;
          # do not expose untrusted log lines, provider payloads or exceptions.
          printf '%s' "$raw" | jq -Rsec '
            [split("\n")[] | try fromjson catch empty
              | select(type=="object"
                       and .schema=="stock_razor_opend_native_kline_bounded_benchmark_v1")] as $reports
            | if ($reports | length)==1 then $reports[0]
              else error("EXPECTED_EXACTLY_ONE_SANITIZED_JSON_REPORT") end
            | select(.schema=="stock_razor_opend_native_kline_bounded_benchmark_v1"
              and .source=="FUTU_OPEND_NATIVE_GET_CUR_KLINE"
              and .subscription_changes==0
              and .historical_quota_consumed_by_explicit_history_api==0
              and .radar_admission=="BLOCKED"
              and .source_arbiter_admission=="BLOCKED"
              and .live_trade==false
              and .max_calls==65
              and (.results | type)=="array")
            | {schema,observed_utc,source,market,status,connection,
              subscription_discovery,subscription_scope,preexisting_symbol_timeframe_pairs,
              preexisting_codes,preexisting_periods,
              call_count,native_p50_ms,native_p95_ms,repeat_p50_ms,
              repeat_p95_ms,repeated_passes,repeated_failures,
              errors,provider_rejected,quality_blocked,total_elapsed_s,
              results,subscription_changes,radar_admission,
              source_arbiter_admission,live_trade}
          '
          echo 'OPEND_NATIVE_BENCHMARK_SSM=PASS_EXECUTED'
          echo 'OPEND_NATIVE_BENCHMARK_24X7=NOT_VERIFIED'
          echo 'OPEND_SUBSCRIPTION_CHANGES=NONE'
          echo 'RADAR_ADMISSION=BLOCKED'
          echo 'LIVE_TRADE=NO'
