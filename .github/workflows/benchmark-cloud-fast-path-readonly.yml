name: Benchmark AWS Cloud Fast-Path Reads

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: benchmark-readonly-cloud-fast-path
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Configure temporary AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: cloud-fast-path-read-benchmark
          aws-region: ap-northeast-1
      - name: Check fixed SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online
      - name: Collect diagnostic-only read latency over SSM
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' remote <<'REMOTE' || true
          set -euo pipefail
          repo=/opt/stock-razor-mcp/repo
          python_bin=/opt/stock-razor-mcp/venv/bin/python
          test -x "$python_bin"
          test -f "$repo/scripts/benchmark_cloud_fast_path_reads.py"
          cd "$repo"
          export PYTHONPATH="$repo"
          export STOCK_RAZOR_US_LIVEFEED_STATUS_PATH=/run/stock-razor-us-livefeed/latest-heartbeat.json
          export STOCK_RAZOR_US_CANONICAL_SNAPSHOT_PATH=/run/stock-razor-us-livefeed/canonical-market-snapshot.json
          export STOCK_RAZOR_US_RADAR_STATUS_PATH=/run/stock-razor-us-radar/latest-research-state.json
          export STOCK_RAZOR_CN_EASTMONEY_STATUS_PATH=/run/stock-razor-cn-eastmoney/latest-observation.json
          export STOCK_RAZOR_CN_RADAR_STATUS_PATH=/run/stock-razor-cn-radar/latest-research-state.json
          deployed_sha="$(git rev-parse HEAD)"
          for market in us cn; do
            if [ "$market" = us ]; then
              report="$("$python_bin" scripts/benchmark_cloud_fast_path_reads.py --market us --symbols AMD NVDA TSLA QQQ --iterations 30)"
            else
              report="$("$python_bin" scripts/benchmark_cloud_fast_path_reads.py --market cn --symbols 159611 518880 --timeframe 15m --iterations 30)"
            fi
            printf '%s' "$report" | DEPLOYED_SHA="$deployed_sha" "$python_bin" -c '
          import json,os,sys
          data=json.load(sys.stdin)
          summary=data["summary"]
          assert data["missing_layers_are_not_inferred"] is True
          assert summary["radar_admission"] == "BLOCKED"
          assert summary["live_trade"] is False
          assert summary["can_confirm_signal"] is False
          selected=("provider_latency_ms","provider_callback_processing_latency_ms",
                    "provider_request_path_latency_ms","canonical_latency_ms",
                    "radar_analysis_latency_ms","radar_read_latency_ms",
                    "data_to_radar_latency_ms","mcp_latency_ms","e2e_latency_ms")
          report={
             "market":data["samples"][0]["market"] if data["samples"] else None,
             "status":summary["status"],
             "runtime_repo_sha":os.environ.get("DEPLOYED_SHA"),
             "sample_count":summary["sample_count"],
             "measurement_scope":"REPEATED_READ_DIAGNOSTICS_ONLY",
             "percentiles_not_provider_slo":True,
             "metrics":{key:summary["metrics"].get(key) for key in selected},
             "radar_admission":"BLOCKED",
             "live_trade":"NO",
             "off_pc_independent_acquisition":"NOT_VERIFIED",
          }
          print(json.dumps(report,sort_keys=True))
          '
          done
          echo "CLOUD_FAST_PATH_READ_DIAGNOSTICS=COLLECTED"
          echo "PROVIDER_AND_END_TO_END_SLO=NOT_VERIFIED"
          echo "RADAR_ADMISSION=BLOCKED"
          echo "LIVE_TRADE=NO"
          REMOTE
          encoded="$(printf '%s' "$remote" | base64 -w0)"
          params="$(jq -cn --arg c "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$c]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$params" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                echo 'AWS_READ_BENCHMARK_EXECUTED=YES'
                echo 'AWS_READ_BENCHMARK_SLO_QUALIFIED=NO'
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "AWS_READ_BENCHMARK_FAILED=$status" >&2
                exit 1 ;;
            esac
            sleep 3
          done
          echo "AWS_READ_BENCHMARK_TIMEOUT" >&2
          exit 1
