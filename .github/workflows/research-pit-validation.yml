name: Research PIT Validation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Research Universe Capture workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "Artifact name, e.g. research-universe-123"
        required: true
        type: string
      approver:
        description: "Human approver identifier"
        required: true
        type: string
      reason:
        description: "Approval reason"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  pit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download approved-by-operator artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          mkdir -p artifacts/pit
          python - <<'PY'
          import json, os, pathlib, urllib.request
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          wanted = os.environ["ARTIFACT_NAME"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              items = json.load(response)["artifacts"]
          matches = [item for item in items if item["name"] == wanted and not item["expired"]]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one unexpired artifact named {wanted}")
          item = matches[0]
          download = urllib.request.Request(
              item["archive_download_url"],
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(download) as response:
              pathlib.Path("artifacts/pit/artifact.zip").write_bytes(response.read())
          print(json.dumps({"artifact": item["name"], "size": item["size_in_bytes"], "digest": item.get("digest")}))
          PY
          unzip -q artifacts/pit/artifact.zip -d artifacts/pit/data
      - name: Approve captures after operator confirmation
        env:
          APPROVER: ${{ inputs.approver }}
          REASON: ${{ inputs.reason }}
        run: |
          shopt -s nullglob
          manifests=(artifacts/pit/data/**/*.manifest.json artifacts/pit/data/*.manifest.json)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            csv="${manifest%.manifest.json}"
            if [ -f "$csv" ]; then
              python scripts/approve_research_capture.py --csv "$csv" --manifest "$manifest" --approver "$APPROVER" --reason "$REASON"
            fi
          done
      - name: Require PIT-approved manifests
        run: |
          shopt -s nullglob
          for manifest in artifacts/pit/data/**/*.manifest.json artifacts/pit/data/*.manifest.json; do
            test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$manifest")" = "PIT_APPROVED"
          done
      - name: Run strict recorded-capture validation
        run: |
          shopt -s nullglob
          for manifest in artifacts/pit/data/**/*.manifest.json artifacts/pit/data/*.manifest.json; do
            csv="${manifest%.manifest.json}"
            [ -f "$csv" ] || continue
            python scripts/validate_recorded_capture.py --csv "$csv" --manifest "$manifest" --dataset-id "pit-$(basename "$csv" .csv)" --dataset-version "${GITHUB_SHA:0:12}" --require-pit-approved
          done
      - name: Upload PIT validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pit-validation-${{ github.run_id }}
          path: artifacts/pit/data/
          if-no-files-found: error
          retention-days: 14
