name: Audit Read-Only Cloud Runtime

on:
  workflow_dispatch:
  # Owner-only ChatGPT/GitHub status command. No cron or additional AWS IAM.
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read

concurrency:
  group: audit-readonly-cloud-runtime
  cancel-in-progress: false

jobs:
  audit:
    # Public repo comments cannot reach AWS OIDC unless the verified GitHub
    # identity, fixed PR and literal action all match.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 665 &&
        github.event.issue.pull_request != null &&
        github.actor == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/stock-razor aws-audit read-only'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout immutable main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate owner-only comment before AWS OIDC
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authorize_cloud_ops_audit_comment.py

      - name: Verify protected main and checkout before AWS OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'AUDIT_NON_MAIN_REF_BLOCKED' >&2
            exit 2
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'AUDIT_CHECKOUT_SHA_MISMATCH' >&2
            exit 2
          fi
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" || {
            echo 'AUDIT_MAIN_LOOKUP_BLOCKED' >&2
            exit 2
          }
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo 'AUDIT_MAIN_MOVED_ABORT' >&2
            exit 2
          fi

      - name: Configure temporary GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: cloud-runtime-readonly-audit
          aws-region: ap-northeast-1
      - name: Verify read-only SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online
      - name: Audit deployed runtime components without state changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script_sha="$(git rev-parse HEAD)"
          # Use the reviewed immutable workflow commit, never a mutable ref.
          test "$script_sha" = "${{ github.sha }}"
          test -f scripts/audit_cloud_runtime_readonly.py
          # Deliver checked-out bytes through existing SSM, no external Git
          # fetch, additional S3/SSH/PAT credentials or remote Git checkout.
          source_hash="$(sha256sum scripts/audit_cloud_runtime_readonly.py | cut -d' ' -f1)"
          source_b64="$(base64 -w0 < scripts/audit_cloud_runtime_readonly.py)"
          # SSM AWS-RunShellScript invokes /bin/sh on the target; keep
          # the remote payload POSIX-compatible (no bash-only pipefail).
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          printf '%s' '$source_b64' | base64 -d > "\$stage/audit.py"
          printf '%s  %s\n' '$source_hash' "\$stage/audit.py" | sha256sum -c - >/dev/null
          python3 "\$stage/audit.py" --interval-seconds 15
          REMOTE
          # Refuse oversized SSM requests; do not fall back to public URLs.
          test "$(printf '%s' "$remote" | wc -c)" -le 18000 || {
            echo 'PRIVATE_SAFE_AUDIT_SSM_PAYLOAD_TOO_LARGE' >&2
            exit 2
          }
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          # Recheck immediately before SSM; main may move after pre-OIDC.
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" || {
            echo 'AUDIT_PRE_SSM_MAIN_LOOKUP_BLOCKED' >&2
            exit 2
          }
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo 'AUDIT_PRE_SSM_MAIN_MOVED_ABORT' >&2
            exit 2
          fi
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$params" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)"
          test -n "$command_id"
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                report="$(aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text)"
                printf '%s' "$report" | python3 -c '
          import json,sys
          result=json.load(sys.stdin)
          assert result.get("schema") == "stock_razor_cloud_runtime_readonly_audit_v1"
          assert result.get("radar_admission") == "BLOCKED"
          assert result.get("live_trade") == "NO"
          assert result.get("can_confirm_signal") is False
          assert result.get("off_pc_independent_acquisition") == "NOT_VERIFIED"
          print(json.dumps(result,sort_keys=True))
          '
                echo 'AWS_RUNTIME_AUDIT_EXECUTED=YES'
                echo 'AWS_OFF_PC_INDEPENDENCE=NOT_VERIFIED'
                echo 'RADAR_ADMISSION=BLOCKED'
                echo 'LIVE_TRADE=NO'
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "AWS_RUNTIME_AUDIT_SSM_FAILED=$status" >&2
                exit 1
                ;;
            esac
            sleep 3
          done
          echo "AWS_RUNTIME_AUDIT_SSM_TIMEOUT" >&2
          exit 1
