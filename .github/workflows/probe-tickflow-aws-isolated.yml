name: TickFlow AWS Isolated Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only isolated cloud probe (no premium entitlement)"
        required: true
        type: choice
        default: metadata
        options:
          - metadata
          - free

permissions:
  id-token: write
  contents: read

concurrency:
  group: tickflow-aws-isolated-smoke
  cancel-in-progress: false

jobs:
  cloud-isolated-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout pinned main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configure AWS temporary GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-isolated-cloud-smoke
          aws-region: ap-northeast-1
      - name: Ensure existing SSM instance is Online
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -Fx Online
      - name: Run hash-pinned isolated SDK smoke
        shell: bash
        env:
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$PROBE_MODE" == metadata || "$PROBE_MODE" == free ]]
          script_sha="$(git rev-parse HEAD)"
          [[ "$script_sha" =~ ^[0-9a-f]{40}$ ]]
          bootstrap_hash="$(sha256sum ops/aws/run_tickflow_cloud_isolated_smoke.sh | cut -d' ' -f1)"
          probe_hash="$(sha256sum scripts/probe_tickflow_isolated.py | cut -d' ' -f1)"
          requirements_hash="$(sha256sum ops/requirements/tickflow-isolated-v0.1.txt | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/kaku3030/stock-razor/$script_sha/ops/aws/run_tickflow_cloud_isolated_smoke.sh"

          read -r -d '' remote <<REMOTE || true
          set -euo pipefail
          temp_dir=\$(mktemp -d -t sr-tickflow-bootstrap.XXXXXXXX)
          trap 'rm -rf "\$temp_dir"' EXIT
          curl --fail --silent --show-error --max-time 20 '$url' -o "\$temp_dir/bootstrap.sh" 2>/dev/null
          printf '%s  %s\n' '$bootstrap_hash' "\$temp_dir/bootstrap.sh" | sha256sum -c - >/dev/null
          bash "\$temp_dir/bootstrap.sh" '$script_sha' '$PROBE_MODE' '$probe_hash' '$requirements_hash'
          REMOTE

          encoded="$(printf '%s' "$remote" | base64 -w0)"
          parameters="$(jq -cn --arg cmd "printf '%s' '$encoded' | base64 -d | bash" '{commands:[$cmd]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --parameters "$parameters" \
            --timeout-seconds 240 \
            --query 'Command.CommandId' --output text)"
          [[ -n "$command_id" && "$command_id" != None ]]
          for _ in $(seq 1 75); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                report="$(aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text)"
                printf '%s\n' "$report" | grep -Fx 'TICKFLOW_CLOUD_SOURCE_INTEGRITY=PASS'
                printf '%s\n' "$report" | grep -Fx 'TICKFLOW_CLOUD_SDK_IMPORT=PASS'
                printf '%s\n' "$report" | grep -Fx 'TICKFLOW_CLOUD_ISOLATED_SMOKE_EXECUTED=YES'
                printf '%s\n' "$report" | grep -Fx 'TICKFLOW_CLOUD_DATA_ADMISSION=BLOCKED'
                printf '%s\n' "$report" | grep -Fx 'LIVE_TRADE=NO'
                summary="$(printf '%s\n' "$report" | grep -E '^[{]' | tail -n1)"
                printf '%s' "$summary" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          assert data.get("schema") == "stock_razor_tickflow_isolated_probe_v0_1"
          assert data.get("location") == "AWS_TOKYO_SSM_ISOLATE"
          assert data.get("mode") in ("metadata","free")
          assert data.get("data_qualification") == "NOT_VERIFIED"
          assert data.get("source_arbiter_admission") == "BLOCKED"
          assert data.get("radar_admission") == "BLOCKED"
          assert data.get("live_trade") is False
          assert data.get("can_confirm_signal") is False
          print(json.dumps(data,sort_keys=True))
          '
                echo 'CLOUD_TICKFLOW_PREMIUM_ENTITLEMENT=NOT_VERIFIED'
                echo 'CLOUD_TICKFLOW_PROVIDER_ADMISSION=BLOCKED'
                exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "CLOUD_TICKFLOW_PROBE_COMMAND=$status" >&2
                exit 1 ;;
            esac
            sleep 3
          done
          echo 'CLOUD_TICKFLOW_PROBE_TIMEOUT' >&2
          exit 1
