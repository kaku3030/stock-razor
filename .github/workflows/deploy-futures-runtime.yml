name: Deploy Read-Only Futures Runtime

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-read-only-futures-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bind deployment SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || true
          sha="$(git rev-parse HEAD)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: futures-runtime-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify fixed SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          test "$(aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE_ID" --query 'Reservations[0].Instances[0].InstanceId' --output text)" = "$TARGET_INSTANCE_ID"
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].InstanceId' --output text)" = "$TARGET_INSTANCE_ID"

      - name: Deploy exact main SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          remote="set -euo pipefail
          cd /tmp
          curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_futures_runtime.sh -o /tmp/install_futures_runtime.sh
          chmod 0755 /tmp/install_futures_runtime.sh
          REPO_REF=$REPO_REF /tmp/install_futures_runtime.sh
          systemctl is-active stock-razor-futures.service
          systemctl is-enabled stock-razor-futures.service
          journalctl -u stock-razor-futures.service -n 20 --no-pager | tail -n 20"
          commands="$(jq -cn --arg c "$remote" '[ $c ]')"
          command_id="$(aws ssm send-command             --document-name AWS-RunShellScript             --instance-ids "$TARGET_INSTANCE_ID"             --parameters "commands=$commands"             --query 'Command.CommandId' --output text)"
          test -n "$command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait and collect runtime evidence
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM_STATUS=$status"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$TARGET_INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          test "$status" = "Success"
          out="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s\n' "$out"
          grep -q '^active$' <<<"$out"
          grep -q '^enabled$' <<<"$out"
          grep -q '"type":"futures_runtime_heartbeat"' <<<"$out"
          grep -q '"live_trade":false' <<<"$out"
          echo "FUTURES_AWS_RUNTIME_DEPLOYMENT=PASS"
          echo "CLOUD_RUNTIME=NOT_VERIFIED"
          echo "PC_OFF_INDEPENDENCE=NOT_VERIFIED"
          echo "LIVE_TRADE=NO"
