name: Deploy Read-Only Futures Runtime

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-read-only-futures-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Bind deployment SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: futures-runtime-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify fixed SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,PlatformName:PlatformName,PlatformVersion:PlatformVersion,LastPingDateTime:LastPingDateTime}' --output json
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].InstanceId' --output text)" = "$TARGET_INSTANCE_ID"
      - name: Deploy exact main SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          remote_script="$(cat <<REMOTE
          set -euo pipefail
          cd /tmp
          curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_futures_runtime.sh -o /tmp/install_futures_runtime.sh
          chmod 0755 /tmp/install_futures_runtime.sh
          REPO_REF=$REPO_REF /tmp/install_futures_runtime.sh
          systemctl is-active stock-razor-futures.service
          systemctl is-enabled stock-razor-futures.service
          journalctl -u stock-razor-futures.service -n 20 --no-pager | tail -n 20
          REMOTE
          )"
          encoded="$(printf '%s' "$remote_script" | base64 -w0)"
          wrapper="printf '%s' '$encoded' | base64 -d | bash"
          parameters="$(jq -cn --arg c "$wrapper" '{commands:[$c]}')"
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          test -n "$command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Wait and collect runtime evidence
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          invocation="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionElapsedTime:ExecutionElapsedTime,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' --output json)"
          printf '%s\n' "$invocation"
          if [ "$status" != "Success" ]; then
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output json || true
            exit 1
          fi
          out="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          grep -q '^active$' <<<"$out" || { echo "FUTURES_RUNTIME_EVIDENCE_MISSING=SERVICE_ACTIVE" >&2; exit 1; }
          grep -q '^enabled$' <<<"$out" || { echo "FUTURES_RUNTIME_EVIDENCE_MISSING=SERVICE_ENABLED" >&2; exit 1; }
          grep -q '"type":"futures_runtime_heartbeat"' <<<"$out" || { echo "FUTURES_RUNTIME_EVIDENCE_MISSING=HEARTBEAT" >&2; exit 1; }
          grep -q '"live_trade":false' <<<"$out" || { echo "FUTURES_RUNTIME_EVIDENCE_MISSING=LIVE_TRADE_FALSE" >&2; exit 1; }
          echo "FUTURES_AWS_RUNTIME_DEPLOYMENT=PASS"
          echo "CLOUD_RUNTIME=NOT_VERIFIED"
          echo "PC_OFF_INDEPENDENCE=NOT_VERIFIED"
          echo "LIVE_TRADE=NO"
