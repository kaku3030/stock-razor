name: Audit TickFlow Secret Access (Read Only)

on:
  workflow_dispatch:
    inputs:
      secret_ref:
        description: "Fixed existing secret name or exact Tokyo ARN; never enter a key"
        required: true
        type: string
        default: "stock-razor/tickflow/premium-api-key"

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-secret-audit-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Run bounded metadata-only audit over SSM
        shell: bash
        env:
          SECRET_REF: ${{ inputs.secret_ref }}
        run: |
          set -euo pipefail
          [[ "$SECRET_REF" == 'stock-razor/tickflow/premium-api-key' || "$SECRET_REF" =~ ^arn:aws:secretsmanager:ap-northeast-1:888425712426:secret:stock-razor/tickflow/premium-api-key-[A-Za-z0-9+=,.@_-]{6,}$ ]]
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == "${{ github.sha }}" ]]
          script_hash="$(sha256sum ops/aws/audit_tickflow_secret_access.sh | cut -d' ' -f1)"
          payload="$(gzip -n -9 -c ops/aws/audit_tickflow_secret_access.sh | base64 -w0)"
          test -n "$payload"
          read -r -d '' remote <<REMOTE || true
          set -eu
          tmp_dir=\$(mktemp -d -t sr-tickflow-secret-audit-bootstrap.XXXXXXXX)
          trap 'rm -rf "\$tmp_dir"' EXIT
          printf '%s' '$payload' | base64 -d | gzip -d > "\$tmp_dir/audit.sh"
          printf '%s  %s\n' '$script_hash' "\$tmp_dir/audit.sh" | sha256sum -c - >/dev/null
          bash "\$tmp_dir/audit.sh" '$SECRET_REF'
          REMOTE
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$(jq -cn --arg cmd "$remote" '{commands:[$cmd]}')" --timeout-seconds 120 --query 'Command.CommandId' --output text)"
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                report="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
                printf '%s\n' "$report" | grep -Ex 'TICKFLOW_SECRET_AUDIT_(AWS_CLI|CALLER_ROLE|METADATA|DESCRIBE_DENY_CAUSE|NAME_MATCH|ARN_MATCH|KMS_KEY|KMS_METADATA|RESOURCE_POLICY|GET_SECRET|GET_SECRET_DENY_CAUSE|ORGANIZATION_POLICY|SECRETSTRING|MUTATIONS)=[A-Za-z0-9_./-]+' | sort
                printf '%s\n' "$report" | grep -Fx 'RADAR_ADMISSION=BLOCKED'
                printf '%s\n' "$report" | grep -Fx 'LIVE_TRADE=NO'
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                report="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null || true)"
                printf '%s\n' "$report" | grep -Ex 'TICKFLOW_SECRET_AUDIT_(AWS_CLI|BOOTSTRAP|CALLER_ROLE|METADATA|DESCRIBE_DENY_CAUSE|NAME_MATCH|ARN_MATCH|KMS_KEY|KMS_METADATA|RESOURCE_POLICY|GET_SECRET|GET_SECRET_DENY_CAUSE|ORGANIZATION_POLICY|SECRETSTRING|MUTATIONS|FAILED_STAGE)=[A-Za-z0-9_./-]+' | sort || true
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode}' --output json
                echo 'SSM_REMOTE_OUTPUT_GITHUB_LOG=WITHHELD'
                exit 1
                ;;
            esac
            sleep 3
          done
          echo 'TICKFLOW_SECRET_AUDIT=TIMEOUT'
          exit 1
