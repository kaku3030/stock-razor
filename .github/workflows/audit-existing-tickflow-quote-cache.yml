name: Audit Existing TickFlow Premium Cache (Read Only)
on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: "Full SHA of the prior Premium probe. Never paste an API key."
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: tickflow-premium-cache-read-only
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - name: Require precise prior probe SHA
        env:
          PREVIOUS_SHA: ${{ inputs.expected_probe_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: tickflow-cache-readonly-${{ github.run_id }}
          aws-region: ap-northeast-1

      - name: Read existing sanitized local probe evidence without provider IO
        env:
          PREVIOUS_SHA: ${{ inputs.expected_probe_sha }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' remote <<'REMOTE' || true
          set -eu
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          path = Path("/opt/stock-razor-tickflow-premium-probe/last-sanitized-probe.json")
          output = {
              "schema": "stock_razor_tickflow_existing_quote_cache_audit_v0_1",
              "status": "NOT_VERIFIED",
              "reason": "SANITIZED_CACHE_MISSING",
              "sdk_import": "UNKNOWN",
              "quote_request": "UNKNOWN",
              "quote_rows": 0,
              "scope_field": "MISSING",
              "revision_matches": False,
              "data_admission": "BLOCKED",
              "radar_admission": "BLOCKED",
              "source_arbiter_admission": "BLOCKED",
              "live_trade": "NO",
              "provider_requests": 0,
              "subscription_changes": 0,
              "orders_sent": 0,
          }
          try:
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 16000:
                  raise ValueError("CACHE_NOT_TRUSTED")
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict) or value.get("schema") != "stock_razor_tickflow_sanitized_probe_v0_1":
                  raise ValueError("CACHE_SCHEMA_INVALID")
              if not (
                  value.get("data_qualification") == "NOT_VERIFIED"
                  and value.get("radar_admission") == "BLOCKED"
                  and value.get("source_arbiter_admission") == "BLOCKED"
                  and value.get("live_trade") is False
              ):
                  raise ValueError("CACHE_ADMISSION_INVALID")
              expected = os.environ.get("TICKFLOW_EXPECTED_PROBE_SHA", "")
              matches = value.get("repo_sha") == expected
              output["revision_matches"] = matches
              if not matches:
                  output["reason"] = "CACHE_REVISION_MISMATCH"
              scope = value.get("request_scope")
              output["scope_field"] = scope if scope in (
                  "ONE_REALTIME_QUOTE_BATCH_ONLY", "STANDARD_ISOLATED_PROBE"
              ) else "MISSING"
              ops = value.get("operations")
              if not isinstance(ops, list) or len(ops) > 20:
                  raise ValueError("CACHE_OPERATIONS_INVALID")
              for item in ops:
                  if not isinstance(item, dict):
                      raise ValueError("CACHE_OPERATIONS_INVALID")
                  name, state = item.get("name"), item.get("operation")
                  if name not in {"sdk_import", "realtime_quote", "kline_1m", "kline_5m",
                                  "kline_15m", "kline_30m", "kline_60m",
                                  "five_level_depth", "websocket_quote_smoke"}:
                      raise ValueError("CACHE_OPERATIONS_INVALID")
                  if state not in {"COMPLETED", "FAILED", "BLOCKED", "SKIPPED",
                                   "ERROR", "OBSERVED", "NO_EVENTS_OBSERVED", "CLOSE_FAILED"}:
                      raise ValueError("CACHE_OPERATIONS_INVALID")
                  if name == "sdk_import":
                      output["sdk_import"] = state
                  if name == "realtime_quote":
                      output["quote_request"] = state
                      rows = item.get("row_count")
                      if type(rows) is int and 0 <= rows <= 1000:
                          output["quote_rows"] = rows
              if matches:
                  output["status"] = "REVIEW_ONLY"
                  output["reason"] = "CACHED_QUOTE_OPERATION_NOT_FRESHNESS_PROOF"
          except (ValueError, TypeError, OSError, UnicodeError):
              output["status"] = "NOT_VERIFIED"
              output["reason"] = "CACHE_MALFORMED_OR_UNAVAILABLE"
          print("TICKFLOW_CACHE_SANITIZED=" + json.dumps(output, sort_keys=True))
          PY
          REMOTE
          params="$(jq -cn --arg c "export TICKFLOW_EXPECTED_PROBE_SHA='$PREVIOUS_SHA'; $remote" '{commands:[$c]}')"
          cmd="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 75 --query Command.CommandId --output text)"
          [[ "$cmd" =~ ^[0-9a-f-]{36}$ ]]
          state=UNKNOWN
          for _ in $(seq 1 33); do
            state="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$state" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          if [[ "$state" != Success ]]; then
            echo "TICKFLOW_CACHE_AUDIT=SSM_NOT_VERIFIED" >&2
            exit 1
          fi
          output="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          # Never print unparsed remote SSM stdout. Only allowlisted JSON
          # values, never keys, raw prices, symbols or broker/account data.
          printf '%s\n' "$output" | python3 -c '
          import json,sys
          lines=[s for s in sys.stdin.read().splitlines() if s.startswith("TICKFLOW_CACHE_SANITIZED=")]
          assert len(lines) == 1 and len(lines[0]) < 3500
          d=json.loads(lines[0].split("=",1)[1])
          assert d.get("schema") == "stock_razor_tickflow_existing_quote_cache_audit_v0_1"
          assert d.get("radar_admission") == d.get("data_admission") == d.get("source_arbiter_admission") == "BLOCKED"
          assert d.get("live_trade") == "NO" and d.get("provider_requests") == d.get("orders_sent") == 0
          safe={
              "status":d["status"] if d.get("status") in ("REVIEW_ONLY","NOT_VERIFIED") else "NOT_VERIFIED",
              "reason":d["reason"] if d.get("reason") in (
                  "SANITIZED_CACHE_MISSING", "CACHE_REVISION_MISMATCH",
                  "CACHED_QUOTE_OPERATION_NOT_FRESHNESS_PROOF",
                  "CACHE_MALFORMED_OR_UNAVAILABLE"
              ) else "UNRECOGNIZED",
              "quote_request":d["quote_request"] if d.get("quote_request") in (
                  "UNKNOWN","COMPLETED","FAILED","BLOCKED","SKIPPED","ERROR",
                  "OBSERVED","NO_EVENTS_OBSERVED","CLOSE_FAILED"
              ) else "UNKNOWN",
              "sdk_import":d["sdk_import"] if d.get("sdk_import") in (
                  "UNKNOWN","COMPLETED","FAILED","BLOCKED","SKIPPED","ERROR"
              ) else "UNKNOWN",
              "quote_rows":d["quote_rows"] if type(d.get("quote_rows")) is int and 0 <= d["quote_rows"] <= 1000 else 0,
              "scope_field":d["scope_field"] if d.get("scope_field") in (
                  "MISSING","ONE_REALTIME_QUOTE_BATCH_ONLY","STANDARD_ISOLATED_PROBE"
              ) else "MISSING",
              "revision_matches":d.get("revision_matches") is True,
              "radar_admission":"BLOCKED","data_admission":"BLOCKED",
              "source_arbiter_admission":"BLOCKED","live_trade":"NO",
              "provider_requests":0,
          }
          print("TICKFLOW_CACHE_AUDIT_SANITIZED=" + json.dumps(safe,sort_keys=True))
          '
