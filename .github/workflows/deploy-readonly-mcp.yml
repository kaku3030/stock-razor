name: Deploy Canonical Read-Only MCP

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: readonly-mcp-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify fixed SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,PlatformName:PlatformName,PlatformVersion:PlatformVersion,LastPingDateTime:LastPingDateTime}' --output json
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].InstanceId' --output text)" = "$TARGET_INSTANCE_ID"
      - name: Dispatch exact main SHA over SSM
        id: deploy
        shell: bash
        env:
          REPO_REF: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          script="curl -fsSL https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_readonly_mcp.sh -o /tmp/install_readonly_mcp.sh && chmod 0755 /tmp/install_readonly_mcp.sh && REPO_REF=$REPO_REF /tmp/install_readonly_mcp.sh && systemctl is-active stock-razor-mcp.service"
          params="$(jq -cn --arg c "$script" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          test -n "$id"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait and collect deployment evidence
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          invocation="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionElapsedTime:ExecutionElapsedTime,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' --output json)"
          printf '%s\n' "$invocation"
          if [ "$status" != "Success" ]; then
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output json || true
            exit 1
          fi
          out="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          grep -q '^active$' <<<"$out" || { echo "READONLY_MCP_EVIDENCE_MISSING=SERVICE_ACTIVE" >&2; exit 1; }
          echo "READONLY_MCP_AWS_DEPLOYMENT=PASS"
          echo "LIVE_TRADE=NO"
