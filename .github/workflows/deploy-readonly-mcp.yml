name: Deploy Canonical Read-Only MCP

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-canonical-readonly-mcp
  cancel-in-progress: false

jobs:
  deploy:
    # Production service restarts require the authenticated repository owner.
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected main before AWS identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_ACTOR" != "${GITHUB_REPOSITORY%%/*}" ]]; then
            echo 'MCP_DEPLOY_UNAUTHORIZED_REF_OR_ACTOR' >&2
            exit 2
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'MCP_DEPLOY_CHECKOUT_SHA_MISMATCH' >&2
            exit 2
          fi
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" || {
            echo 'MCP_DEPLOY_MAIN_LOOKUP_BLOCKED' >&2
            exit 2
          }
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo 'MCP_DEPLOY_MAIN_MOVED_ABORT' >&2
            exit 2
          fi
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/aws/install_readonly_mcp.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "install_sha=$(sha256sum ops/aws/install_readonly_mcp.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: readonly-mcp-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify fixed SSM target
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,PlatformName:PlatformName,PlatformVersion:PlatformVersion,LastPingDateTime:LastPingDateTime}' --output json
          test "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].InstanceId' --output text)" = "$TARGET_INSTANCE_ID"
      - name: Dispatch exact main SHA over SSM
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_REF: ${{ steps.source.outputs.sha }}
          INSTALL_SHA: ${{ steps.source.outputs.install_sha }}
        run: |
          set -euo pipefail
          [[ "$REPO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INSTALL_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$REPO_REF" = "$GITHUB_SHA"
          # A dispatch may sit in the queue while main changes. Refuse to
          # restart the MCP process from a stale workflow checkout.
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" || {
            echo 'MCP_DEPLOY_PRE_SSM_MAIN_LOOKUP_BLOCKED' >&2
            exit 2
          }
          if [[ "$main_head" != "$REPO_REF" ]]; then
            echo 'MCP_DEPLOY_PRE_SSM_MAIN_MOVED_ABORT' >&2
            exit 2
          fi
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          curl -fsSL --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/kaku3030/stock-razor/$REPO_REF/ops/aws/install_readonly_mcp.sh' \
            -o "\$stage/install.sh"
          printf '%s  %s\n' '$INSTALL_SHA' "\$stage/install.sh" | sha256sum -c - >/dev/null
          if ! REPO_REF='$REPO_REF' bash "\$stage/install.sh" > "\$stage/install.out" 2> "\$stage/install.err"; then
            echo 'READONLY_MCP_INSTALL=BLOCKED' >&2
            exit 1
          fi
          systemctl is-active stock-razor-mcp.service
          REMOTE
          params="$(jq -cn --arg c "$remote" '{commands:[$c]}')"
          id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --query 'Command.CommandId' --output text)"
          test -n "$id"
          echo "command_id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait and collect deployment evidence
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          status=""
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          # PUBLIC repository safety: SSM stdout/stderr can include host
          # environment details or credentials. Never print full invocation,
          # including on failure. Keep only allowlisted operational metadata.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,ExecutionElapsedTime:ExecutionElapsedTime}' \
            --output json
          if [ "$status" != "Success" ]; then
            echo "READONLY_MCP_DEPLOYMENT_STATUS=BLOCKED"
            echo "SSM_DETAILS_REQUIRE_PRIVATE_AWS_ACCESS=YES"
            exit 1
          fi
          # Read stdout for the minimum required evidence, but do not echo it.
          # A remote error should never be mirrored into public Actions logs.
          out="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE_ID" \
            --query StandardOutputContent --output text)"
          grep -Fxq 'active' <<<"$out" || {
            echo "READONLY_MCP_EVIDENCE_MISSING=SERVICE_ACTIVE" >&2
            exit 1
          }
          echo "READONLY_MCP_AWS_DEPLOYMENT=PASS"
          echo "SSM_REMOTE_OUTPUT_GITHUB_LOG=WITHHELD"
          echo "LIVE_TRADE=NO"
