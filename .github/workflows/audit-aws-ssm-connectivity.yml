name: Audit AWS SSM Connectivity

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TARGET_INSTANCE_ID: i-01738342af3efac72
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::888425712426:role/StockRazorGitHubOpsRole
          role-session-name: ssm-connectivity-audit-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Audit EC2 and SSM control-plane state
        shell: bash
        run: |
          set -euo pipefail
          echo "=== CALLER ==="
          aws sts get-caller-identity
          echo "=== EC2 ==="
          aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE_ID" --query 'Reservations[0].Instances[0].{InstanceId:InstanceId,State:State.Name,PrivateIp:PrivateIpAddress,PublicIp:PublicIpAddress,VpcId:VpcId,SubnetId:SubnetId,IamInstanceProfile:IamInstanceProfile.Arn,SecurityGroups:SecurityGroups[*].GroupId,LaunchTime:LaunchTime}' --output json
          echo "=== INSTANCE STATUS ==="
          aws ec2 describe-instance-status --instance-ids "$TARGET_INSTANCE_ID" --include-all-instances --query 'InstanceStatuses[0].{InstanceState:InstanceState.Name,SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status,Events:Events}' --output json
          echo "=== SSM ==="
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,PlatformName:PlatformName,PlatformVersion:PlatformVersion,LastPingDateTime:LastPingDateTime,AssociationStatus:AssociationStatus}' --output json
          echo "AWS_SSM_CONNECTIVITY_AUDIT=COMPLETE"
