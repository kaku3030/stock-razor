name: Audit EC2 Feedback Hub Storage (read only, manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Explicitly audit existing cloud Feedback Hub storage"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ect-feedback-hub-storage-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == true &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AWS_REGION: ap-northeast-1
      FEEDBACK_HUB_PATH: ${{ vars.FEEDBACK_HUB_PATH }}
      TARGET_INSTANCE_ID: ${{ vars.STOCK_RAZOR_ECT_EC2_INSTANCE_ID }}
      EXPECTED_OPS_ROLE_ARN: ${{ vars.STOCK_RAZOR_GITHUB_OPS_ROLE_ARN }}
    steps:
      - name: Checkout protected exact main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify owner, exact main, and bounded target configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          test -f scripts/audit_feedback_hub_ec2_readonly.py
          python3 - <<'PY'
          import os, re
          path = os.environ["FEEDBACK_HUB_PATH"]
          target = os.environ["TARGET_INSTANCE_ID"]
          role = os.environ["EXPECTED_OPS_ROLE_ARN"]
          assert re.fullmatch(r"/[A-Za-z0-9_./-]{1,239}", path)
          assert ".." not in path.split("/")
          assert re.fullmatch(r"i-[0-9a-f]{17}", target)
          assert re.fullmatch(
              r"arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]{1,100}", role
          )
          print("FIXED_TARGET_INPUT_FORMAT=PASS")
          PY
      - name: Assume existing repo-scoped GitHub Ops role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXPECTED_OPS_ROLE_ARN }}
          role-session-name: ect-feedback-hub-readonly-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify SSM target is online
        shell: bash
        run: |
          set -euo pipefail
          state="$(aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          test "$state" = running
          ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)"
          test "$ping" = Online
          echo "EC2_SSM_READONLY_TARGET=PASS"
      - name: Run bounded read-only SQLite probe through existing SSM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"
          script_hash="$(sha256sum scripts/audit_feedback_hub_ec2_readonly.py | cut -d' ' -f1)"
          script_b64="$(base64 -w0 < scripts/audit_feedback_hub_ec2_readonly.py)"
          path_b64="$(printf '%s' "$FEEDBACK_HUB_PATH" | base64 -w0)"
          read -r -d '' remote <<REMOTE || true
          set -eu
          umask 077
          stage=\$(mktemp -d)
          trap 'rm -rf "\$stage"' EXIT
          printf '%s' '$script_b64' | base64 -d > "\$stage/probe.py"
          printf '%s  %s\n' '$script_hash' "\$stage/probe.py" | sha256sum -c - >/dev/null
          python3 "\$stage/probe.py" --db "\$(printf '%s' '$path_b64' | base64 -d)"
          REMOTE
          test "$(printf '%s' "$remote" | wc -c)" -le 18000
          params="$(jq -cn --arg code "$remote" '{commands:[$code]}')"
          cmd="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$TARGET_INSTANCE_ID" --parameters "$params" --timeout-seconds 90 --query Command.CommandId --output text)"
          [[ "$cmd" =~ ^[0-9a-f-]{36}$ ]]
          status=UNKNOWN
          for _ in $(seq 1 40); do
            status="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 2
          done
          test "$status" = Success
          report="$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$TARGET_INSTANCE_ID" --query StandardOutputContent --output text)"
          printf '%s' "$report" | python3 -c '
          import json,sys
          payload=json.load(sys.stdin)
          assert payload.get("schema") == "stock_razor_feedback_hub_ec2_readonly_v1"
          assert payload.get("read_only") is True
          assert payload.get("trading_authority") is False
          assert payload.get("cross_run_persistence") == "NOT_VERIFIED"
          assert payload.get("producer_ingress") == "NOT_VERIFIED"
          assert payload.get("claim_writeback") == "NOT_VERIFIED"
          state=payload.get("status")
          assert state in ("BLOCKED","READBACK_ONLY")
          print("FEEDBACK_HUB_EC2_READONLY="+state)
          print("FEEDBACK_HUB_CROSS_RUN_PERSISTENCE=NOT_VERIFIED")
          print("FEEDBACK_HUB_PRODUCERS=NOT_VERIFIED")
          print("TRADING_AUTHORITY=NO")
          if state != "READBACK_ONLY": raise SystemExit(2)
          assert payload.get("existing_schema") == "PASS"
          assert payload.get("backing") == "NON_VOLATILE_TYPE_OBSERVED_NOT_PROVEN"
          assert isinstance(payload.get("audit_count"),int)
          assert isinstance(payload.get("open_p0"),int)
          assert isinstance(payload.get("open_p1"),int)
          assert len(payload.get("audit_tail_digest",""))==16
          print("FEEDBACK_HUB_EXISTING_SCHEMA=PASS")
          print("FEEDBACK_HUB_NON_VOLATILE_MOUNT_TYPE=OBSERVED_NOT_PROVEN")
          '
